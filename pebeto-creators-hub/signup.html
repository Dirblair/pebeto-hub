<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #ff8c42; }
    .logo { text-align: center; font-size: 28px; font-weight: 800; color: #ff8c42; margin-bottom: 20px; cursor: pointer; }
    .role-selector {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .role-option {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 40px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-option.active {
      background: #ff8c42;
      border-color: #ff8c42;
      color: white;
    }
    .role-option:hover { background: rgba(255,140,66,0.2); }
    input, select {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 14px;
      border-radius: 40px;
      margin-bottom: 15px;
      color: white;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #ff8c42;
    }
    button {
      width: 100%;
      background: #ff8c42;
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: #1a1208;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #e0662c; transform: translateY(-1px); }
    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      padding: 10px;
      border-radius: 20px;
    }
    .message.error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
    .message.success { color: #4caf50; background: rgba(76,175,80,0.1); }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #a08070;
    }
    .login-link a {
      color: #ff8c42;
      text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo" onclick="window.location.href='/'">Pebeto</div>
  <h1>Create Account</h1>
  
  <div class="role-selector">
    <div class="role-option active" data-role="creator" onclick="selectRole('creator')">🎨 Creator</div>
    <div class="role-option" data-role="business" onclick="selectRole('business')">🏢 Business</div>
  </div>
  
  <input type="email" id="email" placeholder="Email address" autocomplete="email">
  <input type="password" id="password" placeholder="Password (min 8 characters)" autocomplete="new-password">
  <input type="password" id="confirm-password" placeholder="Confirm password">
  
  <div id="stage-name-group" style="display: block;">
    <input type="text" id="stage-name" placeholder="Stage Name / Display Name">
  </div>
  <div id="company-name-group" style="display: none;">
    <input type="text" id="company-name" placeholder="Company Name">
  </div>
  
  <button onclick="signup()">Sign Up</button>
  <div id="message" class="message"></div>
  <div class="login-link">Already have an account? <a href="/login.html">Login</a></div>
</div>

<script>
  // ============================================
  // UPDATED: New Render URL
  // ============================================
  const API_BASE = 'https://pebeto-creators-hub-h1j0.onrender.com';
  let selectedRole = 'creator';

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
    document.querySelector(`.role-option[data-role="${role}"]`).classList.add('active');
    
    const stageNameGroup = document.getElementById('stage-name-group');
    const companyNameGroup = document.getElementById('company-name-group');
    
    if (role === 'creator') {
      stageNameGroup.style.display = 'block';
      companyNameGroup.style.display = 'none';
    } else {
      stageNameGroup.style.display = 'none';
      companyNameGroup.style.display = 'block';
    }
  }

  async function signup() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const messageDiv = document.getElementById('message');
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    if (password.length < 8) {
      messageDiv.innerHTML = 'Password must be at least 8 characters';
      messageDiv.className = 'message error';
      return;
    }
    
    if (password !== confirmPassword) {
      messageDiv.innerHTML = 'Passwords do not match';
      messageDiv.className = 'message error';
      return;
    }
    
    const profile = {};
    if (selectedRole === 'creator') {
      const stageName = document.getElementById('stage-name').value;
      if (stageName) profile.stageName = stageName;
    } else {
      const companyName = document.getElementById('company-name').value;
      if (companyName) profile.companyName = companyName;
    }
    
    messageDiv.innerHTML = 'Creating account...';
    messageDiv.className = 'message';
    
    try {
      const response = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: selectedRole, profile })
      });
      const data = await response.json();
      
      if (data.success) {
        messageDiv.innerHTML = 'Account created successfully! Redirecting to login...';
        messageDiv.className = 'message success';
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } else {
        messageDiv.innerHTML = data.message || 'Signup failed. Email may already exist.';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Signup error:', error);
      messageDiv.innerHTML = 'Network error. Please try again.';
      messageDiv.className = 'message error';
    }
  }
</script>
</body>
</html>
