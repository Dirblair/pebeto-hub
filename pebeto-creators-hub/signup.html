<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pebeto - Join or Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a1a0e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container { max-width: 450px; width: 100%; }
    .card {
      background: rgba(25, 20, 18, 0.9);
      border-radius: 32px;
      padding: 40px;
      border: 1px solid rgba(255, 140, 66, 0.3);
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #ff8c42; font-size: 32px; font-weight: 700; }
    .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
    .tab {
      flex: 1; padding: 12px; background: transparent;
      border: 1px solid rgba(255, 140, 66, 0.3); border-radius: 50px;
      color: white; font-weight: 600; cursor: pointer; text-align: center;
    }
    .tab.active { background: linear-gradient(135deg, #ff8c42, #e0662c); border-color: transparent; }
    .form-group { margin-bottom: 20px; }
    label { color: #ffaa77; font-size: 13px; display: block; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 14px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3); border-radius: 12px;
      color: white; font-size: 14px;
    }
    input:focus { outline: none; border-color: #ff8c42; background: rgba(255,140,66,0.1); }
    button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #ff8c42, #e0662c);
      border: none; border-radius: 50px; color: white; font-weight: bold;
      font-size: 15px; cursor: pointer; margin-top: 10px;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 140, 66, 0.3); }
    .hidden { display: none; }
    .alert { padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; }
    .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ffaaaa; }
    .alert-success { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #aaffaa; }
    .footer { text-align: center; margin-top: 25px; color: #a08070; font-size: 13px; }
    .footer a { color: #ffaa77; text-decoration: none; }
    .forgot-link { text-align: right; margin-top: -16px; margin-bottom: 20px; }
    .forgot-link a { color: #ffaa77; font-size: 12px; }
    .sub-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .sub-tab {
      flex: 1; padding: 10px; background: transparent;
      border: 1px solid rgba(255, 140, 66, 0.3); border-radius: 50px;
      color: white; font-weight: 500; cursor: pointer; text-align: center; font-size: 14px;
    }
    .sub-tab.active { background: linear-gradient(135deg, #ff8c42, #e0662c); }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo"><h1>Pebeto</h1></div>

    <div class="tabs">
      <div class="tab active" id="tab-signin">Sign In</div>
      <div class="tab" id="tab-signup">Create Account</div>
    </div>

    <div id="alert" class="alert" style="display: none;"></div>

    <!-- SIGN IN -->
    <div id="signin-panel">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Your password"></div>
      <div class="forgot-link"><a href="#">Forgot password?</a></div>
      <button id="btn-signin">Sign In</button>
    </div>

    <!-- SIGN UP -->
    <div id="signup-panel" class="hidden">
      <div class="sub-tabs">
        <div class="sub-tab active" id="signup-creator-tab">Creator</div>
        <div class="sub-tab" id="signup-brand-tab">Brand</div>
      </div>

      <div id="creator-fields">
        <div class="form-group"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
        <div class="form-group"><label>Niche</label><input type="text" id="signup-niche" placeholder="Music, Comedy, Fashion..."></div>
        <div class="form-group"><label>Password</label><input type="password" id="signup-password" placeholder="At least 8 characters"></div>
        <div class="form-group"><label>Confirm Password</label><input type="password" id="signup-confirm" placeholder="Confirm password"></div>
      </div>

      <div id="brand-fields" class="hidden">
        <div class="form-group"><label>Email</label><input type="email" id="brand-email" placeholder="you@company.com"></div>
        <div class="form-group"><label>Company Name</label><input type="text" id="brand-company" placeholder="Your business name"></div>
        <div class="form-group"><label>Website (optional)</label><input type="url" id="brand-website" placeholder="https://..."></div>
        <div class="form-group"><label>Password</label><input type="password" id="brand-password" placeholder="At least 8 characters"></div>
        <div class="form-group"><label>Confirm Password</label><input type="password" id="brand-confirm" placeholder="Confirm password"></div>
      </div>

      <button id="btn-signup">Join as Creator</button>
    </div>

    <div class="footer"><a href="#" id="switch-to-signup">Don't have an account? Create one</a></div>
  </div>
</div>

<script>
  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const signinPanel = document.getElementById('signin-panel');
  const signupPanel = document.getElementById('signup-panel');
  const switchLink = document.getElementById('switch-to-signup');
  const alertDiv = document.getElementById('alert');

  let signupRole = 'creator';

  tabSignin.onclick = () => {
    tabSignin.classList.add('active');
    tabSignup.classList.remove('active');
    signinPanel.classList.remove('hidden');
    signupPanel.classList.add('hidden');
    alertDiv.style.display = 'none';
  };

  tabSignup.onclick = () => {
    tabSignup.classList.add('active');
    tabSignin.classList.remove('active');
    signupPanel.classList.remove('hidden');
    signinPanel.classList.add('hidden');
    alertDiv.style.display = 'none';
  };

  switchLink.onclick = (e) => {
    e.preventDefault();
    tabSignup.click();
  };

  const signupCreatorTab = document.getElementById('signup-creator-tab');
  const signupBrandTab = document.getElementById('signup-brand-tab');
  const creatorFields = document.getElementById('creator-fields');
  const brandFields = document.getElementById('brand-fields');
  const signupBtn = document.getElementById('btn-signup');

  signupCreatorTab.onclick = () => {
    signupRole = 'creator';
    signupCreatorTab.classList.add('active');
    signupBrandTab.classList.remove('active');
    creatorFields.classList.remove('hidden');
    brandFields.classList.add('hidden');
    signupBtn.innerText = 'Join as Creator';
  };

  signupBrandTab.onclick = () => {
    signupRole = 'brand';
    signupBrandTab.classList.add('active');
    signupCreatorTab.classList.remove('active');
    brandFields.classList.remove('hidden');
    creatorFields.classList.add('hidden');
    signupBtn.innerText = 'Join as Brand';
  };

  function showAlert(msg, type) {
    alertDiv.style.display = 'block';
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = msg;
    setTimeout(() => alertDiv.style.display = 'none', 4000);
  }

  function saveSession(token, user) {
    localStorage.setItem('pebeto_token', token);
    localStorage.setItem('pebeto_user', JSON.stringify(user));
    console.log('✅ Session saved for:', user.email, 'Role:', user.role);
  }

  function redirectToDashboard(role) {
    console.log('🔄 Redirecting with role:', role);
    
    let url = '/';
    if (role === 'admin') {
      url = '/admin.html';
    } else if (role === 'business') {
      url = '/business.html';
    } else if (role === 'creator') {
      url = '/creator-hub.html';
    }
    
    console.log('🔗 Redirecting to:', url);
    window.location.href = url;
  }

  // Sign In
  document.getElementById('btn-signin').onclick = async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showAlert('Email and password required', 'error');
    const btn = document.getElementById('btn-signin');
    btn.disabled = true; btn.innerText = 'Signing in...';
    try {
      const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Invalid credentials');
      saveSession(data.token, data.user);
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => redirectToDashboard(data.user.role), 1000);
    } catch (err) { showAlert(err.message, 'error'); btn.disabled = false; btn.innerText = 'Sign In'; }
  };

  // Sign Up
  document.getElementById('btn-signup').onclick = async () => {
    if (signupRole === 'creator') {
      const email = document.getElementById('signup-email').value.trim();
      const niche = document.getElementById('signup-niche').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (!email) return showAlert('Email required', 'error');
      if (!niche) return showAlert('Niche required', 'error');
      if (password.length < 8) return showAlert('Password must be 8+ characters', 'error');
      if (password !== confirm) return showAlert('Passwords do not match', 'error');
      const btn = document.getElementById('btn-signup');
      btn.disabled = true; btn.innerText = 'Creating...';
      try {
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, role: 'creator', profile: { stageName: email.split('@')[0], niche, displayName: email.split('@')[0] } }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');
        const loginRes = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const loginData = await loginRes.json();
        if (loginRes.ok) { saveSession(loginData.token, loginData.user); showAlert('Account created! Redirecting...', 'success'); setTimeout(() => redirectToDashboard('creator'), 1500); }
        else { showAlert('Account created! Please sign in.', 'success'); setTimeout(() => tabSignin.click(), 1500); }
      } catch (err) { showAlert(err.message, 'error'); btn.disabled = false; btn.innerText = 'Join as Creator'; }
    } else {
      const email = document.getElementById('brand-email').value.trim();
      const company = document.getElementById('brand-company').value.trim();
      const website = document.getElementById('brand-website').value.trim();
      const password = document.getElementById('brand-password').value;
      const confirm = document.getElementById('brand-confirm').value;
      if (!email) return showAlert('Email required', 'error');
      if (!company) return showAlert('Company name required', 'error');
      if (password.length < 8) return showAlert('Password must be 8+ characters', 'error');
      if (password !== confirm) return showAlert('Passwords do not match', 'error');
      const btn = document.getElementById('btn-signup');
      btn.disabled = true; btn.innerText = 'Creating...';
      try {
        const profile = { companyName: company, displayName: company };
        if (website) profile.website = website;
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, role: 'business', profile }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');
        const loginRes = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const loginData = await loginRes.json();
        if (loginRes.ok) { saveSession(loginData.token, loginData.user); showAlert('Account created! Redirecting...', 'success'); setTimeout(() => redirectToDashboard('business'), 1500); }
        else { showAlert('Account created! Please sign in.', 'success'); setTimeout(() => tabSignin.click(), 1500); }
      } catch (err) { showAlert(err.message, 'error'); btn.disabled = false; btn.innerText = 'Join as Brand'; }
    }
  };
</script>
</body>
</html>
