<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>My Bids - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,140,66,0.2);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 800; color: #ff8c42; cursor: pointer; }
    .nav-icons { display: flex; gap: 15px; align-items: center; }
    .dashboard-btn {
      background: rgba(255,140,66,0.15);
      border: 1px solid #ff8c42;
      padding: 8px 20px;
      border-radius: 40px;
      color: #ffaa77;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dashboard-btn:hover { background: #ff8c42; color: white; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      background-size: cover;
      cursor: pointer;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 24px; color: #ff8c42; display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: rgba(255,140,66,0.15);
      border: 1px solid #ff8c42;
      padding: 8px 20px;
      border-radius: 40px;
      color: #ffaa77;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }
    .back-btn:hover { background: #ff8c42; color: white; }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,140,66,0.2);
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 24px;
      color: #b8a99a;
      font-weight: 500;
      cursor: pointer;
      border-radius: 40px 40px 0 0;
    }
    .tab-btn.active { color: #ff8c42; border-bottom: 2px solid #ff8c42; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .data-table th { color: #a08070; font-weight: 500; font-size: 13px; }
    .data-table tr:hover { background: rgba(255,140,66,0.05); }
    .status-badge {
      background: rgba(255,140,66,0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
    }
    .status-badge.pending { background: rgba(255,140,66,0.2); color: #ffaa77; }
    .status-badge.accepted { background: rgba(34,197,94,0.2); color: #4ade80; }
    .status-badge.rejected { background: rgba(239,68,68,0.2); color: #ef4444; }
    .btn-action {
      background: #ff8c42;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #e0662c; }
    .empty-state {
      text-align: center;
      padding: 60px;
      color: #a08070;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1510;
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 12px;
      padding: 12px 20px;
      z-index: 2001;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ff8c42;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      .container { padding: 15px; }
      .data-table th, .data-table td { padding: 10px; font-size: 12px; }
      .tabs { gap: 4px; }
      .tab-btn { padding: 8px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="window.location.href='/'">Pebeto</div>
  <div class="nav-icons">
    <button class="dashboard-btn" onclick="goToDashboard()"><i class="ri-dashboard-line"></i> Dashboard</button>
    <div class="avatar" id="nav-avatar" onclick="goToDashboard()">U</div>
  </div>
</div>

<div class="container">
  <button class="back-btn" onclick="goToDashboard()"><i class="ri-arrow-left-line"></i> Back to Dashboard</button>
  
  <h1><i class="ri-file-list-line"></i> My Bids</h1>
  
  <div class="tabs">
    <button class="tab-btn active" data-tab="pending">⏳ Pending</button>
    <button class="tab-btn" data-tab="accepted">✅ Accepted</button>
    <button class="tab-btn" data-tab="rejected">❌ Rejected</button>
  </div>
  
  <!-- Pending Bids Tab -->
  <div id="tab-pending" class="tab-content active">
    <div style="overflow-x: auto;">
      <div id="pending-skeleton" class="skeleton-loader">
        <div class="spinner" style="margin: 40px auto;"></div>
      </div>
      <table class="data-table" id="pending-table" style="display: none;">
        <thead>
          <tr><th>Campaign</th><th>Business</th><th>Bid Amount</th><th>Proposal</th><th>Submitted</th><th>Status</th>
        </thead>
        <tbody id="pending-bids"></tbody>
      </table>
    </div>
  </div>
  
  <!-- Accepted Bids Tab -->
  <div id="tab-accepted" class="tab-content">
    <div style="overflow-x: auto;">
      <div id="accepted-skeleton" class="skeleton-loader">
        <div class="spinner" style="margin: 40px auto;"></div>
      </div>
      <table class="data-table" id="accepted-table" style="display: none;">
        <thead>
          <tr><th>Campaign</th><th>Business</th><th>Bid Amount</th><th>Proposal</th><th>Submitted</th><th>Status</th><th>Action</th>
        </thead>
        <tbody id="accepted-bids"></tbody>
      </table>
    </div>
  </div>
  
  <!-- Rejected Bids Tab -->
  <div id="tab-rejected" class="tab-content">
    <div style="overflow-x: auto;">
      <div id="rejected-skeleton" class="skeleton-loader">
        <div class="spinner" style="margin: 40px auto;"></div>
      </div>
      <table class="data-table" id="rejected-table" style="display: none;">
        <thead>
          <tr><th>Campaign</th><th>Business</th><th>Bid Amount</th><th>Proposal</th><th>Submitted</th><th>Status</th>
        </thead>
        <tbody id="rejected-bids"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';
  let currentUser = null;
  let allBids = [];

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
  }

  function formatDate(dateString) {
    if (!dateString) return 'N/A';
    return new Date(dateString).toLocaleDateString();
  }

  function formatMoney(amount) {
    return `$${(amount || 0).toFixed(2)}`;
  }

  async function fetchJSON(url, options = {}) {
    const token = localStorage.getItem('pebeto_token');
    const res = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': token ? `Bearer ${token}` : '',
        ...options.headers
      }
    });
    return res.json();
  }

  function goToDashboard() {
    const token = localStorage.getItem('pebeto_token');
    if (!token) {
      window.location.href = '/login.html';
      return;
    }
    const userStr = localStorage.getItem('pebeto_user');
    if (userStr) {
      const user = JSON.parse(userStr);
      if (user.role === 'creator') window.location.href = '/creator-dashboard.html';
      else if (user.role === 'business') window.location.href = '/business-dashboard.html';
      else if (user.role === 'admin') window.location.href = '/admin-dashboard.html';
      else window.location.href = '/community.html';
    } else {
      window.location.href = '/login.html';
    }
  }

  function loadUserData() {
    const userStr = localStorage.getItem('pebeto_user');
    if (userStr) {
      currentUser = JSON.parse(userStr);
      const initial = (currentUser.profile?.stageName?.[0] || currentUser.email[0] || 'U').toUpperCase();
      document.getElementById('nav-avatar').innerHTML = initial;
      if (currentUser.profile?.avatarUrl) {
        document.getElementById('nav-avatar').style.backgroundImage = `url(${currentUser.profile.avatarUrl})`;
        document.getElementById('nav-avatar').innerHTML = '';
      }
    }
  }

  async function loadBids() {
    try {
      // Fetch all campaigns to extract bids
      const campaignsData = await fetchJSON(`${API_BASE}/api/campaigns`);
      const campaigns = campaignsData.campaigns || [];
      
      // Extract bids where current user is the creator
      const userId = currentUser?._id;
      const bids = [];
      
      campaigns.forEach(campaign => {
        if (campaign.bids && campaign.bids.length > 0) {
          campaign.bids.forEach(bid => {
            if (bid.creatorId === userId) {
              bids.push({
                ...bid,
                campaignTitle: campaign.title,
                campaignId: campaign._id,
                businessName: campaign.businessId?.profile?.companyName || campaign.businessId?.email || 'Business',
                businessId: campaign.businessId?._id
              });
            }
          });
        }
      });
      
      allBids = bids;
      
      const pendingBids = bids.filter(b => b.status === 'pending');
      const acceptedBids = bids.filter(b => b.status === 'accepted');
      const rejectedBids = bids.filter(b => b.status === 'rejected');
      
      // Render pending bids
      document.getElementById('pending-bids').innerHTML = pendingBids.length === 0
        ? '<tr><td colspan="6" class="empty-state">No pending bids yet. Start bidding on open campaigns!</td></tr>'
        : pendingBids.map(b => `
          <tr>
            <td><strong>${escapeHtml(b.campaignTitle)}</strong></td>
            <td>${escapeHtml(b.businessName)}</td>
            <td style="color:#ff8c42;">${formatMoney(b.amount)}</td>
            <td>${escapeHtml(b.proposal?.substring(0, 80))}${b.proposal?.length > 80 ? '...' : ''}</td>
            <td>${formatDate(b.createdAt)}</td>
            <td><span class="status-badge pending">Pending</span></td>
          </tr>
        `).join('');
      
      // Render accepted bids
      document.getElementById('accepted-bids').innerHTML = acceptedBids.length === 0
        ? '<tr><td colspan="7" class="empty-state">No accepted bids yet.</td></table>'
        : acceptedBids.map(b => `
          <tr>
            <td><strong>${escapeHtml(b.campaignTitle)}</strong></td>
            <td>${escapeHtml(b.businessName)}</td>
            <td style="color:#ff8c42;">${formatMoney(b.amount)}</td>
            <td>${escapeHtml(b.proposal?.substring(0, 80))}${b.proposal?.length > 80 ? '...' : ''}</td>
            <td>${formatDate(b.createdAt)}</td>
            <td><span class="status-badge accepted">Accepted</span></td>
            <td><button class="btn-action" onclick="startWork('${b.campaignId}')">📤 Submit Work</button></td>
          </tr>
        `).join('');
      
      // Render rejected bids
      document.getElementById('rejected-bids').innerHTML = rejectedBids.length === 0
        ? '<tr><td colspan="6" class="empty-state">No rejected bids.</td></td>'
        : rejectedBids.map(b => `
          <tr>
            <td><strong>${escapeHtml(b.campaignTitle)}</strong></td>
            <td>${escapeHtml(b.businessName)}</td>
            <td style="color:#ff8c42;">${formatMoney(b.amount)}</td>
            <td>${escapeHtml(b.proposal?.substring(0, 80))}${b.proposal?.length > 80 ? '...' : ''}</td>
            <td>${formatDate(b.createdAt)}</td>
            <td><span class="status-badge rejected">Rejected</span></td>
          </tr>
        `).join('');
      
      // Hide skeletons and show tables
      document.getElementById('pending-skeleton').style.display = 'none';
      document.getElementById('pending-table').style.display = 'table';
      document.getElementById('accepted-skeleton').style.display = 'none';
      document.getElementById('accepted-table').style.display = 'table';
      document.getElementById('rejected-skeleton').style.display = 'none';
      document.getElementById('rejected-table').style.display = 'table';
      
    } catch (error) {
      console.error('Error loading bids:', error);
      document.getElementById('pending-bids').innerHTML = '<tr><td colspan="6" class="empty-state">Error loading bids. Please refresh.</td></tr>';
      document.getElementById('pending-skeleton').style.display = 'none';
      document.getElementById('pending-table').style.display = 'table';
    }
  }

  function startWork(campaignId) {
    window.location.href = `/campaign.html?id=${campaignId}`;
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });

  // Initialize
  loadUserData();
  loadBids();
</script>
</body>
</html>
