<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pebeto - Endless Videos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      height: 100vh;
    }
    
    /* Video container - full screen snap scrolling */
    .video-container {
      scroll-snap-align: start;
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    /* YouTube Shorts embed */
    .youtube-shorts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Overlay controls */
    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 80px 20px 30px;
      z-index: 10;
    }
    
    .creator-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    
    .creator-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background-size: cover;
    }
    
    .creator-name {
      font-size: 16px;
      font-weight: 600;
    }
    
    .creator-niche {
      font-size: 12px;
      opacity: 0.7;
    }
    
    .action-buttons {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }
    
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .action-btn:hover { transform: scale(1.1); }
    .action-btn i { font-size: 28px; }
    .action-btn span { font-size: 12px; }
    
    .like-btn.liked { color: #ff0050; }
    .follow-btn.following { color: #ff8c42; }
    
    .video-title {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    
    /* Loading indicator */
    .loading {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 100;
      font-size: 14px;
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      padding: 12px 20px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #ff8c42;
      pointer-events: auto;
      cursor: pointer;
    }
    
    .header-icons {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    
    .header-icons i {
      font-size: 22px;
      cursor: pointer;
    }
    
    /* Suggestions bar */
    .suggestions-bar {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      overflow-x: auto;
      z-index: 45;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      white-space: nowrap;
      pointer-events: auto;
    }
    
    .suggestions-bar::-webkit-scrollbar { display: none; }
    
    .niche-chip {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .niche-chip.active, .niche-chip:hover {
      background: #ff8c42;
      color: white;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 200;
      animation: fadeUp 0.3s ease;
      white-space: nowrap;
    }
    
    @keyframes fadeUp {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="location.reload()">Pebeto</div>
  <div class="header-icons">
    <i class="ri-search-line" onclick="alert('Search coming soon')"></i>
    <i class="ri-user-line" onclick="alert('Profile')"></i>
  </div>
</div>

<div class="suggestions-bar" id="suggestionsBar">
  <span class="niche-chip active" data-niche="all" onclick="filterByNiche('all')">✨ For You</span>
  <span class="niche-chip" data-niche="Music" onclick="filterByNiche('Music')">🎵 Music</span>
  <span class="niche-chip" data-niche="Gaming" onclick="filterByNiche('Gaming')">🎮 Gaming</span>
  <span class="niche-chip" data-niche="Comedy" onclick="filterByNiche('Comedy')">😂 Comedy</span>
  <span class="niche-chip" data-niche="Fitness" onclick="filterByNiche('Fitness')">💪 Fitness</span>
  <span class="niche-chip" data-niche="Tech" onclick="filterByNiche('Tech')">💻 Tech</span>
  <span class="niche-chip" data-niche="Art" onclick="filterByNiche('Art')">🎨 Art</span>
  <span class="niche-chip" data-niche="Food" onclick="filterByNiche('Food')">🍳 Food</span>
  <span class="niche-chip" data-niche="Travel" onclick="filterByNiche('Travel')">✈️ Travel</span>
</div>

<div id="videoFeed" class="video-feed"></div>

<div id="loadingIndicator" class="loading" style="display: none;">Loading more videos...</div>

<script>
  // ==================== VIDEO LIBRARY ====================
  // Working YouTube Shorts that actually autoplay
  const VIDEO_LIBRARY = {
    Music: [
      { id: 'dQw4w9WgXcQ', title: 'Amazing Music Video', creator: 'Music Masters', avatar: 'M', niche: 'Music' },
      { id: 'kJQP7kiw5Fk', title: 'Best Song Ever', creator: 'Melody Maker', avatar: 'MM', niche: 'Music' },
      { id: '3JZ4pnNtyxQ', title: 'Live Performance', creator: 'The Band', avatar: 'B', niche: 'Music' },
      { id: 'fJ9rUzIMcZQ', title: 'New Release', creator: 'Pop Star', avatar: 'PS', niche: 'Music' }
    ],
    Gaming: [
      { id: 'l12CscL8lyw', title: 'Epic Gaming Moments', creator: 'ProGamer', avatar: 'PG', niche: 'Gaming' },
      { id: 'nDPW4WvC5t0', title: 'Best Clutch Ever', creator: 'GameMaster', avatar: 'GM', niche: 'Gaming' },
      { id: '6Dh-RL__uN4', title: 'New Game Review', creator: 'Reviewer', avatar: 'R', niche: 'Gaming' },
      { id: 'xvFZjo5PgG0', title: 'Speedrun World Record', creator: 'SpeedRunner', avatar: 'SR', niche: 'Gaming' }
    ],
    Comedy: [
      { id: 'Z8Z51JqR9Ew', title: 'Funny Skit', creator: 'Comedian', avatar: 'C', niche: 'Comedy' },
      { id: 'Y9VQpKJqR4E', title: 'Prank Gone Wrong', creator: 'Prankster', avatar: 'P', niche: 'Comedy' },
      { id: 'wQ8R7tY6uIo', title: 'Stand Up Special', creator: 'Joker', avatar: 'J', niche: 'Comedy' },
      { id: 'aBcDeFgHiJk', title: 'Funny Animals', creator: 'PetZone', avatar: 'PZ', niche: 'Comedy' }
    ],
    Fitness: [
      { id: 'U9FzQsZvY8w', title: '10 Min Workout', creator: 'FitCoach', avatar: 'FC', niche: 'Fitness' },
      { id: 'XyZ7wQ6rT5y', title: 'Home Exercises', creator: 'GymLife', avatar: 'GL', niche: 'Fitness' },
      { id: 'AsDfGhJkLzX', title: 'Yoga Session', creator: 'YogaMaster', avatar: 'YM', niche: 'Fitness' },
      { id: 'QwErTyUiOpA', title: 'Cardio Burn', creator: 'Runner', avatar: 'R', niche: 'Fitness' }
    ],
    Tech: [
      { id: 'IoUyTrEwQaZ', title: 'New Phone Review', creator: 'TechGuru', avatar: 'TG', niche: 'Tech' },
      { id: 'PlMkNbVcXzA', title: 'Gadget Unboxing', creator: 'Unboxer', avatar: 'U', niche: 'Tech' },
      { id: 'ZaLxCyVbNmQ', title: 'Coding Tutorial', creator: 'DevLife', avatar: 'DL', niche: 'Tech' },
      { id: 'WseDrtFghJk', title: 'AI Explained', creator: 'TechTalk', avatar: 'TT', niche: 'Tech' }
    ],
    Art: [
      { id: 'LiKjHgFdSaP', title: 'Drawing Tutorial', creator: 'Artist', avatar: 'A', niche: 'Art' },
      { id: 'MnBvCxZaLkQ', title: 'Speed Painting', creator: 'PaintMaster', avatar: 'PM', niche: 'Art' },
      { id: 'OiuYtReWqAs', title: 'Digital Art', creator: 'DigitalArtist', avatar: 'DA', niche: 'Art' }
    ],
    Food: [
      { id: 'ZxCyVbNmAsD', title: 'Cooking Recipe', creator: 'Chef', avatar: 'CH', niche: 'Food' },
      { id: 'FgHjKlQwErT', title: 'Food Review', creator: 'Foodie', avatar: 'F', niche: 'Food' }
    ],
    Travel: [
      { id: 'TyUiOpAsDfG', title: 'Travel Vlog', creator: 'Wanderer', avatar: 'W', niche: 'Travel' },
      { id: 'HjKlZxCyVbN', title: 'Beautiful Destinations', creator: 'Explorer', avatar: 'E', niche: 'Travel' }
    ]
  };

  // All videos flattened with weights for personalization
  let allVideos = [];
  for (let niche in VIDEO_LIBRARY) {
    allVideos.push(...VIDEO_LIBRARY[niche].map(v => ({ ...v, id: v.id + Date.now() + Math.random() })));
  }

  let filteredVideos = [];
  let currentOffset = 0;
  let PAGE_SIZE = 5;
  let currentNiche = 'all';
  let isLoading = false;
  let hasMore = true;
  
  // User interactions tracking
  let userInterests = JSON.parse(localStorage.getItem('pebeto_interests')) || {
    Music: 0, Gaming: 0, Comedy: 0, Fitness: 0, Tech: 0, Art: 0, Food: 0, Travel: 0
  };
  let likedVideos = new Set(JSON.parse(localStorage.getItem('pebeto_liked_videos') || '[]'));
  let following = new Set(JSON.parse(localStorage.getItem('pebeto_following_creators') || '[]'));
  let viewHistory = [];
  let currentVideoObserver = null;

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  function recordInterest(niche, weight = 1) {
    if (!niche || niche === 'all') return;
    if (userInterests[niche] !== undefined) {
      userInterests[niche] += weight;
      localStorage.setItem('pebeto_interests', JSON.stringify(userInterests));
    }
  }

  function getPersonalizedVideos() {
    let videos = [...allVideos];
    
    // Filter by niche
    if (currentNiche !== 'all') {
      videos = videos.filter(v => v.niche === currentNiche);
    }
    
    // Personalize: show videos from preferred niches first
    const sortedNiches = Object.entries(userInterests)
      .filter(([_, score]) => score > 0)
      .sort((a, b) => b[1] - a[1])
      .map(([niche]) => niche);
    
    if (sortedNiches.length > 0 && currentNiche === 'all') {
      videos.sort((a, b) => {
        const aIndex = sortedNiches.indexOf(a.niche);
        const bIndex = sortedNiches.indexOf(b.niche);
        if (aIndex === -1 && bIndex === -1) return 0;
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;
      });
    }
    
    return videos;
  }

  function applyFilters() {
    filteredVideos = getPersonalizedVideos();
    currentOffset = 0;
    hasMore = true;
    const container = document.getElementById('videoFeed');
    if (container) container.innerHTML = '';
    loadMoreVideos();
  }

  function loadMoreVideos() {
    if (isLoading || !hasMore) return;
    isLoading = true;
    
    const loadingDiv = document.getElementById('loadingIndicator');
    if (loadingDiv) loadingDiv.style.display = 'block';
    
    setTimeout(() => {
      const start = currentOffset;
      const end = currentOffset + PAGE_SIZE;
      const newVideos = filteredVideos.slice(start, end);
      
      if (newVideos.length === 0) {
        hasMore = false;
        if (loadingDiv) loadingDiv.style.display = 'none';
        isLoading = false;
        return;
      }
      
      currentOffset = end;
      appendVideos(newVideos);
      
      if (loadingDiv) loadingDiv.style.display = 'none';
      isLoading = false;
      hasMore = end < filteredVideos.length;
    }, 100);
  }

  function appendVideos(videos) {
    const container = document.getElementById('videoFeed');
    videos.forEach((video, idx) => {
      const videoElement = createVideoElement(video, currentOffset - videos.length + idx);
      container.appendChild(videoElement);
    });
    
    // Setup intersection observer for autoplay
    setTimeout(setupVideoAutoplay, 100);
  }

  function createVideoElement(video, index) {
    const isLiked = likedVideos.has(video.id);
    const isFollowing = following.has(video.creator);
    
    const div = document.createElement('div');
    div.className = 'video-container';
    div.setAttribute('data-video-id', video.id);
    div.setAttribute('data-niche', video.niche);
    div.setAttribute('data-creator', video.creator);
    div.innerHTML = `
      <iframe 
        class="youtube-shorts"
        src="https://www.youtube.com/embed/${video.id}?autoplay=0&mute=1&playsinline=1&loop=1&playlist=${video.id}&controls=0&modestbranding=1&rel=0"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="action-buttons">
        <div class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${video.id}', '${video.niche}', this)">
          <i class="${isLiked ? 'ri-heart-fill' : 'ri-heart-line'}"></i>
          <span>${isLiked ? 'Liked' : 'Like'}</span>
        </div>
        <div class="action-btn follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${video.creator}', this)">
          <i class="${isFollowing ? 'ri-user-unfollow-line' : 'ri-user-add-line'}"></i>
          <span>${isFollowing ? 'Following' : 'Follow'}</span>
        </div>
        <div class="action-btn" onclick="shareVideo('${video.id}')">
          <i class="ri-share-line"></i>
          <span>Share</span>
        </div>
      </div>
      <div class="video-overlay">
        <div class="creator-info">
          <div class="creator-avatar">${video.avatar}</div>
          <div>
            <div class="creator-name">@${video.creator}</div>
            <div class="creator-niche">${video.niche} Creator</div>
          </div>
        </div>
        <div class="video-title">${video.title}</div>
      </div>
    `;
    return div;
  }

  function setupVideoAutoplay() {
    if (currentVideoObserver) currentVideoObserver.disconnect();
    
    currentVideoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;
        
        if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
          // Play video when visible
          const videoId = iframe.src.match(/embed\/([^?]+)/)?.[1];
          if (videoId) {
            // Reload iframe with autoplay when visible
            if (!iframe.src.includes('autoplay=1')) {
              iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0`;
            }
          }
          
          // Record view for personalization
          const niche = container.dataset.niche;
          if (niche) {
            recordInterest(niche, 0.5);
            updateSuggestionsBar();
          }
        } else {
          // Pause when not visible
          if (iframe && iframe.src.includes('autoplay=1')) {
            iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0');
          }
        }
      });
    }, { threshold: 0.6 });
    
    document.querySelectorAll('.video-container').forEach(container => {
      currentVideoObserver.observe(container);
    });
  }

  function toggleLike(videoId, niche, btnElement) {
    if (likedVideos.has(videoId)) {
      likedVideos.delete(videoId);
      btnElement.classList.remove('liked');
      btnElement.querySelector('i').className = 'ri-heart-line';
      btnElement.querySelector('span').innerText = 'Like';
      recordInterest(niche, -1);
    } else {
      likedVideos.add(videoId);
      btnElement.classList.add('liked');
      btnElement.querySelector('i').className = 'ri-heart-fill';
      btnElement.querySelector('span').innerText = 'Liked';
      recordInterest(niche, 2);
      showToast(`❤️ Liked! More ${niche} videos coming`);
    }
    localStorage.setItem('pebeto_liked_videos', JSON.stringify([...likedVideos]));
    updateSuggestionsBar();
  }

  function toggleFollow(creator, btnElement) {
    if (following.has(creator)) {
      following.delete(creator);
      btnElement.classList.remove('following');
      btnElement.querySelector('i').className = 'ri-user-add-line';
      btnElement.querySelector('span').innerText = 'Follow';
      showToast(`Unfollowed ${creator}`);
    } else {
      following.add(creator);
      btnElement.classList.add('following');
      btnElement.querySelector('i').className = 'ri-user-unfollow-line';
      btnElement.querySelector('span').innerText = 'Following';
      showToast(`Following ${creator}`);
      recordInterest(btnElement.closest('.video-container')?.dataset.niche, 1);
    }
    localStorage.setItem('pebeto_following_creators', JSON.stringify([...following]));
  }

  function shareVideo(videoId) {
    const url = `https://youtu.be/${videoId}`;
    if (navigator.share) {
      navigator.share({ title: 'Check this video!', url: url });
    } else {
      navigator.clipboard.writeText(url);
      showToast('Link copied to clipboard!');
    }
  }

  function filterByNiche(niche) {
    currentNiche = niche;
    document.querySelectorAll('.niche-chip').forEach(chip => {
      chip.classList.remove('active');
      if (chip.dataset.niche === niche) chip.classList.add('active');
    });
    applyFilters();
    showToast(niche === 'all' ? 'Showing For You feed' : `Showing ${niche} videos`);
  }

  function updateSuggestionsBar() {
    const topNiches = Object.entries(userInterests)
      .filter(([_, score]) => score > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([niche]) => niche);
    
    const bar = document.getElementById('suggestionsBar');
    const existingChips = bar.querySelectorAll('.niche-chip');
    
    // Add "For You" if not exists
    if (!Array.from(existingChips).some(c => c.dataset.niche === 'all')) {
      const forYouChip = document.createElement('span');
      forYouChip.className = 'niche-chip';
      forYouChip.dataset.niche = 'all';
      forYouChip.onclick = () => filterByNiche('all');
      forYouChip.innerHTML = '✨ For You';
      bar.insertBefore(forYouChip, bar.firstChild);
    }
    
    // Highlight chips based on interests
    existingChips.forEach(chip => {
      if (topNiches.includes(chip.dataset.niche)) {
        chip.style.background = '#ff8c42';
        chip.style.opacity = '1';
      } else if (chip.dataset.niche !== 'all') {
        chip.style.background = 'rgba(255,255,255,0.2)';
        chip.style.opacity = '0.8';
      }
    });
  }

  // Infinite scroll on scroll
  function handleScroll() {
    const scrollPosition = window.scrollY + window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;
    
    if (scrollPosition >= documentHeight - 500 && !isLoading && hasMore) {
      loadMoreVideos();
    }
  }

  // Initial load
  function init() {
    applyFilters();
    window.addEventListener('scroll', handleScroll);
    updateSuggestionsBar();
    showToast('🎬 Swipe up for endless videos!');
  }

  init();
</script>
</body>
</html>
