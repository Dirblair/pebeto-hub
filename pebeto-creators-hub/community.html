<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Community - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,140,66,0.2);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 800; color: #ff8c42; cursor: pointer; }
    .search-bar {
      background: rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 300px;
    }
    .search-bar input {
      background: transparent;
      border: none;
      color: white;
      width: 100%;
      outline: none;
    }
    .nav-icons { display: flex; gap: 20px; align-items: center; }
    .nav-icons i { font-size: 24px; cursor: pointer; color: #b8a99a; }
    .nav-icons i:hover { color: #ffaa77; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }
    
    /* Feed Container */
    .feed-container {
      margin-top: 70px;
      height: calc(100vh - 70px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }
    
    /* Video Post */
    .video-post {
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      background: #000;
    }
    .video-post video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .post-overlay {
      position: absolute;
      bottom: 100px;
      left: 16px;
      right: 80px;
      z-index: 10;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background-size: cover;
    }
    .author-info h4 { font-size: 16px; margin-bottom: 2px; }
    .author-info h4 span { font-weight: normal; color: #a08070; font-size: 12px; }
    .author-info p { font-size: 12px; color: #a08070; }
    .post-caption { font-size: 14px; margin-top: 8px; max-width: 80%; }
    .trending-sound {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
      color: #ffaa77;
      cursor: pointer;
    }
    
    /* Right Sidebar Actions */
    .right-actions {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn i { font-size: 28px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .action-btn span { font-size: 12px; margin-top: 4px; color: white; }
    .action-btn:hover i { color: #ff8c42; }
    .action-btn.liked i { color: #ff0050; }
    
    /* Live Badge */
    .live-badge {
      position: absolute;
      top: 20px;
      left: 16px;
      background: #ff0050;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1510;
      border-radius: 28px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      border: 1px solid rgba(255,140,66,0.3);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 20px; color: #ff8c42; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 12px;
      border-radius: 30px;
      margin-bottom: 15px;
      color: white;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; border: none; cursor: pointer; }
    .save-btn { background: #ff8c42; color: white; }
    .cancel-btn { background: rgba(255,255,255,0.1); color: white; }
    
    /* Comments Section */
    .comments-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
    .comment-item {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ff8c42;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .comment-text strong { font-size: 13px; }
    .comment-text p { font-size: 12px; margin-top: 4px; color: #ccc; }
    
    /* Trending Sounds Bar */
    .trending-bar {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      gap: 16px;
      overflow-x: auto;
      z-index: 99;
      border-top: 1px solid rgba(255,140,66,0.2);
    }
    .trending-sound-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 40px;
      cursor: pointer;
      white-space: nowrap;
    }
    .trending-sound-item i { color: #ff8c42; }
    
    /* Profile Page */
    .profile-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
    }
    .profile-stats div { text-align: center; }
    .profile-stats .number { font-size: 20px; font-weight: bold; color: #ff8c42; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .video-grid-item {
      aspect-ratio: 1;
      background: #333;
      cursor: pointer;
    }
    .video-grid-item video { width: 100%; height: 100%; object-fit: cover; }
    
    @media (max-width: 768px) {
      .search-bar { display: none; }
      .post-caption { font-size: 12px; }
      .right-actions { right: 8px; gap: 16px; }
      .action-btn i { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="showFeed()">Pebeto</div>
  <div class="search-bar">
    <i class="ri-search-line"></i>
    <input type="text" id="global-search" placeholder="Search users or sounds..." onkeyup="searchGlobal()">
  </div>
  <div class="nav-icons">
    <i class="ri-home-5-line" onclick="showFeed()" title="Home"></i>
    <i class="ri-user-line" onclick="showMyProfile()" title="Profile"></i>
    <i class="ri-camera-add-line" onclick="openUploadModal()" title="Upload"></i>
    <i class="ri-live-line" onclick="startLive()" title="Go Live"></i>
    <div class="avatar" id="nav-avatar" onclick="showMyProfile()">U</div>
  </div>
</div>

<!-- Feed Container -->
<div id="feed-container" class="feed-container"></div>

<!-- Trending Sounds Bar -->
<div class="trending-bar" id="trending-bar"></div>

<!-- Upload Modal -->
<div id="upload-modal" class="modal">
  <div class="modal-content">
    <h3>📤 Upload Video</h3>
    <input type="text" id="video-caption" placeholder="Caption">
    <select id="video-sound">
      <option value="">Original Sound</option>
      <option value="trending1">🔥 Trending: Summer Vibes</option>
      <option value="trending2">🎵 Trending: Dance Challenge</option>
      <option value="trending3">💃 Trending: Viral Beat</option>
    </select>
    <input type="file" id="video-file" accept="video/*">
    <div class="modal-buttons">
      <button class="save-btn" onclick="uploadVideo()">Post</button>
      <button class="cancel-btn" onclick="closeModal('upload-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Comments Modal -->
<div id="comments-modal" class="modal">
  <div class="modal-content">
    <h3>💬 Comments</h3>
    <div id="comments-list" class="comments-list"></div>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="comment-input" placeholder="Add a comment..." style="flex:1;">
      <button class="save-btn" onclick="addComment()">Post</button>
    </div>
    <div class="modal-buttons"><button class="cancel-btn" onclick="closeModal('comments-modal')">Close</button></div>
  </div>
</div>

<!-- Live Modal -->
<div id="live-modal" class="modal">
  <div class="modal-content">
    <h3>🔴 Go Live</h3>
    <p>Live streaming coming soon! This will use WebRTC for real-time broadcasting.</p>
    <div class="modal-buttons"><button class="cancel-btn" onclick="closeModal('live-modal')">Close</button></div>
  </div>
</div>

<!-- Tip Modal -->
<div id="tip-modal" class="modal">
  <div class="modal-content">
    <h3>💝 Send Tip</h3>
    <p id="tip-creator-name">To: Creator</p>
    <input type="number" id="tip-amount" placeholder="Amount (USD)" min="1">
    <p style="font-size:12px; margin:10px 0;">5% platform fee. Creator receives 95%.</p>
    <div class="modal-buttons">
      <button class="save-btn" onclick="sendTip()">Send Tip</button>
      <button class="cancel-btn" onclick="closeModal('tip-modal')">Close</button>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let posts = [];
  let currentPostId = null;
  let currentProfileUserId = null;
  
  // Mock data for demo
  const mockPosts = [
    { id: "1", userId: "user1", username: "@djnova", displayName: "DJ Nova", role: "creator", niche: "Music", avatar: "", caption: "New track dropping soon! 🔥", videoUrl: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", likes: 1234, comments: [], sound: "Summer Vibes", isLive: false, createdAt: new Date() },
    { id: "2", userId: "user2", username: "@sarahcreates", displayName: "Sarah Creates", role: "creator", niche: "Art", avatar: "", caption: "Speed painting of my latest piece 🎨", videoUrl: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_2mb.mp4", likes: 567, comments: [], sound: "Original Sound", isLive: true, createdAt: new Date() },
    { id: "3", userId: "user3", username: "@pebeto", displayName: "Pebeto", role: "business", niche: "Platform", avatar: "", caption: "Join the creator economy! #Pebeto", videoUrl: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_3mb.mp4", likes: 8901, comments: [], sound: "Trending: Dance Challenge", isLive: false, createdAt: new Date() }
  ];
  
  const trendingSounds = [
    { name: "Summer Vibes", uses: 1234, icon: "🔥" },
    { name: "Dance Challenge", uses: 892, icon: "💃" },
    { name: "Viral Beat", uses: 756, icon: "🎵" },
    { name: "Comedy Skit", uses: 543, icon: "😂" }
  ];
  
  async function fetchJSON(url, options = {}) {
    const token = localStorage.getItem('pebeto_token');
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
    return res.json();
  }
  
  function formatNumber(num) {
    if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num/1000).toFixed(1) + 'K';
    return num.toString();
  }
  
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  
  function loadUserData() {
    const userStr = localStorage.getItem('pebeto_user');
    if (userStr) {
      currentUser = JSON.parse(userStr);
      document.getElementById('nav-avatar').innerHTML = (currentUser.profile?.stageName?.[0] || currentUser.email[0]).toUpperCase();
      if (currentUser.profile?.avatarUrl) {
        document.getElementById('nav-avatar').style.backgroundImage = `url(${currentUser.profile.avatarUrl})`;
        document.getElementById('nav-avatar').innerHTML = '';
      }
    }
    loadFeed();
    loadTrendingSounds();
  }
  
  function loadFeed() {
    const container = document.getElementById('feed-container');
    container.innerHTML = '';
    // In production, fetch from API: const data = await fetchJSON('/api/community/posts');
    mockPosts.forEach(post => {
      const postEl = createPostElement(post);
      container.appendChild(postEl);
    });
  }
  
  function createPostElement(post) {
    const article = document.createElement('article');
    article.className = 'video-post';
    article.dataset.postId = post.id;
    
    const isLiked = false; // Check if user liked
    const likeIconColor = isLiked ? '#ff0050' : 'white';
    const likeIconFill = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
    
    article.innerHTML = `
      ${post.isLive ? `<div class="live-badge"><span class="live-dot"></span> LIVE</div>` : ''}
      <video class="post-video" src="${post.videoUrl}" loop muted playsinline></video>
      <div class="post-overlay">
        <div class="post-author">
          <div class="author-avatar" style="background-image: url(${post.avatar})">${!post.avatar ? (post.displayName[0] || 'U') : ''}</div>
          <div class="author-info">
            <h4>${escapeHtml(post.displayName)} <span>${escapeHtml(post.username)}</span> • ${post.role === 'creator' ? '🎨 Creator' : '🏢 Brand'}</h4>
            <p>${post.niche || 'Creator'} • ${formatNumber(Math.floor(Math.random() * 1000))} followers</p>
          </div>
        </div>
        <div class="post-caption">${escapeHtml(post.caption)}</div>
        ${post.sound ? `<div class="trending-sound" onclick="useSound('${post.sound}')"><i class="ri-music-2-line"></i> ${escapeHtml(post.sound)}</div>` : ''}
      </div>
      <div class="right-actions">
        <div class="action-btn" onclick="toggleLike(this, '${post.id}')">
          <i class="${likeIconFill}" style="color:${likeIconColor}"></i>
          <span>${formatNumber(post.likes)}</span>
        </div>
        <div class="action-btn" onclick="openComments('${post.id}')">
          <i class="ri-chat-3-fill"></i>
          <span>${formatNumber(post.comments?.length || 0)}</span>
        </div>
        <div class="action-btn" onclick="openTipModal('${post.userId}', '${escapeHtml(post.displayName)}')">
          <i class="ri-hand-coin-line"></i>
          <span>Tip</span>
        </div>
        <div class="action-btn" onclick="sharePost('${post.id}')">
          <i class="ri-share-forward-line"></i>
          <span>Share</span>
        </div>
        <div class="action-btn" onclick="saveToProfile('${post.id}')">
          <i class="ri-bookmark-line"></i>
          <span>Save</span>
        </div>
      </div>
    `;
    
    const video = article.querySelector('video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) video.play().catch(e => {});
        else video.pause();
      });
    }, { threshold: 0.5 });
    observer.observe(article);
    
    return article;
  }
  
  function toggleLike(element, postId) {
    const icon = element.querySelector('i');
    const countSpan = element.querySelector('span');
    let count = parseInt(countSpan.innerText.replace(/[^0-9]/g, '')) || 0;
    if (icon.classList.contains('ri-heart-line')) {
      icon.classList.remove('ri-heart-line');
      icon.classList.add('ri-heart-fill');
      icon.style.color = '#ff0050';
      count++;
    } else {
      icon.classList.remove('ri-heart-fill');
      icon.classList.add('ri-heart-line');
      icon.style.color = 'white';
      count--;
    }
    countSpan.innerText = formatNumber(count);
  }
  
  function openComments(postId) {
    currentPostId = postId;
    const post = mockPosts.find(p => p.id === postId);
    const commentsDiv = document.getElementById('comments-list');
    if (post && post.comments) {
      commentsDiv.innerHTML = post.comments.map(c => `
        <div class="comment-item">
          <div class="comment-avatar">${c.username[1] || 'U'}</div>
          <div class="comment-text"><strong>${escapeHtml(c.username)}</strong><p>${escapeHtml(c.text)}</p></div>
        </div>
      `).join('');
    } else {
      commentsDiv.innerHTML = '<div style="text-align:center; padding:20px;">No comments yet. Be the first!</div>';
    }
    document.getElementById('comments-modal').style.display = 'flex';
  }
  
  function addComment() {
    const input = document.getElementById('comment-input');
    const text = input.value.trim();
    if (!text) return;
    const post = mockPosts.find(p => p.id === currentPostId);
    if (post) {
      if (!post.comments) post.comments = [];
      post.comments.push({ username: currentUser?.profile?.stageName || currentUser?.email?.split('@')[0] || 'User', text: text });
      openComments(currentPostId);
      input.value = '';
      // Update comment count in UI
      const commentCountSpan = document.querySelector(`.video-post[data-post-id="${currentPostId}"] .action-btn:nth-child(2) span`);
      if (commentCountSpan) commentCountSpan.innerText = formatNumber(post.comments.length);
    }
  }
  
  function openTipModal(userId, name) {
    document.getElementById('tip-creator-name').innerHTML = `To: ${name}`;
    document.getElementById('tip-modal').dataset.userId = userId;
    document.getElementById('tip-modal').style.display = 'flex';
  }
  
  async function sendTip() {
    const amount = parseFloat(document.getElementById('tip-amount').value);
    if (!amount || amount <= 0) { alert('Enter valid amount'); return; }
    alert(`💝 Tip of $${amount} sent! (5% fee, creator gets $${(amount * 0.95).toFixed(2)})`);
    closeModal('tip-modal');
    document.getElementById('tip-amount').value = '';
  }
  
  function sharePost(postId) {
    navigator.clipboard.writeText(`${window.location.origin}/post/${postId}`);
    alert('Link copied to clipboard!');
  }
  
  function saveToProfile(postId) {
    alert('Post saved to your profile!');
    // In production, save to user's saved posts collection
  }
  
  function useSound(soundName) {
    alert(`Using sound: ${soundName}`);
    openUploadModal();
  }
  
  function loadTrendingSounds() {
    const bar = document.getElementById('trending-bar');
    bar.innerHTML = trendingSounds.map(s => `
      <div class="trending-sound-item" onclick="useSound('${s.name}')">
        <i class="ri-fire-line"></i> ${s.name} • ${formatNumber(s.uses)} uses
      </div>
    `).join('');
  }
  
  function openUploadModal() { document.getElementById('upload-modal').style.display = 'flex'; }
  function startLive() { document.getElementById('live-modal').style.display = 'flex'; }
  
  async function uploadVideo() {
    const caption = document.getElementById('video-caption').value;
    const sound = document.getElementById('video-sound').value;
    const fileInput = document.getElementById('video-file');
    if (!fileInput.files.length) { alert('Select a video file'); return; }
    alert(`Video uploaded! Caption: "${caption}" Sound: ${sound || 'Original'}\n\nIn production, this would upload to server/Cloudinary.`);
    closeModal('upload-modal');
    document.getElementById('video-caption').value = '';
    document.getElementById('video-file').value = '';
  }
  
  function showFeed() {
    document.getElementById('feed-container').style.display = 'block';
    loadFeed();
  }
  
  function showMyProfile() {
    document.getElementById('feed-container').style.display = 'block';
    document.getElementById('feed-container').innerHTML = `
      <div class="profile-container">
        <div class="profile-header">
          <div class="author-avatar" style="width:100px; height:100px; margin:0 auto 16px;">${currentUser?.profile?.stageName?.[0] || currentUser?.email[0] || 'U'}</div>
          <h2>${currentUser?.profile?.stageName || currentUser?.email?.split('@')[0]}</h2>
          <p>${currentUser?.email}</p>
          <div class="profile-stats">
            <div><div class="number">${Math.floor(Math.random() * 1000)}</div><div>Followers</div></div>
            <div><div class="number">${Math.floor(Math.random() * 500)}</div><div>Following</div></div>
            <div><div class="number">${mockPosts.length}</div><div>Posts</div></div>
          </div>
          <button class="btn-action" onclick="showFeed()">Back to Feed</button>
        </div>
        <h3 style="margin-bottom: 15px;">My Videos</h3>
        <div class="video-grid">
          ${mockPosts.map(post => `
            <div class="video-grid-item" onclick="playVideo('${post.videoUrl}')">
              <video src="${post.videoUrl}" style="width:100%; height:100%; object-fit:cover;"></video>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  function playVideo(videoUrl) { alert('Playing video: ' + videoUrl); }
  
  function searchGlobal() {
    const query = document.getElementById('global-search').value.toLowerCase();
    if (!query) { loadFeed(); return; }
    const filtered = mockPosts.filter(p => p.displayName.toLowerCase().includes(query) || p.username.toLowerCase().includes(query));
    const container = document.getElementById('feed-container');
    container.innerHTML = '';
    filtered.forEach(post => container.appendChild(createPostElement(post)));
    if (filtered.length === 0) container.innerHTML = '<div style="text-align:center; padding:50px;">No results found</div>';
  }
  
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
  
  loadUserData();
</script>
