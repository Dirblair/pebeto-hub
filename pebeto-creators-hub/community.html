<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Community - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #000; 
      color: #fff; 
      overflow-x: hidden; 
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,140,66,0.2);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 800; color: #ff8c42; cursor: pointer; }
    .search-bar {
      background: rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 300px;
    }
    .search-bar input { 
      background: transparent; 
      border: none; 
      color: white; 
      width: 100%; 
      outline: none; 
    }
    .nav-icons { display: flex; gap: 20px; align-items: center; }
    .dashboard-btn {
      background: rgba(255,140,66,0.15);
      border: 1px solid #ff8c42;
      padding: 8px 16px;
      border-radius: 40px;
      color: #ffaa77;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dashboard-btn:hover { background: #ff8c42; color: white; }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      background-size: cover;
    }
    
    /* Video Feed - TikTok Style */
    .feed-container {
      margin-top: 70px;
      height: calc(100vh - 70px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }
    
    .video-post {
      height: calc(100vh - 70px);
      scroll-snap-align: start;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-post video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* Overlay Content */
    .post-overlay {
      position: absolute;
      bottom: 100px;
      left: 16px;
      right: 80px;
      z-index: 10;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background-size: cover;
    }
    .author-info h4 { font-size: 16px; margin-bottom: 2px; }
    .author-info h4 span { font-weight: normal; color: #a08070; font-size: 12px; }
    .author-info p { font-size: 12px; color: #a08070; }
    .post-caption { font-size: 14px; margin-top: 8px; max-width: 80%; }
    
    /* Sound / Music Tag */
    .sound-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    
    /* Right Side Action Buttons */
    .right-actions {
      position: absolute;
      right: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.95); }
    .action-btn i { font-size: 28px; color: white; }
    .action-btn span { font-size: 12px; margin-top: 4px; color: white; }
    .action-btn.liked i { color: #ff0050; }
    
    /* Unmute Button */
    .unmute-btn {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    .unmute-btn i { font-size: 20px; color: white; }
    
    .loading-spinner {
      text-align: center;
      padding: 50px;
      color: #ff8c42;
    }
    
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1510;
      border-radius: 28px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      border: 1px solid rgba(255,140,66,0.3);
    }
    .modal-content h3 { margin-bottom: 20px; color: #ff8c42; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 12px;
      border-radius: 30px;
      margin-bottom: 15px;
      color: white;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; border: none; cursor: pointer; }
    .save-btn { background: #ff8c42; color: white; }
    .cancel-btn { background: rgba(255,255,255,0.1); color: white; }
    .comments-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
    .comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .payment-source-btn { transition: all 0.2s ease; }
    .payment-source-btn:hover { transform: translateY(-1px); }
    
    @media (max-width: 768px) {
      .search-bar { display: none; }
      .post-caption { font-size: 12px; max-width: 70%; }
      .right-actions { gap: 16px; }
      .action-btn i { font-size: 24px; }
    }
  </style>
  <script async src="https://www.tiktok.com/embed.js"></script>
</head>
<body>

<div class="header">
  <div class="logo" onclick="window.location.href='/community.html'">Pebeto</div>
  <div class="search-bar">
    <i class="ri-search-line"></i>
    <input type="text" id="global-search" placeholder="Search creators..." onkeyup="searchGlobal()">
  </div>
  <div class="nav-icons">
    <button class="dashboard-btn" onclick="goToDashboard()">
      <i class="ri-dashboard-line"></i> Dashboard
    </button>
    <div class="avatar" id="nav-avatar" onclick="goToDashboard()">U</div>
  </div>
</div>

<div id="feed-container" class="feed-container">
  <div class="loading-spinner">Loading videos...</div>
</div>

<!-- Tip Modal -->
<div id="tip-modal" class="modal">
  <div class="modal-content">
    <h3>💝 Send Tip</h3>
    <p id="tip-creator-name" style="margin-bottom: 15px;">To: Creator</p>
    
    <label style="display: block; margin-bottom: 8px; font-size: 14px; color: #a08070;">Pay with:</label>
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <button type="button" class="payment-source-btn" data-source="wallet" onclick="selectPaymentSource('wallet')" style="flex: 1; background: rgba(255,140,66,0.2); border: 1px solid #ff8c42; padding: 10px; border-radius: 40px; cursor: pointer;">💼 Wallet</button>
      <button type="button" class="payment-source-btn" data-source="mpesa" onclick="selectPaymentSource('mpesa')" style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,140,66,0.3); padding: 10px; border-radius: 40px; cursor: pointer;">📱 M-Pesa</button>
      <button type="button" class="payment-source-btn" data-source="paypal" onclick="selectPaymentSource('paypal')" style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,140,66,0.3); padding: 10px; border-radius: 40px; cursor: pointer;">💳 PayPal</button>
    </div>
    
    <input type="number" id="tip-amount" placeholder="Amount" min="1" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,140,66,0.3); padding: 14px; border-radius: 40px; margin-bottom: 15px; color: white;">
    <select id="tip-currency" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,140,66,0.3); padding: 14px; border-radius: 40px; margin-bottom: 15px; color: white;">
      <option value="USD">USD ($)</option>
      <option value="KES">KES (KSh)</option>
      <option value="EUR">EUR (€)</option>
    </select>
    
    <div id="mpesa-details" style="display: none;">
      <input type="tel" id="mpesa-phone" placeholder="M-Pesa Phone (254712345678)">
    </div>
    <div id="paypal-details" style="display: none;">
      <input type="email" id="paypal-email" placeholder="PayPal Email">
    </div>
    
    <div style="background: rgba(255,140,66,0.1); padding: 12px; border-radius: 16px; margin: 15px 0; font-size: 13px;">
      💡 5% fee | Creator gets: <span id="creator-receives">0.00</span>
    </div>
    
    <div class="modal-buttons">
      <button class="save-btn" onclick="sendTip()">Send Tip</button>
      <button class="cancel-btn" onclick="closeModal('tip-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Comments Modal -->
<div id="comments-modal" class="modal">
  <div class="modal-content">
    <h3>💬 Comments</h3>
    <div id="comments-list" class="comments-list"></div>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="comment-input" placeholder="Add a comment..." style="flex:1;">
      <button class="save-btn" onclick="addComment()">Post</button>
    </div>
    <div class="modal-buttons"><button class="cancel-btn" onclick="closeModal('comments-modal')">Close</button></div>
  </div>
</div>

<script>
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';
  let currentUser = null;
  let allPosts = [];
  let currentPostId = null;
  let currentTipCreatorId = null;
  let currentTipCreatorName = '';
  let selectedPaymentSource = 'wallet';
  let currentPlayingVideo = null;
  let currentVideoElement = null;

  // Helper functions
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function formatNumber(num) {
    if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num/1000).toFixed(1) + 'K';
    return num.toString();
  }

  function goToDashboard() {
    const token = localStorage.getItem('pebeto_token');
    if (!token) { window.location.href = '/login.html'; return; }
    const userStr = localStorage.getItem('pebeto_user');
    if (userStr) {
      try {
        const user = JSON.parse(userStr);
        if (user.role === 'creator') window.location.href = '/creator-dashboard.html';
        else if (user.role === 'business') window.location.href = '/business-dashboard.html';
        else if (user.role === 'admin') window.location.href = '/admin-dashboard.html';
        else window.location.href = '/login.html';
      } catch(e) { window.location.href = '/login.html'; }
    } else { window.location.href = '/login.html'; }
  }

  function selectPaymentSource(source) {
    selectedPaymentSource = source;
    document.querySelectorAll('.payment-source-btn').forEach(btn => {
      btn.style.background = 'rgba(255,255,255,0.05)';
      btn.style.border = '1px solid rgba(255,140,66,0.3)';
    });
    const activeBtn = document.querySelector(`.payment-source-btn[data-source="${source}"]`);
    if (activeBtn) {
      activeBtn.style.background = 'rgba(255,140,66,0.2)';
      activeBtn.style.border = '1px solid #ff8c42';
    }
    document.getElementById('mpesa-details').style.display = source === 'mpesa' ? 'block' : 'none';
    document.getElementById('paypal-details').style.display = source === 'paypal' ? 'block' : 'none';
  }

  function updateCreatorReceives() {
    const amount = parseFloat(document.getElementById('tip-amount').value) || 0;
    document.getElementById('creator-receives').innerHTML = (amount * 0.95).toFixed(2);
  }

  // Load posts from backend
  async function loadPosts() {
    try {
      const token = localStorage.getItem('pebeto_token');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
      const response = await fetch(`${API_BASE}/api/community/posts`, { headers });
      const data = await response.json();
      allPosts = data.posts || [];
      
      if (allPosts.length === 0) {
        showSamplePosts();
      } else {
        renderFeed();
      }
    } catch (error) {
      console.error('Error loading posts:', error);
      showSamplePosts();
    }
  }

  function showSamplePosts() {
    allPosts = [
      {
        _id: 'post1',
        mediaUrl: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4',
        caption: 'Check out this amazing content! 🔥 #Pebeto',
        author: {
          _id: 'user1',
          profile: { stageName: 'DJ Nova', avatarUrl: '' },
          uniqueCode: '@djnova',
          role: 'creator'
        },
        likeCount: 1234,
        commentCount: 89,
        shareCount: 45,
        isLiked: false
      },
      {
        _id: 'post2',
        mediaUrl: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_2mb.mp4',
        caption: 'Art tutorial coming soon! 🎨',
        author: {
          _id: 'user2',
          profile: { stageName: 'Sarah Creates', avatarUrl: '' },
          uniqueCode: '@sarahcreates',
          role: 'creator'
        },
        likeCount: 567,
        commentCount: 34,
        shareCount: 12,
        isLiked: false
      },
      {
        _id: 'post3',
        mediaUrl: 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_3mb.mp4',
        caption: 'Morning workout routine! 💪',
        author: {
          _id: 'user3',
          profile: { stageName: 'Mike Fitness', avatarUrl: '' },
          uniqueCode: '@mikefitness',
          role: 'creator'
        },
        likeCount: 2345,
        commentCount: 156,
        shareCount: 89,
        isLiked: false
      }
    ];
    renderFeed();
  }

  function renderFeed() {
    const container = document.getElementById('feed-container');
    container.innerHTML = '';
    
    if (allPosts.length === 0) {
      container.innerHTML = '<div class="loading-spinner">No videos yet. Check back soon!</div>';
      return;
    }
    
    allPosts.forEach((post, index) => {
      const postEl = createPostElement(post, index);
      container.appendChild(postEl);
    });
    
    // Setup intersection observer for autoplay
    setupVideoAutoplay();
  }

  function createPostElement(post, index) {
    const article = document.createElement('article');
    article.className = 'video-post';
    article.dataset.postId = post._id;
    article.dataset.index = index;
    
    const authorName = post.author?.profile?.stageName || post.author?.uniqueCode?.replace('@', '') || 'Creator';
    const authorUsername = post.author?.uniqueCode || `@${authorName.toLowerCase().replace(/\s/g, '')}`;
    const authorAvatar = post.author?.profile?.avatarUrl || '';
    const authorId = post.author?._id || 'unknown';
    const isLiked = post.isLiked || false;
    const likeIconClass = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
    const likeIconColor = isLiked ? '#ff0050' : 'white';
    
    article.innerHTML = `
      <video class="post-video" src="${post.mediaUrl}" loop muted playsinline preload="metadata"></video>
      <div class="unmute-btn" onclick="toggleMute(this, event)">
        <i class="ri-volume-mute-line"></i>
      </div>
      <div class="post-overlay">
        <div class="post-author" onclick="viewProfile('${authorId}')">
          <div class="author-avatar" style="background-image: url(${authorAvatar})">${!authorAvatar ? (authorName[0] || 'U') : ''}</div>
          <div class="author-info">
            <h4>${escapeHtml(authorName)} <span>${escapeHtml(authorUsername)}</span> • 🎨 Creator</h4>
            <p>Content Creator</p>
          </div>
        </div>
        <div class="post-caption">${escapeHtml(post.caption || '')}</div>
        <div class="sound-tag" onclick="alert('Sound info coming soon')">
          <i class="ri-music-2-line"></i> Original Sound
        </div>
      </div>
      <div class="right-actions">
        <div class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post._id}', this)">
          <i class="${likeIconClass}" style="color:${likeIconColor}"></i>
          <span>${formatNumber(post.likeCount || 0)}</span>
        </div>
        <div class="action-btn" onclick="openComments('${post._id}')">
          <i class="ri-chat-3-line"></i>
          <span>${formatNumber(post.commentCount || 0)}</span>
        </div>
        <div class="action-btn" onclick="sharePost('${post._id}')">
          <i class="ri-share-forward-line"></i>
          <span>${formatNumber(post.shareCount || 0)}</span>
        </div>
        <div class="action-btn" onclick="openTipModal('${authorId}', '${escapeHtml(authorName)}')">
          <i class="ri-coin-line"></i>
          <span>Tip</span>
        </div>
        <div class="action-btn" onclick="viewProfile('${authorId}')">
          <i class="ri-user-line"></i>
          <span>Profile</span>
        </div>
      </div>
    `;
    
    return article;
  }

  function setupVideoAutoplay() {
    const videos = document.querySelectorAll('.post-video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          // Pause all other videos
          document.querySelectorAll('.post-video').forEach(v => {
            if (v !== video) v.pause();
          });
          // Play this video (muted)
          video.play().catch(e => console.log('Autoplay prevented:', e));
          currentPlayingVideo = video;
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });
    
    videos.forEach(video => observer.observe(video));
  }

  function toggleMute(btn, event) {
    event.stopPropagation();
    const video = btn.closest('.video-post').querySelector('video');
    if (video.muted) {
      video.muted = false;
      btn.innerHTML = '<i class="ri-volume-up-line"></i>';
    } else {
      video.muted = true;
      btn.innerHTML = '<i class="ri-volume-mute-line"></i>';
    }
  }

  async function toggleLike(postId, element) {
    const token = localStorage.getItem('pebeto_token');
    if (!token) { alert('Please login to like'); window.location.href = '/login.html'; return; }
    
    const icon = element.querySelector('i');
    const countSpan = element.querySelector('span');
    const isLiked = icon.classList.contains('ri-heart-fill');
    
    try {
      const method = isLiked ? 'DELETE' : 'POST';
      const response = await fetch(`${API_BASE}/api/community/posts/${postId}/like`, {
        method: method,
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      
      if (data.success || data.liked !== undefined) {
        if (!isLiked) {
          icon.classList.remove('ri-heart-line');
          icon.classList.add('ri-heart-fill');
          icon.style.color = '#ff0050';
          element.classList.add('liked');
          countSpan.innerText = formatNumber((parseInt(countSpan.innerText.replace(/[^0-9]/g, '')) || 0) + 1);
        } else {
          icon.classList.remove('ri-heart-fill');
          icon.classList.add('ri-heart-line');
          icon.style.color = 'white';
          element.classList.remove('liked');
          countSpan.innerText = formatNumber(Math.max(0, (parseInt(countSpan.innerText.replace(/[^0-9]/g, '')) || 0) - 1));
        }
      }
    } catch (error) {
      console.error('Like error:', error);
    }
  }

  async function openComments(postId) {
    currentPostId = postId;
    const modal = document.getElementById('comments-modal');
    const commentsList = document.getElementById('comments-list');
    commentsList.innerHTML = '<div style="text-align:center; padding:20px;">Loading...</div>';
    modal.style.display = 'flex';
    
    try {
      const token = localStorage.getItem('pebeto_token');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
      const response = await fetch(`${API_BASE}/api/community/posts/${postId}/comments`, { headers });
      const data = await response.json();
      const comments = data.comments || [];
      
      if (comments.length === 0) {
        commentsList.innerHTML = '<div style="text-align:center; padding:20px;">No comments yet. Be the first!</div>';
      } else {
        commentsList.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div style="width:32px; height:32px; border-radius:50%; background:#ff8c42; display:flex; align-items:center; justify-content:center; font-size:12px;">${(c.author?.uniqueCode?.[0] || 'U').toUpperCase()}</div>
            <div><strong>${escapeHtml(c.author?.uniqueCode || 'User')}</strong><p style="font-size:13px;">${escapeHtml(c.text)}</p></div>
          </div>
        `).join('');
      }
    } catch (error) {
      commentsList.innerHTML = '<div style="text-align:center; padding:20px;">Failed to load comments</div>';
    }
  }

  async function addComment() {
    const input = document.getElementById('comment-input');
    const text = input.value.trim();
    if (!text || !currentPostId) return;
    
    const token = localStorage.getItem('pebeto_token');
    if (!token) { alert('Please login to comment'); window.location.href = '/login.html'; return; }
    
    try {
      await fetch(`${API_BASE}/api/community/posts/${currentPostId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ text })
      });
      input.value = '';
      await openComments(currentPostId);
      
      // Update comment count in feed
      const postElement = document.querySelector(`.video-post[data-post-id="${currentPostId}"]`);
      if (postElement) {
        const commentBtn = postElement.querySelector('.action-btn:nth-child(2) span');
        if (commentBtn) {
          let currentCount = parseInt(commentBtn.innerText.replace(/[^0-9]/g, '')) || 0;
          commentBtn.innerText = formatNumber(currentCount + 1);
        }
      }
    } catch (error) {
      alert('Failed to add comment');
    }
  }

  function sharePost(postId) {
    const url = `${window.location.origin}/community.html?post=${postId}`;
    navigator.clipboard.writeText(url);
    alert('Link copied to clipboard!');
  }

  function openTipModal(creatorId, creatorName) {
    const token = localStorage.getItem('pebeto_token');
    if (!token) { alert('Please login to send tips'); window.location.href = '/login.html'; return; }
    
    currentTipCreatorId = creatorId;
    currentTipCreatorName = creatorName;
    document.getElementById('tip-creator-name').innerHTML = `To: <strong>${escapeHtml(creatorName)}</strong>`;
    document.getElementById('tip-modal').style.display = 'flex';
    
    document.getElementById('tip-amount').value = '';
    document.getElementById('creator-receives').innerHTML = '0.00';
    selectedPaymentSource = 'wallet';
    
    document.querySelectorAll('.payment-source-btn').forEach(btn => {
      btn.style.background = 'rgba(255,255,255,0.05)';
      btn.style.border = '1px solid rgba(255,140,66,0.3)';
    });
    const walletBtn = document.querySelector('.payment-source-btn[data-source="wallet"]');
    if (walletBtn) {
      walletBtn.style.background = 'rgba(255,140,66,0.2)';
      walletBtn.style.border = '1px solid #ff8c42';
    }
    document.getElementById('mpesa-details').style.display = 'none';
    document.getElementById('paypal-details').style.display = 'none';
    document.getElementById('tip-amount').removeEventListener('input', updateCreatorReceives);
    document.getElementById('tip-amount').addEventListener('input', updateCreatorReceives);
  }

  async function sendTip() {
    const amount = parseFloat(document.getElementById('tip-amount').value);
    const currency = document.getElementById('tip-currency').value;
    
    if (!amount || amount <= 0) { alert('Enter valid amount'); return; }
    
    const token = localStorage.getItem('pebeto_token');
    if (!token) { alert('Please login'); window.location.href = '/login.html'; return; }
    
    let paymentDetails = {};
    if (selectedPaymentSource === 'mpesa') {
      const phone = document.getElementById('mpesa-phone').value;
      if (!phone) { alert('Enter M-Pesa phone number'); return; }
      paymentDetails = { phoneNumber: phone, method: 'mpesa' };
    } else if (selectedPaymentSource === 'paypal') {
      const email = document.getElementById('paypal-email').value;
      if (!email) { alert('Enter PayPal email'); return; }
      paymentDetails = { paypalEmail: email, method: 'paypal' };
    } else {
      paymentDetails = { method: 'wallet' };
    }
    
    try {
      const response = await fetch(`${API_BASE}/api/wallet/tip`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          creatorId: currentTipCreatorId,
          amount: amount,
          currency: currency,
          paymentSource: selectedPaymentSource,
          paymentDetails: paymentDetails
        })
      });
      const data = await response.json();
      
      if (data.success) {
        alert(`💝 Tip sent to ${currentTipCreatorName}!`);
        closeModal('tip-modal');
        document.getElementById('tip-amount').value = '';
      } else {
        alert(data.message || 'Tip failed');
      }
    } catch (error) {
      alert('Network error');
    }
  }

  function viewProfile(userId) {
    window.location.href = `/creator-profile.html?id=${userId}`;
  }

  async function searchGlobal() {
    const query = document.getElementById('global-search').value.toLowerCase();
    if (!query) { loadPosts(); return; }
    
    const filtered = allPosts.filter(p => 
      p.author?.profile?.stageName?.toLowerCase().includes(query) ||
      p.author?.uniqueCode?.toLowerCase().includes(query) ||
      p.caption?.toLowerCase().includes(query)
    );
    
    const container = document.getElementById('feed-container');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="loading-spinner">No results found</div>';
    } else {
      container.innerHTML = '';
      filtered.forEach((post, idx) => {
        container.appendChild(createPostElement(post, idx));
      });
      setupVideoAutoplay();
    }
  }

  function loadUserData() {
    const userStr = localStorage.getItem('pebeto_user');
    if (userStr) {
      try {
        currentUser = JSON.parse(userStr);
        const initial = (currentUser.profile?.stageName?.[0] || currentUser.email[0] || 'U').toUpperCase();
        document.getElementById('nav-avatar').innerHTML = initial;
        if (currentUser.profile?.avatarUrl) {
          document.getElementById('nav-avatar').style.backgroundImage = `url(${currentUser.profile.avatarUrl})`;
          document.getElementById('nav-avatar').innerHTML = '';
        }
      } catch(e) {}
    }
  }

  function escapeHtml(str) { 
    if (!str) return ''; 
    return str.replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
  }

  loadUserData();
  loadPosts();
</script>
</body>
