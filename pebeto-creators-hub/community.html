<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Community - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 70px;
    }
    body.light-theme {
      background: #f5f5f5;
      color: #1a1a1a;
    }
    body.light-theme .creator-card,
    body.light-theme .modal-content,
    body.light-theme .notification-dropdown,
    body.light-theme .filter-sort-bar {
      background: #ffffff;
      border-color: #e0e0e0;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,140,66,0.2);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }
    body.light-theme .header { background: rgba(255,255,255,0.95); border-bottom-color: rgba(255,140,66,0.3); }
    .logo { font-size: 24px; font-weight: 800; color: #ff8c42; cursor: pointer; }
    .search-bar {
      background: rgba(255,255,255,0.1); border-radius: 40px;
      padding: 8px 16px; display: flex; align-items: center; gap: 8px; width: 300px;
      position: relative;
    }
    .search-history-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1510;
      border-radius: 16px;
      margin-top: 8px;
      z-index: 101;
      display: none;
    }
    .search-history-dropdown.show { display: block; }
    .search-history-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .search-history-item:hover { background: rgba(255,140,66,0.1); }
    .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; }
    .nav-icons { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .dashboard-btn, .logout-btn {
      background: rgba(255,140,66,0.15); border: 1px solid #ff8c42;
      padding: 8px 16px; border-radius: 40px; color: #ffaa77;
      cursor: pointer; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .dashboard-btn:hover, .logout-btn:hover { background: #ff8c42; color: white; }
    .theme-toggle {
      background: rgba(255,255,255,0.1); border: none;
      padding: 8px 12px; border-radius: 40px; color: #ffaa77;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; gap: 6px;
    }
    .notification-bell {
      position: relative;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 40px;
    }
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #f44336;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      width: 320px;
      background: #1a1510;
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 16px;
      z-index: 200;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }
    .notification-dropdown.show { display: block; }
    .notification-item {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }
    .notification-item:hover { background: rgba(255,140,66,0.1); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; background-size: cover;
    }
    .feed-container { 
      margin-top: 80px; 
      padding: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .feed-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 50px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .feed-tab {
      flex: 1;
      padding: 10px;
      border-radius: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .feed-tab.active {
      background: #ff8c42;
      color: white;
    }
    .filter-sort-bar {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 60px;
      padding: 10px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: #ff8c42;
      color: white;
      border-color: #ff8c42;
    }
    .sort-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }
    .creator-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 24px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: transform 0.2s, opacity 0.3s;
    }
    .creator-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,140,66,0.4);
    }
    .creator-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }
    .creator-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background-size: cover;
      position: relative;
      cursor: pointer;
    }
    .online-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #4ade80;
      border-radius: 50%;
      border: 2px solid #0a0a0a;
    }
    .live-badge {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .verified-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #1da1f2;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 2px solid #0a0a0a;
    }
    .creator-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .creator-info p { font-size: 13px; color: #a08070; }
    .creator-niche {
      display: inline-block;
      background: rgba(255,140,66,0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 6px;
    }
    .follow-btn, .save-creator-btn, .not-interested-btn {
      margin-left: auto;
      background: rgba(255,140,66,0.15);
      border: 1px solid #ff8c42;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .follow-btn.following, .save-creator-btn.saved {
      background: #ff8c42;
      color: white;
    }
    .not-interested-btn {
      background: rgba(100,100,100,0.3);
      border-color: #666;
      color: #ccc;
    }
    .not-interested-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }
    .video-embed-container { padding: 20px; background: #000; position: relative; }
    .video-controls {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .video-control-btn {
      background: rgba(0,0,0,0.7);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .video-control-btn:hover { background: #ff8c42; }
    .view-count-badge {
      position: absolute;
      bottom: 40px;
      left: 40px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.3);
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ff8c42;
      transition: width 0.3s;
    }
    .skeleton-card {
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .tiktok-embed-container { min-height: 600px; background: #000; }
    .youtube-embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .youtube-embed-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .creator-actions {
      display: flex;
      gap: 12px;
      padding: 15px 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }
    .action-btn, .tip-btn, .profile-btn, .share-btn, .report-btn, .dm-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .action-btn:hover, .profile-btn:hover, .share-btn:hover, .dm-btn:hover { background: rgba(255,255,255,0.15); }
    .action-btn.liked { background: rgba(255,0,80,0.2); border-color: #ff0050; color: #ff0050; }
    .tip-btn { background: rgba(255,140,66,0.2); border: 1px solid #ff8c42; color: #ffaa77; }
    .tip-btn:hover { background: #ff8c42; color: white; }
    .report-btn { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #ef4444; }
    .report-btn:hover { background: #ef4444; color: white; }
    .dm-btn { background: rgba(59,130,246,0.15); border-color: #3b82f6; color: #3b82f6; }
    .dm-btn:hover { background: #3b82f6; color: white; }
    .like-animation {
      position: fixed;
      pointer-events: none;
      font-size: 40px;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 1000;
    }
    @keyframes floatUp {
      0% { transform: scale(0.5); opacity: 1; bottom: 50%; left: 50%; }
      100% { transform: scale(1.5); opacity: 0; bottom: 70%; left: 55%; }
    }
    .loading-spinner { text-align: center; padding: 50px; color: #ff8c42; }
    .infinite-scroll-trigger { height: 20px; margin: 20px 0; text-align: center; color: #a08070; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1510;
      border-radius: 28px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      border: 1px solid rgba(255,140,66,0.3);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 20px; color: #ff8c42; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 12px;
      border-radius: 30px;
      margin-bottom: 15px;
      color: white;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; border: none; cursor: pointer; }
    .save-btn { background: #ff8c42; color: white; }
    .cancel-btn { background: rgba(255,255,255,0.1); color: white; }
    .comments-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
    .comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
    .comment-actions {
      position: absolute;
      right: 0;
      top: 10px;
      display: flex;
      gap: 8px;
    }
    .comment-actions button {
      background: none;
      border: none;
      color: #a08070;
      cursor: pointer;
      font-size: 12px;
    }
    .reply-form {
      margin-left: 40px;
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .reply-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: none;
      padding: 8px;
      border-radius: 20px;
      color: white;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,140,66,0.2);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      z-index: 99;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #a08070;
      transition: color 0.2s;
    }
    .bottom-nav-item.active, .bottom-nav-item:hover { color: #ff8c42; }
    .bottom-nav-item i { font-size: 22px; }
    .bottom-nav-item span { font-size: 10px; }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1510;
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 12px;
      padding: 12px 24px;
      z-index: 2001;
      animation: slideUp 0.3s ease;
      white-space: nowrap;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100%); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    .suggested-niches {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255,140,66,0.1);
      border-radius: 60px;
      justify-content: center;
    }
    .niche-badge {
      background: rgba(255,140,66,0.2);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
    }
    @media (max-width: 768px) {
      .search-bar { display: none; }
      .feed-container { padding: 15px; padding-bottom: 80px; }
      .creator-actions { justify-content: center; }
      .filter-sort-bar { flex-direction: column; align-items: stretch; border-radius: 20px; }
      .filter-group { justify-content: center; }
      .filter-chip { font-size: 11px; padding: 4px 12px; }
      .toast { white-space: normal; max-width: 90%; text-align: center; }
    }
    @media (prefers-contrast: high) {
      .creator-card { border: 2px solid #ff8c42; }
      .action-btn, .tip-btn { border: 2px solid; }
    }
    .keyboard-focus:focus-visible {
      outline: 2px solid #ff8c42;
      outline-offset: 2px;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div class="header">
  <div class="logo" onclick="window.location.href='/community.html'">Pebeto</div>
  <div class="search-bar">
    <i class="ri-search-line"></i>
    <input type="text" id="global-search" placeholder="Search creators..." onkeyup="debouncedSearch()" onfocus="showSearchHistory()">
    <div id="search-history-dropdown" class="search-history-dropdown"></div>
  </div>
  <div class="nav-icons">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"><i class="ri-sun-line"></i></button>
    <div class="notification-bell" onclick="toggleNotifications()" aria-label="Notifications">
      <i class="ri-notification-3-line"></i>
      <span id="notification-badge" class="notification-badge" style="display: none;">0</span>
      <div id="notification-dropdown" class="notification-dropdown"></div>
    </div>
    <button class="dashboard-btn" onclick="goToDashboard()"><i class="ri-dashboard-line"></i> Dashboard</button>
    <button class="logout-btn" onclick="logout()"><i class="ri-logout-box-r-line"></i> Logout</button>
    <div class="avatar" id="nav-avatar" onclick="goToDashboard()" role="button" aria-label="Profile">U</div>
  </div>
</div>

<div class="feed-container">
  <div id="suggested-niches-container" class="suggested-niches"></div>
  <div class="feed-tabs">
    <div class="feed-tab active" data-feed="foryou" onclick="switchFeedTab('foryou')">For You</div>
    <div class="feed-tab" data-feed="following" onclick="switchFeedTab('following')">Following</div>
    <div class="feed-tab" data-feed="saved" onclick="switchFeedTab('saved')">Saved</div>
    <div class="feed-tab" data-feed="trending" onclick="switchFeedTab('trending')">🔥 Trending</div>
  </div>

  <div class="filter-sort-bar">
    <div class="filter-group">
      <span class="filter-chip active" data-niche="all" onclick="filterByNiche('all')">All</span>
      <span class="filter-chip" data-niche="Music" onclick="filterByNiche('Music')">🎵 Music</span>
      <span class="filter-chip" data-niche="Art" onclick="filterByNiche('Art')">🎨 Art</span>
      <span class="filter-chip" data-niche="Fitness" onclick="filterByNiche('Fitness')">💪 Fitness</span>
      <span class="filter-chip" data-niche="Gaming" onclick="filterByNiche('Gaming')">🎮 Gaming</span>
      <span class="filter-chip" data-niche="Tech" onclick="filterByNiche('Tech')">💻 Tech</span>
    </div>
    <select class="sort-select" id="sort-select" onchange="sortCreators()">
      <option value="likes">🔥 Most Liked</option>
      <option value="newest">🕐 Newest First</option>
      <option value="oldest">📅 Oldest First</option>
      <option value="name">📝 Name A-Z</option>
      <option value="engagement">⭐ Engagement Rate</option>
    </select>
  </div>

  <div id="feed-content"></div>
  <div id="infinite-scroll-trigger" class="infinite-scroll-trigger"></div>
</div>

<div class="bottom-nav">
  <div class="bottom-nav-item active" data-nav="foryou" onclick="switchFeedTab('foryou')"><i class="ri-home-5-line"></i><span>Home</span></div>
  <div class="bottom-nav-item" data-nav="trending" onclick="switchFeedTab('trending')"><i class="ri-fire-line"></i><span>Trending</span></div>
  <div class="bottom-nav-item" data-nav="notifications" onclick="toggleNotifications()"><i class="ri-notification-3-line"></i><span>Alerts</span></div>
  <div class="bottom-nav-item" data-nav="profile" onclick="goToDashboard()"><i class="ri-user-line"></i><span>Profile</span></div>
</div>

<!-- Modals (unchanged for brevity) -->
<div id="tip-modal" class="modal">...</div>
<div id="comments-modal" class="modal">...</div>
<div id="edit-comment-modal" class="modal">...</div>
<div id="share-modal" class="modal">...</div>
<div id="report-modal" class="modal">...</div>
<div id="dm-modal" class="modal">...</div>
<div id="confirm-modal" class="modal">...</div>

<script>
  // ==================== EXISTING CODE (abbreviated for clarity) ====================
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';
  let currentUser = null, allCreators = [], filteredCreators = [], currentOffset = 0, PAGE_SIZE = 10;
  let currentFeedTab = 'foryou', currentNicheFilter = 'all', currentSort = 'likes', currentSearchQuery = '';
  let notifications = [], following = new Set(), savedCreators = new Set(), blockedCreators = new Set(), mutedCreators = new Set();
  let userWalletBalance = 0, pendingLike = false, pendingComment = false, pendingTip = false;
  let currentCommentCreatorId = null, currentTipCreatorId = null, selectedPaymentSource = 'wallet';
  let currentShareCreatorId = null, currentReportCreatorId = null, currentDMRecipientId = null;
  let isLoading = false, hasMore = true, debounceTimer = null, autoRefreshInterval = null;
  let currentlyPlayingVideo = null, videoObserver = null, ytPlayers = {};

  // --- Personalization System ---
  let userInterests = JSON.parse(localStorage.getItem('pebeto_interests')) || {
    Music: 0, Art: 0, Fitness: 0, Gaming: 0, Tech: 0, Food: 0, Travel: 0, Education: 0
  };
  let watchHistory = JSON.parse(localStorage.getItem('pebeto_watch_history')) || [];
  let notInterestedCreators = new Set(JSON.parse(localStorage.getItem('pebeto_not_interested') || '[]'));

  function recordInterest(niche, weight = 1) {
    if (!niche || niche === 'Creator') return;
    if (userInterests[niche] !== undefined) {
      userInterests[niche] = Math.min(1000, userInterests[niche] + weight);
      localStorage.setItem('pebeto_interests', JSON.stringify(userInterests));
      updateSuggestedNiches();
      if (currentFeedTab === 'foryou') applyFiltersAndSort();
    }
  }

  function recordWatchTime(creatorId, niche, secondsWatched) {
    if (secondsWatched < 3) return;
    watchHistory.unshift({ creatorId, niche, timestamp: Date.now(), duration: secondsWatched });
    if (watchHistory.length > 200) watchHistory.pop();
    localStorage.setItem('pebeto_watch_history', JSON.stringify(watchHistory));
    let weight = Math.min(5, Math.floor(secondsWatched / 10));
    recordInterest(niche, weight);
  }

  function markNotInterested(creatorId, creatorName, niche) {
    if (notInterestedCreators.has(creatorId)) return;
    notInterestedCreators.add(creatorId);
    localStorage.setItem('pebeto_not_interested', JSON.stringify([...notInterestedCreators]));
    if (niche) recordInterest(niche, -3);
    showToast(`✅ You won't see ${creatorName} again.`);
    applyFiltersAndSort();
  }

  function getTopNiches(count = 5) {
    return Object.entries(userInterests).filter(([_, score]) => score > 0).sort((a, b) => b[1] - a[1]).slice(0, count).map(([niche]) => niche);
  }

  function personalizeFeed(creators) {
    const topNiches = getTopNiches(5);
    if (topNiches.length === 0 || currentFeedTab !== 'foryou') return creators;
    const prioritized = [
      ...creators.filter(c => topNiches.includes(c.profile?.niche) && !notInterestedCreators.has(c._id)),
      ...creators.filter(c => !topNiches.includes(c.profile?.niche) && !notInterestedCreators.has(c._id))
    ];
    return prioritized;
  }

  function updateSuggestedNiches() {
    const container = document.getElementById('suggested-niches-container');
    if (!container) return;
    const top = getTopNiches(5);
    if (top.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = `<span style="opacity:0.7;">🎯 For you:</span> ${top.map(n => `<span class="niche-badge">${n}</span>`).join('')}`;
  }

  // --- Enhanced Autoplay with YouTube API and watch tracking ---
  function onYouTubeIframeAPIReady() {
    document.querySelectorAll('.youtube-embed-container iframe').forEach((iframe, idx) => {
      const id = iframe.id || `yt-player-${idx}`;
      iframe.id = id;
      if (typeof YT !== 'undefined' && YT.Player) {
        ytPlayers[id] = new YT.Player(id, {
          events: {
            onReady: (event) => { event.target.mute(); event.target.playVideo(); },
            onStateChange: (event) => { if (event.data === YT.PlayerState.PLAYING) trackYouTubeWatch(event.target); }
          }
        });
      }
    });
  }

  function trackYouTubeWatch(player) {
    const startTime = Date.now();
    const interval = setInterval(() => {
      if (!player || player.getPlayerState() !== YT.PlayerState.PLAYING) { clearInterval(interval); return; }
      const elapsed = (Date.now() - startTime) / 1000;
      if (elapsed >= 10) {
        const container = player.getIframe()?.closest('.video-embed-container');
        const creatorId = container?.dataset.videoId;
        const creator = allCreators.find(c => c._id === creatorId);
        if (creator) recordWatchTime(creatorId, creator.profile?.niche, elapsed);
        clearInterval(interval);
      }
    }, 10000);
  }

  function setupVideoAutoplay() {
    if (videoObserver) videoObserver.disconnect();
    videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;
        if (entry.isIntersecting) {
          if (currentlyPlayingVideo && currentlyPlayingVideo !== container) {
            const prevIframe = currentlyPlayingVideo.querySelector('iframe');
            if (prevIframe && prevIframe.src.includes('youtube')) prevIframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          }
          currentlyPlayingVideo = container;
          if (iframe.src.includes('youtube')) iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          else if (iframe.src.includes('tiktok')) { /* TikTok no autoplay API */ }
        } else {
          if (currentlyPlayingVideo === container && iframe.src.includes('youtube')) iframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('.video-embed-container').forEach(c => videoObserver.observe(c));
  }

  // --- Modified applyFiltersAndSort to include personalization ---
  function applyFiltersAndSort() {
    let filtered = [...allCreators];
    filtered = filtered.filter(c => !notInterestedCreators.has(c._id));
    if (blockedCreators.size > 0) filtered = filtered.filter(c => !blockedCreators.has(c._id));
    if (mutedCreators.size > 0 && currentFeedTab !== 'following') filtered = filtered.filter(c => !mutedCreators.has(c._id));
    if (currentFeedTab === 'following') filtered = filtered.filter(c => following.has(c._id));
    if (currentFeedTab === 'saved') filtered = filtered.filter(c => savedCreators.has(c._id));
    if (currentFeedTab === 'trending') filtered = filtered.filter(c => (c.engagementRate || 0) > 4).sort((a,b) => (b.engagementRate || 0) - (a.engagementRate || 0));
    if (currentNicheFilter !== 'all') filtered = filtered.filter(c => (c.profile?.niche || '') === currentNicheFilter);
    if (currentSearchQuery) filtered = filtered.filter(c => (c.profile?.stageName || '').toLowerCase().includes(currentSearchQuery) || (c.profile?.niche || '').toLowerCase().includes(currentSearchQuery));
    if (currentSort === 'likes') filtered.sort((a,b) => (b.likeCount || 0) - (a.likeCount || 0));
    else if (currentSort === 'newest') filtered.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    else if (currentSort === 'oldest') filtered.sort((a,b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
    else if (currentSort === 'name') filtered.sort((a,b) => (a.profile?.stageName || '').localeCompare(b.profile?.stageName || ''));
    else if (currentSort === 'engagement') filtered.sort((a,b) => (b.engagementRate || 0) - (a.engagementRate || 0));
    filtered = personalizeFeed(filtered);
    filteredCreators = filtered;
    currentOffset = 0;
    renderFeed();
    updateSuggestedNiches();
  }

  // --- Modified toggleLike to record interest ---
  async function toggleLike(event, button, creatorId) {
    event.stopPropagation();
    if (pendingLike) return;
    pendingLike = true;
    const creator = allCreators.find(c => c._id === creatorId);
    if (creator && !button.classList.contains('liked')) recordInterest(creator.profile?.niche, 2);
    // ... rest of existing like logic (keep original implementation)
    // For brevity, we keep the existing logic but add interest recording
    const rect = button.getBoundingClientRect();
    showLikeAnimation(rect.left + rect.width/2, rect.top);
    const token = localStorage.getItem('pebeto_token');
    if (!token) { alert('Please log in to like'); pendingLike = false; return; }
    const icon = button.querySelector('i'); const countSpan = button.querySelector('.like-count');
    const isCurrentlyLiked = button.classList.contains('liked');
    let currentCount = parseInt(countSpan.innerText.replace(/[^0-9]/g, '')) || 0;
    if (isCurrentlyLiked) { button.classList.remove('liked'); icon.classList.replace('ri-heart-fill', 'ri-heart-line'); countSpan.innerText = formatNumber(currentCount - 1); }
    else { button.classList.add('liked'); icon.classList.replace('ri-heart-line', 'ri-heart-fill'); countSpan.innerText = formatNumber(currentCount + 1); }
    try {
      const method = isCurrentlyLiked ? 'DELETE' : 'POST';
      await fetch(`${API_BASE}/api/community/creators/${creatorId}/like`, { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
      if (creator) { creator.likeCount = isCurrentlyLiked ? currentCount - 1 : currentCount + 1; creator.isLiked = !isCurrentlyLiked; }
    } catch (error) { console.error(error); }
    pendingLike = false;
  }

  // --- Modified searchGlobal to record interest based on search keywords ---
  function searchGlobal() {
    currentSearchQuery = document.getElementById('global-search').value.toLowerCase();
    if (currentSearchQuery) {
      saveSearchHistory(currentSearchQuery);
      const keywordMap = { music: 'Music', art: 'Art', fitness: 'Fitness', gym: 'Fitness', gaming: 'Gaming', tech: 'Tech', technology: 'Tech', food: 'Food', travel: 'Travel', education: 'Education' };
      for (let [kw, niche] of Object.entries(keywordMap)) if (currentSearchQuery.includes(kw)) { recordInterest(niche, 1); break; }
    }
    applyFiltersAndSort();
  }
