<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pebeto - Endless Videos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: black;
      overflow-x: hidden;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      height: 100vh;
    }
    .video-container {
      scroll-snap-align: start;
      position: relative;
      width: 100%;
      height: 100vh;
      background: black;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 80px 20px 30px;
      color: white;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 100;
    }
    .enable-btn {
      background: #ff8c42;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="feed"></div>
<div class="controls">
  <button class="enable-btn" id="enableBtn">▶️ Click to enable autoplay</button>
</div>

<script>
  // WORKING VIDEO LIST (Mozilla CDN - guaranteed to work)
  const VIDEOS = [
    { url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4", title: "Beautiful Flower", creator: "@nature", niche: "Nature" },
    { url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/earth.mp4", title: "Earth from Space", creator: "@space", niche: "Science" },
    { url: "https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/pexels-koolshooters-7324441%20(small).mp4", title: "Dance Moves", creator: "@dancer", niche: "Music" },
    { url: "https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/pexels-mikhail-nilov-7989792%20(small).mp4", title: "Gaming Session", creator: "@gamer", niche: "Gaming" },
    { url: "https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/pexels-tima-miroshnichenko-7991426%20(small).mp4", title: "Workout", creator: "@fitness", niche: "Fitness" },
    { url: "https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/pexels-cottonbro-855663%20(small).mp4", title: "Tech Review", creator: "@tech", niche: "Tech" }
  ];

  let currentVideos = [...VIDEOS];
  let currentIndex = 0;
  let autoplayEnabled = false;

  const feed = document.getElementById('feed');
  const enableBtn = document.getElementById('enableBtn');

  function createVideoElement(video, index) {
    const container = document.createElement('div');
    container.className = 'video-container';
    container.innerHTML = `
      <video muted playsinline loop preload="auto">
        <source src="${video.url}" type="video/mp4">
      </video>
      <div class="overlay">
        <h3>${video.title}</h3>
        <p>${video.creator} • ${video.niche}</p>
      </div>
    `;
    return container;
  }

  function loadVideos() {
    feed.innerHTML = '';
    currentVideos.forEach((video, i) => {
      feed.appendChild(createVideoElement(video, i));
    });
  }

  function playVisibleVideos() {
    const videos = document.querySelectorAll('.video-container video');
    const windowHeight = window.innerHeight;
    
    videos.forEach((video, i) => {
      const rect = video.closest('.video-container').getBoundingClientRect();
      const isVisible = rect.top < windowHeight - 100 && rect.bottom > 100;
      
      if (isVisible && autoplayEnabled) {
        video.play().catch(e => console.log('play error:', e));
      } else if (!isVisible) {
        video.pause();
      }
    });
  }

  function enableAutoplay() {
    autoplayEnabled = true;
    enableBtn.style.display = 'none';
    playVisibleVideos();
    showToast('✅ Autoplay enabled! Scroll for endless videos.');
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.position = 'fixed';
    toast.style.bottom = '80px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.backgroundColor = 'rgba(0,0,0,0.9)';
    toast.style.color = 'white';
    toast.style.padding = '10px 20px';
    toast.style.borderRadius = '40px';
    toast.style.zIndex = '1000';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // Infinite scroll
  function addMoreVideos() {
    const newVideos = [...VIDEOS].reverse();
    currentVideos.push(...newVideos);
    newVideos.forEach(video => {
      feed.appendChild(createVideoElement(video, currentVideos.length));
    });
  }

  window.addEventListener('scroll', () => {
    playVisibleVideos();
    
    if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 500) {
      addMoreVideos();
    }
  });

  window.addEventListener('resize', playVisibleVideos);
  
  enableBtn.addEventListener('click', enableAutoplay);
  
  // Try to play immediately (may fail, but button will enable)
  loadVideos();
  setTimeout(() => {
    if (!autoplayEnabled) {
      showToast('⚠️ Tap the orange button to start videos');
    }
  }, 500);
</script>
</body>
</html>
