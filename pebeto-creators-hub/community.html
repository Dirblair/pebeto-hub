<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Community - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 70px;
    }
    body.light-theme {
      background: #f5f5f5;
      color: #1a1a1a;
    }
    body.light-theme .creator-card,
    body.light-theme .modal-content,
    body.light-theme .notification-dropdown,
    body.light-theme .filter-sort-bar {
      background: #ffffff;
      border-color: #e0e0e0;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,140,66,0.2);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }
    body.light-theme .header { background: rgba(255,255,255,0.95); border-bottom-color: rgba(255,140,66,0.3); }
    .logo { font-size: 24px; font-weight: 800; color: #ff8c42; cursor: pointer; }
    .search-bar {
      background: rgba(255,255,255,0.1); border-radius: 40px;
      padding: 8px 16px; display: flex; align-items: center; gap: 8px; width: 300px;
      position: relative;
    }
    .search-history-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1510;
      border-radius: 16px;
      margin-top: 8px;
      z-index: 101;
      display: none;
    }
    .search-history-dropdown.show { display: block; }
    .search-history-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .search-history-item:hover { background: rgba(255,140,66,0.1); }
    .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; }
    .nav-icons { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .dashboard-btn, .logout-btn {
      background: rgba(255,140,66,0.15); border: 1px solid #ff8c42;
      padding: 8px 16px; border-radius: 40px; color: #ffaa77;
      cursor: pointer; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .dashboard-btn:hover, .logout-btn:hover { background: #ff8c42; color: white; }
    .theme-toggle {
      background: rgba(255,255,255,0.1); border: none;
      padding: 8px 12px; border-radius: 40px; color: #ffaa77;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; gap: 6px;
    }
    .notification-bell {
      position: relative;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 40px;
    }
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #f44336;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      width: 320px;
      background: #1a1510;
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 16px;
      z-index: 200;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }
    .notification-dropdown.show { display: block; }
    .notification-item {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }
    .notification-item:hover { background: rgba(255,140,66,0.1); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; background-size: cover;
    }
    .feed-container { 
      margin-top: 80px; 
      padding: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .feed-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 50px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .feed-tab {
      flex: 1;
      padding: 10px;
      border-radius: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .feed-tab.active {
      background: #ff8c42;
      color: white;
    }
    .filter-sort-bar {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 60px;
      padding: 10px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: #ff8c42;
      color: white;
      border-color: #ff8c42;
    }
    .sort-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }
    .creator-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 24px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: transform 0.2s, opacity 0.3s;
    }
    .creator-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,140,66,0.4);
    }
    .creator-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }
    .creator-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background-size: cover;
      position: relative;
      cursor: pointer;
    }
    .online-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #4ade80;
      border-radius: 50%;
      border: 2px solid #0a0a0a;
    }
    .live-badge {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .verified-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #1da1f2;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 2px solid #0a0a0a;
    }
    .creator-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .creator-info p { font-size: 13px; color: #a08070; }
    .creator-niche {
      display: inline-block;
      background: rgba(255,140,66,0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 6px;
    }
    .follow-btn, .save-creator-btn, .not-interested-btn {
      margin-left: auto;
      background: rgba(255,140,66,0.15);
      border: 1px solid #ff8c42;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .follow-btn.following, .save-creator-btn.saved {
      background: #ff8c42;
      color: white;
    }
    .not-interested-btn {
      background: rgba(100,100,100,0.3);
      border-color: #666;
      color: #ccc;
    }
    .not-interested-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }
    .video-embed-container { padding: 20px; background: #000; position: relative; }
    .video-controls {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .video-control-btn {
      background: rgba(0,0,0,0.7);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .video-control-btn:hover { background: #ff8c42; }
    .view-count-badge {
      position: absolute;
      bottom: 40px;
      left: 40px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.3);
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ff8c42;
      transition: width 0.3s;
    }
    .skeleton-card {
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .youtube-embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .youtube-embed-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* TikTok Play Button Overlay */
    .tiktok-player-container {
      position: relative;
      background: #000;
      min-height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tiktok-play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      cursor: pointer;
      z-index: 20;
      transition: opacity 0.3s;
    }
    .tiktok-play-overlay:hover {
      background: rgba(0,0,0,0.5);
    }
    .tiktok-play-btn {
      width: 70px;
      height: 70px;
      background: #ff8c42;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: transform 0.2s;
    }
    .tiktok-play-overlay:hover .tiktok-play-btn {
      transform: scale(1.1);
    }
    .tiktok-message {
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.7);
      padding: 8px 16px;
      border-radius: 40px;
    }
    .tiktok-iframe {
      width: 100%;
      min-height: 550px;
      border: none;
      display: none;
    }
    .tiktok-iframe.loaded {
      display: block;
    }
    
    .creator-actions {
      display: flex;
      gap: 12px;
      padding: 15px 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }
    .action-btn, .tip-btn, .profile-btn, .share-btn, .report-btn, .dm-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .action-btn:hover, .profile-btn:hover, .share-btn:hover, .dm-btn:hover { background: rgba(255,255,255,0.15); }
    .action-btn.liked { background: rgba(255,0,80,0.2); border-color: #ff0050; color: #ff0050; }
    .tip-btn { background: rgba(255,140,66,0.2); border: 1px solid #ff8c42; color: #ffaa77; }
    .tip-btn:hover { background: #ff8c42; color: white; }
    .report-btn { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #ef4444; }
    .report-btn:hover { background: #ef4444; color: white; }
    .dm-btn { background: rgba(59,130,246,0.15); border-color: #3b82f6; color: #3b82f6; }
    .dm-btn:hover { background: #3b82f6; color: white; }
    .like-animation {
      position: fixed;
      pointer-events: none;
      font-size: 40px;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 1000;
    }
    @keyframes floatUp {
      0% { transform: scale(0.5); opacity: 1; bottom: 50%; left: 50%; }
      100% { transform: scale(1.5); opacity: 0; bottom: 70%; left: 55%; }
    }
    .loading-spinner { text-align: center; padding: 50px; color: #ff8c42; }
    .infinite-scroll-trigger { height: 20px; margin: 20px 0; text-align: center; color: #a08070; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1510;
      border-radius: 28px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      border: 1px solid rgba(255,140,66,0.3);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 20px; color: #ff8c42; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 12px;
      border-radius: 30px;
      margin-bottom: 15px;
      color: white;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; border: none; cursor: pointer; }
    .save-btn { background: #ff8c42; color: white; }
    .cancel-btn { background: rgba(255,255,255,0.1); color: white; }
    .comments-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
    .comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
    .comment-actions {
      position: absolute;
      right: 0;
      top: 10px;
      display: flex;
      gap: 8px;
    }
    .comment-actions button {
      background: none;
      border: none;
      color: #a08070;
      cursor: pointer;
      font-size: 12px;
    }
    .reply-form {
      margin-left: 40px;
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .reply-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: none;
      padding: 8px;
      border-radius: 20px;
      color: white;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,140,66,0.2);
      display: flex;
      justify-content: space-around;
      padding: 10px 20px;
      z-index: 99;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #a08070;
      transition: color 0.2s;
    }
    .bottom-nav-item.active, .bottom-nav-item:hover { color: #ff8c42; }
    .bottom-nav-item i { font-size: 22px; }
    .bottom-nav-item span { font-size: 10px; }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1510;
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 12px;
      padding: 12px 24px;
      z-index: 2001;
      animation: slideUp 0.3s ease;
      white-space: nowrap;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100%); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    .suggested-niches {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255,140,66,0.1);
      border-radius: 60px;
      justify-content: center;
    }
    .niche-badge {
      background: rgba(255,140,66,0.2);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
    }
    @media (max-width: 768px) {
      .search-bar { display: none; }
      .feed-container { padding: 15px; padding-bottom: 80px; }
      .creator-actions { justify-content: center; }
      .filter-sort-bar { flex-direction: column; align-items: stretch; border-radius: 20px; }
      .filter-group { justify-content: center; }
      .filter-chip { font-size: 11px; padding: 4px 12px; }
      .toast { white-space: normal; max-width: 90%; text-align: center; }
    }
    @media (prefers-contrast: high) {
      .creator-card { border: 2px solid #ff8c42; }
      .action-btn, .tip-btn { border: 2px solid; }
    }
    .keyboard-focus:focus-visible {
      outline: 2px solid #ff8c42;
      outline-offset: 2px;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div class="header">
  <div class="logo" onclick="window.location.href='/community.html'">Pebeto</div>
  <div class="search-bar">
    <i class="ri-search-line"></i>
    <input type="text" id="global-search" placeholder="Search creators..." onkeyup="debouncedSearch()" onfocus="showSearchHistory()">
    <div id="search-history-dropdown" class="search-history-dropdown"></div>
  </div>
  <div class="nav-icons">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"><i class="ri-sun-line"></i></button>
    <div class="notification-bell" onclick="toggleNotifications()" aria-label="Notifications">
      <i class="ri-notification-3-line"></i>
      <span id="notification-badge" class="notification-badge" style="display: none;">0</span>
      <div id="notification-dropdown" class="notification-dropdown"></div>
    </div>
    <button class="dashboard-btn" onclick="goToDashboard()"><i class="ri-dashboard-line"></i> Dashboard</button>
    <button class="logout-btn" onclick="logout()"><i class="ri-logout-box-r-line"></i> Logout</button>
    <div class="avatar" id="nav-avatar" onclick="goToDashboard()" role="button" aria-label="Profile">U</div>
  </div>
</div>

<div class="feed-container">
  <div id="suggested-niches-container" class="suggested-niches"></div>
  <div class="feed-tabs">
    <div class="feed-tab active" data-feed="foryou" onclick="switchFeedTab('foryou')">For You</div>
    <div class="feed-tab" data-feed="following" onclick="switchFeedTab('following')">Following</div>
    <div class="feed-tab" data-feed="saved" onclick="switchFeedTab('saved')">Saved</div>
    <div class="feed-tab" data-feed="trending" onclick="switchFeedTab('trending')">🔥 Trending</div>
  </div>

  <div class="filter-sort-bar">
    <div class="filter-group">
      <span class="filter-chip active" data-niche="all" onclick="filterByNiche('all')">All</span>
      <span class="filter-chip" data-niche="Music" onclick="filterByNiche('Music')">🎵 Music</span>
      <span class="filter-chip" data-niche="Art" onclick="filterByNiche('Art')">🎨 Art</span>
      <span class="filter-chip" data-niche="Fitness" onclick="filterByNiche('Fitness')">💪 Fitness</span>
      <span class="filter-chip" data-niche="Gaming" onclick="filterByNiche('Gaming')">🎮 Gaming</span>
      <span class="filter-chip" data-niche="Tech" onclick="filterByNiche('Tech')">💻 Tech</span>
    </div>
    <select class="sort-select" id="sort-select" onchange="sortCreators()">
      <option value="likes">🔥 Most Liked</option>
      <option value="newest">🕐 Newest First</option>
      <option value="oldest">📅 Oldest First</option>
      <option value="name">📝 Name A-Z</option>
      <option value="engagement">⭐ Engagement Rate</option>
    </select>
  </div>

  <div id="feed-content"></div>
  <div id="infinite-scroll-trigger" class="infinite-scroll-trigger"></div>
</div>

<div class="bottom-nav">
  <div class="bottom-nav-item active" data-nav="foryou" onclick="switchFeedTab('foryou')"><i class="ri-home-5-line"></i><span>Home</span></div>
  <div class="bottom-nav-item" data-nav="trending" onclick="switchFeedTab('trending')"><i class="ri-fire-line"></i><span>Trending</span></div>
  <div class="bottom-nav-item" data-nav="notifications" onclick="toggleNotifications()"><i class="ri-notification-3-line"></i><span>Alerts</span></div>
  <div class="bottom-nav-item" data-nav="profile" onclick="goToDashboard()"><i class="ri-user-line"></i><span>Profile</span></div>
</div>

<!-- Modals -->

<script>
  // ==================== CORE VARIABLES ====================
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';
  let currentUser = null, allCreators = [], filteredCreators = [], currentOffset = 0, PAGE_SIZE = 10;
  let currentFeedTab = 'foryou', currentNicheFilter = 'all', currentSort = 'likes', currentSearchQuery = '';
  let notifications = [], following = new Set(), savedCreators = new Set(), blockedCreators = new Set(), mutedCreators = new Set();
  let searchHistory = [], userWalletBalance = 0;
  let pendingLike = false, pendingComment = false, pendingTip = false;
  let currentCommentCreatorId = null, currentTipCreatorId = null, selectedPaymentSource = 'wallet';
  let currentShareCreatorId = null, currentReportCreatorId = null, currentDMRecipientId = null;
  let isLoading = false, hasMore = true, debounceTimer = null, autoRefreshInterval = null;
  let currentlyPlayingVideo = null, videoObserver = null, ytPlayers = {};
  
  // ==================== PERSONALIZATION ====================
  let userInterests = JSON.parse(localStorage.getItem('pebeto_interests')) || {
    Music: 0, Art: 0, Fitness: 0, Gaming: 0, Tech: 0, Food: 0, Travel: 0, Education: 0
  };
  let watchHistory = JSON.parse(localStorage.getItem('pebeto_watch_history')) || [];
  let notInterestedCreators = new Set(JSON.parse(localStorage.getItem('pebeto_not_interested') || '[]'));

  function recordInterest(niche, weight = 1) {
    if (!niche || niche === 'Creator') return;
    if (userInterests[niche] !== undefined) {
      userInterests[niche] = Math.min(1000, userInterests[niche] + weight);
      localStorage.setItem('pebeto_interests', JSON.stringify(userInterests));
      updateSuggestedNiches();
      if (currentFeedTab === 'foryou') applyFiltersAndSort();
    }
  }

  function recordWatchTime(creatorId, niche, secondsWatched) {
    if (secondsWatched < 3) return;
    watchHistory.unshift({ creatorId, niche, timestamp: Date.now(), duration: secondsWatched });
    if (watchHistory.length > 200) watchHistory.pop();
    localStorage.setItem('pebeto_watch_history', JSON.stringify(watchHistory));
    let weight = Math.min(5, Math.floor(secondsWatched / 10));
    recordInterest(niche, weight);
  }

  function markNotInterested(creatorId, creatorName, niche) {
    if (notInterestedCreators.has(creatorId)) return;
    notInterestedCreators.add(creatorId);
    localStorage.setItem('pebeto_not_interested', JSON.stringify([...notInterestedCreators]));
    if (niche) recordInterest(niche, -3);
    showToast(`✅ You won't see ${creatorName} again.`);
    applyFiltersAndSort();
  }

  function getTopNiches(count = 5) {
    return Object.entries(userInterests).filter(([_, score]) => score > 0).sort((a, b) => b[1] - a[1]).slice(0, count).map(([niche]) => niche);
  }

  function personalizeFeed(creators) {
    const topNiches = getTopNiches(5);
    if (topNiches.length === 0 || currentFeedTab !== 'foryou') return creators;
    const prioritized = [
      ...creators.filter(c => topNiches.includes(c.profile?.niche) && !notInterestedCreators.has(c._id)),
      ...creators.filter(c => !topNiches.includes(c.profile?.niche) && !notInterestedCreators.has(c._id))
    ];
    return prioritized;
  }

  function updateSuggestedNiches() {
    const container = document.getElementById('suggested-niches-container');
    if (!container) return;
    const top = getTopNiches(5);
    if (top.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = `<span style="opacity:0.7;">🎯 For you:</span> ${top.map(n => `<span class="niche-badge">${n}</span>`).join('')}`;
  }

  // ==================== TIKTOK CLICK-TO-PLAY (WORKING) ====================
  function loadTikTokVideo(container, tiktokUrl, creatorId) {
    const overlay = container.querySelector('.tiktok-play-overlay');
    const iframe = container.querySelector('.tiktok-iframe');
    const playerContainer = container.querySelector('.tiktok-player-container');
    
    if (overlay) overlay.style.display = 'none';
    if (iframe) {
      iframe.src = tiktokUrl;
      iframe.classList.add('loaded');
    }
    
    // Record watch time start
    const startTime = Date.now();
    const checkInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      if (elapsed >= 10) {
        const creator = allCreators.find(c => c._id === creatorId);
        if (creator) recordWatchTime(creatorId, creator.profile?.niche, elapsed);
        clearInterval(checkInterval);
      }
    }, 10000);
    
    showToast('▶️ TikTok video playing - tap video for sound');
  }

  function createTikTokPlayer(tiktokUrl, creatorId, viewCount) {
    // Extract video ID for better embed
    const videoIdMatch = tiktokUrl.match(/video\/(\d+)/);
    let embedUrl = tiktokUrl;
    if (videoIdMatch) {
      embedUrl = `https://www.tiktok.com/embed/v2/${videoIdMatch[1]}`;
    }
    
    return `
      <div class="tiktok-player-container">
        <div class="tiktok-play-overlay" onclick="loadTikTokVideo(this.parentElement.parentElement, '${embedUrl}', '${creatorId}')">
          <div class="tiktok-play-btn">
            <i class="ri-play-fill"></i>
          </div>
          <div class="tiktok-message">
            <i class="ri-tiktok-fill"></i> Tap to play TikTok video
          </div>
        </div>
        <iframe class="tiktok-iframe" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    `;
  }

  // ==================== YOUTUBE AUTOPLAY ====================
  function onYouTubeIframeAPIReady() {
    document.querySelectorAll('.youtube-embed-container iframe').forEach((iframe, idx) => {
      const id = iframe.id || `yt-player-${idx}`;
      iframe.id = id;
      if (typeof YT !== 'undefined' && YT.Player) {
        ytPlayers[id] = new YT.Player(id, {
          events: {
            onReady: (event) => { event.target.mute(); event.target.playVideo(); },
            onStateChange: (event) => { 
              if (event.data === YT.PlayerState.PLAYING) {
                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                  const player = event.target;
                  if (player.getPlayerState() !== YT.PlayerState.PLAYING) { clearInterval(checkInterval); return; }
                  const elapsed = (Date.now() - startTime) / 1000;
                  if (elapsed >= 10) {
                    const container = player.getIframe()?.closest('.video-embed-container');
                    const creatorId = container?.dataset.videoId;
                    const creator = allCreators.find(c => c._id === creatorId);
                    if (creator) recordWatchTime(creatorId, creator.profile?.niche, elapsed);
                    clearInterval(checkInterval);
                  }
                }, 10000);
              }
            }
          }
        });
      }
    });
  }

  // ==================== VIDEO AUTOPLAY FOR YOUTUBE ONLY ====================
  function setupVideoAutoplay() {
    if (videoObserver) videoObserver.disconnect();
    videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const isYouTube = container.querySelector('.youtube-embed-container iframe');
        
        if (entry.isIntersecting) {
          if (currentlyPlayingVideo && currentlyPlayingVideo !== container) {
            const prevIframe = currentlyPlayingVideo.querySelector('iframe');
            if (prevIframe && prevIframe.src.includes('youtube')) {
              prevIframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            }
          }
          currentlyPlayingVideo = container;
          
          if (isYouTube) {
            const iframe = container.querySelector('iframe');
            if (iframe && iframe.src.includes('youtube')) {
              iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            }
          }
        } else {
          if (currentlyPlayingVideo === container && isYouTube) {
            const iframe = container.querySelector('iframe');
            if (iframe && iframe.src.includes('youtube')) {
              iframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            }
            currentlyPlayingVideo = null;
          }
        }
      });
    }, { threshold: 0.5 });
    
    document.querySelectorAll('.video-embed-container').forEach(c => videoObserver.observe(c));
  }

  // ==================== EXISTING FUNCTIONS ====================
  function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function logout() { localStorage.clear(); showToast('Logged out'); setTimeout(() => window.location.href = '/login.html', 500); }
  function escapeHtml(str) { return (str || '').replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  function formatNumber(num) { if (num >= 1000000) return (num/1000000).toFixed(1) + 'M'; if (num >= 1000) return (num/1000).toFixed(1) + 'K'; return num.toString(); }
  function formatTimeAgo(date) { const s = Math.floor((new Date() - new Date(date)) / 1000); if (s < 60) return `${s}s`; if (s < 3600) return `${Math.floor(s/60)}m`; if (s < 86400) return `${Math.floor(s/3600)}h`; return `${Math.floor(s/86400)}d`; }
  function toggleTheme() { document.body.classList.toggle('light-theme'); localStorage.setItem('pebeto_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); }
  function toggleNotifications() { document.getElementById('notification-dropdown').classList.toggle('show'); }
  function addNotification(msg) { notifications.unshift({ message: msg, time: new Date(), read: false }); const unread = notifications.filter(n => !n.read).length; const badge = document.getElementById('notification-badge'); badge.style.display = unread > 0 ? 'flex' : 'none'; badge.innerText = unread > 9 ? '9+' : unread; document.getElementById('notification-dropdown').innerHTML = notifications.slice(0,10).map(n => `<div class="notification-item">${n.message}<br><small>${formatTimeAgo(n.time)}</small></div>`).join(''); }
  async function fetchJSON(url, opts) { const token = localStorage.getItem('pebeto_token'); const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': token ? `Bearer ${token}` : '', ...opts?.headers } }); return res.json(); }
  function goToDashboard() { const token = localStorage.getItem('pebeto_token'); if (!token) { window.location.href = '/login.html'; return; } window.location.href = '/creator-dashboard.html'; }
  function saveSearchHistory(q) { if (!q) return; searchHistory = [q, ...searchHistory.filter(s => s !== q)].slice(0,5); localStorage.setItem('pebeto_search_history', JSON.stringify(searchHistory)); }
  function showSearchHistory() { const h = JSON.parse(localStorage.getItem('pebeto_search_history') || '[]'); const d = document.getElementById('search-history-dropdown'); d.innerHTML = h.map(hh => `<div class="search-history-item" onclick="setSearch('${hh}')">${hh}</div>`).join('') || '<div class="search-history-item">No recent searches</div>'; d.classList.add('show'); setTimeout(() => d.classList.remove('show'), 3000); }
  function setSearch(q) { document.getElementById('global-search').value = q; searchGlobal(); }
  function debouncedSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => searchGlobal(), 300); }
  function switchFeedTab(tab) { currentFeedTab = tab; document.querySelectorAll('.feed-tab').forEach(t => t.classList.remove('active')); document.querySelector(`.feed-tab[data-feed="${tab}"]`).classList.add('active'); currentOffset = 0; applyFiltersAndSort(); }
  function toggleSaveCreator(id, btn) { if (savedCreators.has(id)) { savedCreators.delete(id); btn.innerText = 'Save'; } else { savedCreators.add(id); btn.innerText = 'Saved'; } localStorage.setItem('pebeto_saved_creators', JSON.stringify([...savedCreators])); showToast(savedCreators.has(id) ? 'Saved' : 'Removed'); }
  function loadSavedData() { const s = localStorage.getItem('pebeto_saved_creators'); if(s) savedCreators = new Set(JSON.parse(s)); const b = localStorage.getItem('pebeto_blocked_creators'); if(b) blockedCreators = new Set(JSON.parse(b)); const m = localStorage.getItem('pebeto_muted_creators'); if(m) mutedCreators = new Set(JSON.parse(m)); const f = localStorage.getItem('pebeto_following'); if(f) following = new Set(JSON.parse(f)); }
  function selectPaymentSource(src) { selectedPaymentSource = src; document.getElementById('mpesa-details').style.display = src === 'mpesa' ? 'block' : 'none'; document.getElementById('paypal-details').style.display = src === 'paypal' ? 'block' : 'none'; }
  function validateTipAmount() { const amt = parseFloat(document.getElementById('tip-amount').value) || 0; if (amt < 1 && amt > 0) document.getElementById('tip-amount').value = 1; document.getElementById('creator-receives').innerHTML = (amt * 0.95).toFixed(2); }
  async function loadUserBalance() { try { const token = localStorage.getItem('pebeto_token'); if (!token) return; const data = await fetchJSON(`${API_BASE}/api/wallet/balance`); if (data.success) userWalletBalance = data.data?.balances?.available || 0; } catch(e) {} }
  async function loadCreators() { try { const res = await fetch(`${API_BASE}/api/creators`); const data = await res.json(); if (data.success && data.creators?.length) allCreators = data.creators.filter(c => c.socialLinks && (c.socialLinks.tiktok || c.socialLinks.youtube)); else showSampleCreators(); loadSavedData(); applyFiltersAndSort(); } catch(e) { showSampleCreators(); } }
  function showSampleCreators() { allCreators = [{ _id:'sample1', email:'dj@example.com', profile:{ stageName:'DJ Nova', niche:'Music' }, socialLinks:{ tiktok:'https://www.tiktok.com/@tiktok/video/123456789' }, likeCount:1234, isLiked:false, commentCount:89, verified:true, viewCount:15200, createdAt:'2024-01-15', isOnline:true, engagementRate:5.2, milestones:{ followers:15000 } }, { _id:'sample2', email:'sarah@example.com', profile:{ stageName:'Sarah Creates', niche:'Art' }, socialLinks:{ youtube:'https://www.youtube.com/@YouTube' }, likeCount:567, isLiked:false, commentCount:34, verified:false, viewCount:8900, createdAt:'2024-02-20', engagementRate:3.8 }, { _id:'sample3', email:'mike@example.com', profile:{ stageName:'Mike Fitness', niche:'Fitness' }, socialLinks:{ tiktok:'https://www.tiktok.com/@tiktok/video/987654321' }, likeCount:2345, isLiked:false, commentCount:156, verified:true, viewCount:45000, createdAt:'2024-01-05', isLive:true, engagementRate:7.2 }]; applyFiltersAndSort(); }

  function applyFiltersAndSort() {
    let filtered = [...allCreators].filter(c => !notInterestedCreators.has(c._id) && !blockedCreators.has(c._id));
    if (mutedCreators.size > 0 && currentFeedTab !== 'following') filtered = filtered.filter(c => !mutedCreators.has(c._id));
    if (currentFeedTab === 'following') filtered = filtered.filter(c => following.has(c._id));
    if (currentFeedTab === 'saved') filtered = filtered.filter(c => savedCreators.has(c._id));
    if (currentNicheFilter !== 'all') filtered = filtered.filter(c => c.profile?.niche === currentNicheFilter);
    if (currentSearchQuery) filtered = filtered.filter(c => c.profile?.stageName?.toLowerCase().includes(currentSearchQuery) || c.profile?.niche?.toLowerCase().includes(currentSearchQuery));
    if (currentSort === 'likes') filtered.sort((a,b) => (b.likeCount||0) - (a.likeCount||0));
    else if (currentSort === 'name') filtered.sort((a,b) => (a.profile?.stageName||'').localeCompare(b.profile?.stageName||''));
    else if (currentSort === 'engagement') filtered.sort((a,b) => (b.engagementRate||0) - (a.engagementRate||0));
    else filtered.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
    filtered = personalizeFeed(filtered);
    filteredCreators = filtered;
    currentOffset = 0;
    renderFeed();
    updateSuggestedNiches();
  }

  function renderFeed() {
    const container = document.getElementById('feed-content');
    const toRender = filteredCreators.slice(0, PAGE_SIZE);
    currentOffset = PAGE_SIZE;
    container.innerHTML = '';
    toRender.forEach(creator => container.appendChild(createCreatorCard(creator)));
    hasMore = filteredCreators.length > PAGE_SIZE;
    setTimeout(() => {
      setupVideoAutoplay();
      if (typeof YT !== 'undefined' && YT.loaded) onYouTubeIframeAPIReady();
    }, 300);
  }

  function createCreatorCard(creator) {
    const card = document.createElement('div'); card.className = 'creator-card'; card.dataset.creatorId = creator._id;
    const initial = (creator.profile?.stageName?.[0] || 'C').toUpperCase();
    const displayName = creator.profile?.stageName || 'Creator';
    const niche = creator.profile?.niche || 'Creator';
    const isFollowing = following.has(creator._id);
    const isSaved = savedCreators.has(creator._id);
    
    let embedHtml = '';
    if (creator.socialLinks?.tiktok) {
      embedHtml = `<div class="video-embed-container" data-video-id="${creator._id}">
        <div class="view-count-badge"><i class="ri-eye-line"></i> ${formatNumber(creator.viewCount||0)} views</div>
        <div class="video-controls">
          <button class="video-control-btn" onclick="toggleFullscreen(this)"><i class="ri-fullscreen-line"></i></button>
        </div>
        <div class="progress-bar-container"><div class="progress-bar-fill"></div></div>
        ${createTikTokPlayer(creator.socialLinks.tiktok, creator._id, creator.viewCount)}
      </div>`;
    } else if (creator.socialLinks?.youtube) {
      let youtubeEmbedUrl = creator.socialLinks.youtube.includes('/@') ? `https://www.youtube.com/embed?listType=user_uploads&list=${creator.socialLinks.youtube.split('/@')[1]}&autoplay=0&mute=1&playsinline=1` : `https://www.youtube.com/embed?listType=user_uploads&list=${encodeURIComponent(creator.socialLinks.youtube)}&autoplay=0&mute=1&playsinline=1`;
      embedHtml = `<div class="video-embed-container" data-video-id="${creator._id}">
        <div class="view-count-badge"><i class="ri-eye-line"></i> ${formatNumber(creator.viewCount||0)} views</div>
        <div class="video-controls">
          <button class="video-control-btn" onclick="toggleFullscreen(this)"><i class="ri-fullscreen-line"></i></button>
        </div>
        <div class="progress-bar-container"><div class="progress-bar-fill"></div></div>
        <div class="youtube-embed-container"><iframe id="yt-${creator._id}" src="${youtubeEmbedUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
      </div>`;
    } else embedHtml = `<div class="video-embed-container"><p style="color:#a08070;text-align:center;padding:40px;">No videos</p></div>`;
    
    card.innerHTML = `
      <div class="creator-header">
        <div class="creator-avatar" onclick="viewCreatorProfile('${creator._id}')">${initial}</div>
        <div class="creator-info"><h3>${escapeHtml(displayName)}</h3><span class="creator-niche">${escapeHtml(niche)}</span></div>
        <div style="display:flex;flex-direction:column;gap:5px;">
          <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${creator._id}', this)">${isFollowing ? 'Following' : 'Follow'}</button>
          <button class="save-creator-btn ${isSaved ? 'saved' : ''}" onclick="toggleSaveCreator('${creator._id}', this)">${isSaved ? 'Saved' : 'Save'}</button>
          <button class="not-interested-btn" onclick="markNotInterested('${creator._id}', '${escapeHtml(displayName)}', '${escapeHtml(niche)}')">Not Interested</button>
        </div>
      </div>
      ${embedHtml}
      <div class="creator-actions">
        <button class="action-btn like-btn" onclick="toggleLike(event, this, '${creator._id}')"><i class="ri-heart-line"></i><span class="like-count">${formatNumber(creator.likeCount||0)}</span></button>
        <button class="action-btn comment-btn" onclick="openCommentsModal('${creator._id}', '${escapeHtml(displayName)}')"><i class="ri-chat-3-line"></i><span>${formatNumber(creator.commentCount||0)}</span></button>
        <button class="tip-btn" onclick="openTipModal('${creator._id}', '${escapeHtml(displayName)}')"><i class="ri-coin-line"></i> Tip</button>
        <button class="dm-btn" onclick="openDMModal('${creator._id}', '${escapeHtml(displayName)}')"><i class="ri-mail-line"></i> DM</button>
        <button class="share-btn" onclick="openShareModal('${creator._id}', '${escapeHtml(displayName)}')"><i class="ri-share-line"></i> Share</button>
      </div>
    `;
    return card;
  }

  function toggleFullscreen(btn) {
    const container = btn.closest('.video-embed-container');
    if (container?.requestFullscreen) container.requestFullscreen();
  }

  function toggleLike(event, btn, id) { 
    event.stopPropagation(); 
    const creator = allCreators.find(c => c._id === id);
    if (creator && !btn.classList.contains('liked')) recordInterest(creator.profile?.niche, 2);
    btn.classList.toggle('liked'); 
    const icon = btn.querySelector('i');
    if (btn.classList.contains('liked')) icon.classList.replace('ri-heart-line', 'ri-heart-fill');
    else icon.classList.replace('ri-heart-fill', 'ri-heart-line');
    showToast(btn.classList.contains('liked') ? 'Liked!' : 'Unliked');
  }
  async function toggleFollow(id, btn) { if (following.has(id)) following.delete(id); else following.add(id); btn.innerText = following.has(id) ? 'Following' : 'Follow'; btn.classList.toggle('following'); localStorage.setItem('pebeto_following', JSON.stringify([...following])); showToast(following.has(id) ? 'Following' : 'Unfollowed'); if (currentFeedTab === 'following') applyFiltersAndSort(); }
  function filterByNiche(niche) { currentNicheFilter = niche; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); document.querySelector(`.filter-chip[data-niche="${niche}"]`).classList.add('active'); applyFiltersAndSort(); }
  function sortCreators() { currentSort = document.getElementById('sort-select').value; applyFiltersAndSort(); }
  function searchGlobal() { currentSearchQuery = document.getElementById('global-search').value.toLowerCase(); if (currentSearchQuery) { saveSearchHistory(currentSearchQuery); const kwMap = { music:'Music', art:'Art', fitness:'Fitness', gaming:'Gaming', tech:'Tech' }; for (let [kw, niche] of Object.entries(kwMap)) if (currentSearchQuery.includes(kw)) { recordInterest(niche, 1); break; } } applyFiltersAndSort(); }
  function openCommentsModal(id, name) { showToast('Comments modal - backend required'); }
  function openTipModal(id, name) { currentTipCreatorId = id; document.getElementById('tip-modal').style.display = 'flex'; }
  async function sendTip() { showToast('Tip sent!'); closeModal('tip-modal'); }
  function openDMModal(id, name) { showToast('DM feature - backend required'); }
  function openShareModal(id, name) { currentShareCreatorId = id; document.getElementById('share-modal').style.display = 'flex'; }
  function shareTo(platform) { showToast(`Shared to ${platform}`); closeModal('share-modal'); }
  function shareNative() { if(navigator.share) navigator.share({title:'Pebeto', text:'Check this out!'}); else showToast('Share not supported'); }
  function copyShareLink() { navigator.clipboard.writeText(window.location.href); showToast('Link copied!'); closeModal('share-modal'); }
  function showQRCode() { showToast('QR code feature'); }
  function submitReport() { showToast('Report submitted'); closeModal('report-modal'); }
  function viewCreatorProfile(id) { showToast('Profile view - coming soon'); }
  function loadUserData() { const userStr = localStorage.getItem('pebeto_user'); if(userStr) try { currentUser = JSON.parse(userStr); document.getElementById('nav-avatar').innerHTML = (currentUser.profile?.stageName?.[0] || currentUser.email[0] || 'U').toUpperCase(); } catch(e){} }
  function startAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); autoRefreshInterval = setInterval(() => { if (document.visibilityState === 'visible') loadCreators(); }, 30000); }
  function addComment() { showToast('Comment feature - backend required'); }
  function saveEditedComment() { closeModal('edit-comment-modal'); showToast('Comment updated'); }
  function deleteComment(id) { showToast('Comment deleted'); }

  // ==================== INITIALIZATION ====================
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
  const savedTheme = localStorage.getItem('pebeto_theme');
  if (savedTheme === 'light') document.body.classList.add('light-theme');
  loadUserData(); loadCreators(); loadUserBalance(); startAutoRefresh();
  addNotification('Welcome to Pebeto!');
  updateSuggestedNiches();
</script>
</body>
