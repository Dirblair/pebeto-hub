<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pebeto - Endless Videos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      height: 100vh;
    }
    
    /* Hide scrollbar but keep functionality */
    body::-webkit-scrollbar {
      display: none;
    }
    
    /* Video container - full screen snap */
    .video-container {
      scroll-snap-align: start;
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    /* HTML5 Video - guaranteed autoplay */
    .video-container video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Overlay controls */
    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 80px 20px 30px;
      z-index: 10;
    }
    
    .creator-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    
    .creator-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }
    
    .creator-name {
      font-size: 16px;
      font-weight: 600;
    }
    
    .creator-niche {
      font-size: 12px;
      opacity: 0.7;
    }
    
    .video-title {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    
    /* Action buttons - right side */
    .action-buttons {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }
    
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .action-btn:hover {
      transform: scale(1.1);
    }
    
    .action-btn i {
      font-size: 28px;
    }
    
    .action-btn span {
      font-size: 11px;
    }
    
    .like-btn.liked {
      color: #ff0050;
    }
    
    .follow-btn.following {
      color: #ff8c42;
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      padding: 12px 20px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #ff8c42;
      pointer-events: auto;
      cursor: pointer;
    }
    
    .header-icons {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    
    .header-icons i {
      font-size: 22px;
      cursor: pointer;
    }
    
    /* Suggestions bar */
    .suggestions-bar {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      overflow-x: auto;
      z-index: 45;
      background: transparent;
      white-space: nowrap;
      pointer-events: auto;
    }
    
    .suggestions-bar::-webkit-scrollbar {
      display: none;
    }
    
    .niche-chip {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .niche-chip.active,
    .niche-chip:hover {
      background: #ff8c42;
      color: white;
    }
    
    /* Loading indicator */
    .loading {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 100;
      font-size: 14px;
    }
    
    /* Toast message */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 200;
      animation: fadeUp 0.3s ease;
      white-space: nowrap;
    }
    
    @keyframes fadeUp {
      from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="location.reload()">Pebeto</div>
  <div class="header-icons">
    <i class="ri-search-line" onclick="alert('🔍 Search coming soon')"></i>
    <i class="ri-user-line" onclick="alert('👤 Profile')"></i>
  </div>
</div>

<div class="suggestions-bar" id="suggestionsBar">
  <span class="niche-chip active" data-niche="all" onclick="filterByNiche('all')">✨ For You</span>
  <span class="niche-chip" data-niche="Nature" onclick="filterByNiche('Nature')">🌿 Nature</span>
  <span class="niche-chip" data-niche="Tech" onclick="filterByNiche('Tech')">💻 Tech</span>
  <span class="niche-chip" data-niche="Music" onclick="filterByNiche('Music')">🎵 Music</span>
  <span class="niche-chip" data-niche="Gaming" onclick="filterByNiche('Gaming')">🎮 Gaming</span>
  <span class="niche-chip" data-niche="Art" onclick="filterByNiche('Art')">🎨 Art</span>
  <span class="niche-chip" data-niche="Fitness" onclick="filterByNiche('Fitness')">💪 Fitness</span>
</div>

<div id="videoFeed" class="video-feed"></div>

<div id="loadingIndicator" class="loading" style="display: none;">⬇️ Loading more videos...</div>

<script>
  // ==================== VIDEO LIBRARY WITH ACTUAL WORKING VIDEOS ====================
  // These are public sample videos that support autoplay
  // Using videos from sample-videos.com (reliable, always available)
  
  const VIDEO_LIBRARY = {
    Nature: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', title: 'Beautiful Mountains', creator: 'NatureLover', avatar: 'NL', niche: 'Nature', duration: 15 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', title: 'Ocean Waves', creator: 'BeachLife', avatar: 'BL', niche: 'Nature', duration: 15 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4', title: 'Forest Walk', creator: 'WildExplorer', avatar: 'WE', niche: 'Nature', duration: 15 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', title: 'Sunset View', creator: 'GoldenHour', avatar: 'GH', niche: 'Nature', duration: 15 }
    ],
    Tech: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCar.mp4', title: 'Future Tech', creator: 'TechGuru', avatar: 'TG', niche: 'Tech', duration: 12 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', title: 'AI Revolution', creator: 'CodeMaster', avatar: 'CM', niche: 'Tech', duration: 12 }
    ],
    Music: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4', title: 'Vibes Only', creator: 'DJ Pulse', avatar: 'DP', niche: 'Music', duration: 15 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4', title: 'Live Session', creator: 'BandNight', avatar: 'BN', niche: 'Music', duration: 14 }
    ],
    Gaming: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4', title: 'Epic Win!', creator: 'ProGamer', avatar: 'PG', niche: 'Gaming', duration: 15 },
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', title: 'Boss Fight', creator: 'GameMaster', avatar: 'GM', niche: 'Gaming', duration: 15 }
    ],
    Art: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4', title: 'Digital Painting', creator: 'Artist', avatar: 'AR', niche: 'Art', duration: 15 }
    ],
    Fitness: [
      { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', title: 'Workout Routine', creator: 'FitCoach', avatar: 'FC', niche: 'Fitness', duration: 15 }
    ]
  };

  // Flatten all videos
  let allVideos = [];
  for (let niche in VIDEO_LIBRARY) {
    allVideos.push(...VIDEO_LIBRARY[niche].map(v => ({ 
      ...v, 
      uniqueId: v.url + Date.now() + Math.random() + Math.random()
    })));
  }

  let filteredVideos = [];
  let currentOffset = 0;
  let PAGE_SIZE = 5;
  let currentNiche = 'all';
  let isLoading = false;
  let hasMore = true;
  let currentPlayingVideo = null;
  
  // User preferences
  let userInterests = JSON.parse(localStorage.getItem('pebeto_interests')) || {
    Nature: 5, Tech: 3, Music: 4, Gaming: 2, Art: 1, Fitness: 1
  };
  let likedVideos = new Set(JSON.parse(localStorage.getItem('pebeto_liked_videos') || '[]'));
  let following = new Set(JSON.parse(localStorage.getItem('pebeto_following_creators') || '[]'));

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  function recordInterest(niche, weight = 1) {
    if (!niche || niche === 'all') return;
    if (userInterests[niche] !== undefined) {
      userInterests[niche] = Math.min(100, userInterests[niche] + weight);
      localStorage.setItem('pebeto_interests', JSON.stringify(userInterests));
    }
  }

  function getPersonalizedVideos() {
    let videos = [...allVideos];
    
    if (currentNiche !== 'all') {
      videos = videos.filter(v => v.niche === currentNiche);
    }
    
    // Sort by interest score
    if (currentNiche === 'all') {
      videos.sort((a, b) => {
        const scoreA = userInterests[a.niche] || 0;
        const scoreB = userInterests[b.niche] || 0;
        return scoreB - scoreA;
      });
    }
    
    return videos;
  }

  function applyFilters() {
    filteredVideos = getPersonalizedVideos();
    currentOffset = 0;
    hasMore = true;
    const container = document.getElementById('videoFeed');
    if (container) container.innerHTML = '';
    loadMoreVideos();
  }

  function loadMoreVideos() {
    if (isLoading || !hasMore) return;
    isLoading = true;
    
    const loadingDiv = document.getElementById('loadingIndicator');
    if (loadingDiv) loadingDiv.style.display = 'block';
    
    setTimeout(() => {
      const start = currentOffset;
      const end = currentOffset + PAGE_SIZE;
      const newVideos = filteredVideos.slice(start, end);
      
      if (newVideos.length === 0) {
        hasMore = false;
        if (loadingDiv) loadingDiv.style.display = 'none';
        isLoading = false;
        return;
      }
      
      currentOffset = end;
      appendVideos(newVideos);
      
      if (loadingDiv) loadingDiv.style.display = 'none';
      isLoading = false;
      hasMore = end < filteredVideos.length;
    }, 100);
  }

  function appendVideos(videos) {
    const container = document.getElementById('videoFeed');
    videos.forEach((video) => {
      const videoElement = createVideoElement(video);
      container.appendChild(videoElement);
    });
    
    setTimeout(setupVideoAutoplay, 200);
  }

  function createVideoElement(video) {
    const isLiked = likedVideos.has(video.uniqueId);
    const isFollowing = following.has(video.creator);
    
    const div = document.createElement('div');
    div.className = 'video-container';
    div.setAttribute('data-video-id', video.uniqueId);
    div.setAttribute('data-niche', video.niche);
    div.setAttribute('data-creator', video.creator);
    div.setAttribute('data-url', video.url);
    
    div.innerHTML = `
      <video
        src="${video.url}"
        autoplay
        muted
        playsinline
        loop
        preload="auto"
        poster=""
      ></video>
      <div class="action-buttons">
        <div class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${video.uniqueId}', '${video.niche}', this)">
          <i class="${isLiked ? 'ri-heart-fill' : 'ri-heart-line'}"></i>
          <span>${isLiked ? 'Liked' : 'Like'}</span>
        </div>
        <div class="action-btn follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${video.creator}', this)">
          <i class="${isFollowing ? 'ri-user-unfollow-line' : 'ri-user-add-line'}"></i>
          <span>${isFollowing ? 'Following' : 'Follow'}</span>
        </div>
        <div class="action-btn" onclick="shareVideo('${video.url}')">
          <i class="ri-share-line"></i>
          <span>Share</span>
        </div>
      </div>
      <div class="video-overlay">
        <div class="creator-info">
          <div class="creator-avatar">${video.avatar}</div>
          <div>
            <div class="creator-name">@${video.creator}</div>
            <div class="creator-niche">${video.niche} · ${video.duration}s</div>
          </div>
        </div>
        <div class="video-title">${video.title}</div>
      </div>
    `;
    
    return div;
  }

  function setupVideoAutoplay() {
    const videos = document.querySelectorAll('.video-container video');
    
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        const container = video.closest('.video-container');
        const niche = container?.dataset.niche;
        
        if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
          // Video is visible - play it
          video.play().catch(e => console.log('Play error:', e));
          
          if (currentPlayingVideo && currentPlayingVideo !== video) {
            currentPlayingVideo.pause();
          }
          currentPlayingVideo = video;
          
          // Record watch for personalization (once per video)
          if (niche && !video.dataset.recorded) {
            video.dataset.recorded = 'true';
            recordInterest(niche, 1);
            updateSuggestionsBar();
          }
        } else {
          // Video not visible - pause it
          if (video === currentPlayingVideo) {
            video.pause();
            currentPlayingVideo = null;
          }
        }
      });
    }, { threshold: 0.6 });
    
    videos.forEach(video => {
      observer.observe(video);
      // Ensure autoplay works when page loads
      video.play().catch(e => console.log('Initial play:', e));
    });
  }

  function toggleLike(videoId, niche, btnElement) {
    if (likedVideos.has(videoId)) {
      likedVideos.delete(videoId);
      btnElement.classList.remove('liked');
      btnElement.querySelector('i').className = 'ri-heart-line';
      btnElement.querySelector('span').innerText = 'Like';
      recordInterest(niche, -1);
      showToast('💔 Removed like');
    } else {
      likedVideos.add(videoId);
      btnElement.classList.add('liked');
      btnElement.querySelector('i').className = 'ri-heart-fill';
      btnElement.querySelector('span').innerText = 'Liked';
      recordInterest(niche, 3);
      showToast(`❤️ Liked! More ${niche} content coming`);
    }
    localStorage.setItem('pebeto_liked_videos', JSON.stringify([...likedVideos]));
    updateSuggestionsBar();
  }

  function toggleFollow(creator, btnElement) {
    if (following.has(creator)) {
      following.delete(creator);
      btnElement.classList.remove('following');
      btnElement.querySelector('i').className = 'ri-user-add-line';
      btnElement.querySelector('span').innerText = 'Follow';
      showToast(`Unfollowed ${creator}`);
    } else {
      following.add(creator);
      btnElement.classList.add('following');
      btnElement.querySelector('i').className = 'ri-user-unfollow-line';
      btnElement.querySelector('span').innerText = 'Following';
      showToast(`Following @${creator}`);
      
      const niche = btnElement.closest('.video-container')?.dataset.niche;
      if (niche) recordInterest(niche, 2);
    }
    localStorage.setItem('pebeto_following_creators', JSON.stringify([...following]));
    updateSuggestionsBar();
  }

  function shareVideo(url) {
    if (navigator.share) {
      navigator.share({ title: 'Check this video!', url: url });
    } else {
      navigator.clipboard.writeText(url);
      showToast('📋 Link copied to clipboard!');
    }
  }

  function filterByNiche(niche) {
    currentNiche = niche;
    document.querySelectorAll('.niche-chip').forEach(chip => {
      chip.classList.remove('active');
      if (chip.dataset.niche === niche) chip.classList.add('active');
    });
    applyFilters();
    showToast(niche === 'all' ? '✨ For You feed' : `🎬 Showing ${niche} videos`);
  }

  function updateSuggestionsBar() {
    const topNiches = Object.entries(userInterests)
      .filter(([_, score]) => score > 2)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([niche]) => niche);
    
    document.querySelectorAll('.niche-chip').forEach(chip => {
      const chipNiche = chip.dataset.niche;
      if (chipNiche !== 'all' && topNiches.includes(chipNiche)) {
        chip.style.background = '#ff8c42';
        chip.style.opacity = '1';
      } else if (chipNiche !== 'all') {
        chip.style.background = 'rgba(255,255,255,0.2)';
        chip.style.opacity = '0.8';
      }
    });
  }

  // Infinite scroll
  function handleScroll() {
    const scrollPosition = window.scrollY + window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;
    
    if (scrollPosition >= documentHeight - 600 && !isLoading && hasMore) {
      loadMoreVideos();
    }
  }

  // Ensure videos play after any interaction
  function ensureVideoPlay() {
    const videos = document.querySelectorAll('.video-container video');
    videos.forEach(video => {
      if (video.paused && video.closest('.video-container')) {
        const rect = video.closest('.video-container').getBoundingClientRect();
        const isVisible = rect.top < window.innerHeight - 100 && rect.bottom > 100;
        if (isVisible) {
          video.play().catch(e => console.log('Play retry:', e));
        }
      }
    });
  }

  // Initialize
  function init() {
    applyFilters();
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('click', ensureVideoPlay);
    window.addEventListener('touchstart', ensureVideoPlay);
    updateSuggestionsBar();
    showToast('🎬 Swipe up for endless videos! Videos play automatically');
  }

  init();
</script>
</body>
</html>
