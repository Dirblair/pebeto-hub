<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pebeto - Login / Sign Up</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #ff8c42; }
    .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid rgba(255,140,66,0.3); }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #a08070; }
    .tab.active { color: #ff8c42; border-bottom: 2px solid #ff8c42; }
    .form-pane { display: none; }
    .form-pane.active { display: block; }
    input, select {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 14px;
      border-radius: 40px;
      margin-bottom: 15px;
      color: white;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #ff8c42;
    }
    button {
      width: 100%;
      background: #ff8c42;
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: #1a1208;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #e0662c; transform: translateY(-1px); }
    .message { text-align: center; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 20px; }
    .message.error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
    .message.success { color: #4caf50; background: rgba(76,175,80,0.1); }
    .info-text {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #a08070;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Pebeto</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Login</div>
    <div class="tab" onclick="switchTab('signup')">Sign Up</div>
  </div>
  
  <!-- Login Pane -->
  <div id="login-pane" class="form-pane active">
    <input type="email" id="login-email" placeholder="Email address" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <div id="login-message" class="message"></div>
  </div>
  
  <!-- Sign Up Pane -->
  <div id="signup-pane" class="form-pane">
    <select id="signup-role">
      <option value="creator">🎨 Creator - Share content & earn tips</option>
      <option value="business">🏢 Business / Brand - Hire creators</option>
    </select>
    <input type="email" id="signup-email" placeholder="Email address" autocomplete="email">
    <input type="password" id="signup-password" placeholder="Password (min 6 characters)" autocomplete="new-password">
    <button onclick="signup()">Create Account</button>
    <div id="signup-message" class="message"></div>
  </div>
  
  <div class="info-text">
    By joining, you agree to Pebeto's terms.
  </div>
</div>

<script>
  // Backend API URL
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-pane').forEach(p => p.classList.remove('active'));
    if (tab === 'login') {
      document.querySelector('.tab:first-child').classList.add('active');
      document.getElementById('login-pane').classList.add('active');
    } else {
      document.querySelector('.tab:last-child').classList.add('active');
      document.getElementById('signup-pane').classList.add('active');
    }
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const messageDiv = document.getElementById('login-message');
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    messageDiv.innerHTML = 'Logging in...';
    messageDiv.className = 'message';
    
    try {
      const response = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      
      if (data.success && data.token) {
        localStorage.setItem('pebeto_token', data.token);
        localStorage.setItem('pebeto_user', JSON.stringify(data.user));
        messageDiv.innerHTML = 'Login successful! Redirecting...';
        messageDiv.className = 'message success';
        setTimeout(() => {
          if (data.user.role === 'creator') {
            window.location.href = '/creator-dashboard.html';
          } else if (data.user.role === 'business') {
            window.location.href = '/business-dashboard.html';
          } else if (data.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/community.html';
          }
        }, 1000);
      } else {
        messageDiv.innerHTML = data.message || 'Login failed. Check your email and password.';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Login error:', error);
      messageDiv.innerHTML = 'Network error. Please check your connection.';
      messageDiv.className = 'message error';
    }
  }

  async function signup() {
    const role = document.getElementById('signup-role').value;
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const messageDiv = document.getElementById('signup-message');
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    if (password.length < 6) {
      messageDiv.innerHTML = 'Password must be at least 6 characters';
      messageDiv.className = 'message error';
      return;
    }
    
    messageDiv.innerHTML = 'Creating account...';
    messageDiv.className = 'message';
    
    try {
      const response = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role })
      });
      const data = await response.json();
      
      if (data.success) {
        messageDiv.innerHTML = 'Account created successfully! Please login.';
        messageDiv.className = 'message success';
        document.getElementById('signup-email').value = '';
        document.getElementById('signup-password').value = '';
        setTimeout(() => switchTab('login'), 1500);
      } else {
        messageDiv.innerHTML = data.message || 'Signup failed. Email may already exist.';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Signup error:', error);
      messageDiv.innerHTML = 'Network error. Please try again.';
      messageDiv.className = 'message error';
    }
  }
</script>
</body>
</html>
