<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pebeto - Creator & Business Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 16px;
      color: #ff8c42;
    }
    .tagline {
      text-align: center;
      color: #a08070;
      margin-bottom: 50px;
      font-size: 18px;
    }
    .role-cards {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .role-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 28px;
      padding: 40px 30px;
      width: 280px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .role-card:hover {
      border-color: #ff8c42;
      transform: translateY(-5px);
      background: rgba(255,140,66,0.1);
    }
    .role-card.selected {
      border-color: #ff8c42;
      background: rgba(255,140,66,0.15);
      box-shadow: 0 0 20px rgba(255,140,66,0.3);
    }
    .role-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .role-card h3 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ff8c42;
    }
    .role-card p {
      font-size: 14px;
      color: #a08070;
      line-height: 1.5;
    }
    .auth-form {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.2);
      border-radius: 28px;
      padding: 40px;
      max-width: 500px;
      margin: 0 auto;
      transition: all 0.3s ease;
    }
    .form-title {
      font-size: 24px;
      margin-bottom: 25px;
      color: #ff8c42;
      text-align: center;
    }
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,140,66,0.3);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      color: #a08070;
      font-size: 16px;
      font-weight: 500;
    }
    .tab.active {
      color: #ff8c42;
      border-bottom: 2px solid #ff8c42;
    }
    .form-pane {
      display: none;
    }
    .form-pane.active {
      display: block;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 14px 18px;
      border-radius: 40px;
      margin-bottom: 15px;
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #ff8c42;
    }
    button {
      width: 100%;
      background: #ff8c42;
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: #1a1208;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #e0662c;
      transform: translateY(-1px);
    }
    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      padding: 10px;
      border-radius: 20px;
    }
    .message.error {
      color: #ff6b6b;
      background: rgba(255,107,107,0.1);
    }
    .message.success {
      color: #4caf50;
      background: rgba(76,175,80,0.1);
    }
    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      .role-card { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Pebeto</h1>
  <div class="tagline">Connect, Create, Earn</div>
  
  <div class="role-cards">
    <div class="role-card" data-role="creator" onclick="selectRole('creator')">
      <div class="role-icon">🎨</div>
      <h3>Creator</h3>
      <p>Share your content, get tips, find brand deals and earn money from your passion</p>
    </div>
    <div class="role-card" data-role="business" onclick="selectRole('business')">
      <div class="role-icon">🏢</div>
      <h3>Business / Brand</h3>
      <p>Discover talented creators, launch campaigns, and grow your brand</p>
    </div>
  </div>

  <div class="auth-form" id="auth-form" style="display: none;">
    <div class="form-title" id="form-title">Login as <span id="selected-role-name">Creator</span></div>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>
    
    <div id="login-pane" class="form-pane active">
      <input type="email" id="login-email" placeholder="Email address">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div id="login-message" class="message"></div>
    </div>
    
    <div id="signup-pane" class="form-pane">
      <input type="email" id="signup-email" placeholder="Email address">
      <input type="password" id="signup-password" placeholder="Password">
      <button onclick="signup()">Create Account</button>
      <div id="signup-message" class="message"></div>
    </div>
  </div>
</div>

<script>
  // THIS IS THE CORRECT API URL - YOUR BACKEND
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';
  let selectedRole = null;

  function selectRole(role) {
    selectedRole = role;
    
    document.querySelectorAll('.role-card').forEach(card => {
      card.classList.remove('selected');
    });
    document.querySelector(`.role-card[data-role="${role}"]`).classList.add('selected');
    
    const roleName = role === 'creator' ? 'Creator' : 'Business / Brand';
    document.getElementById('selected-role-name').innerHTML = roleName;
    document.getElementById('auth-form').style.display = 'block';
    document.getElementById('auth-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-pane').forEach(p => p.classList.remove('active'));
    
    if (tab === 'login') {
      document.querySelector('.tab:first-child').classList.add('active');
      document.getElementById('login-pane').classList.add('active');
    } else {
      document.querySelector('.tab:last-child').classList.add('active');
      document.getElementById('signup-pane').classList.add('active');
    }
  }

  async function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const messageDiv = document.getElementById('login-message');
    
    if (!selectedRole) {
      messageDiv.innerHTML = 'Please select Creator or Business first';
      messageDiv.className = 'message error';
      return;
    }
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    messageDiv.innerHTML = 'Logging in...';
    messageDiv.className = 'message';
    
    try {
      console.log('Attempting login to:', `${API_BASE}/api/auth/login`);
      const response = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      console.log('Login response:', data);
      
      if (data.success && data.token) {
        localStorage.setItem('pebeto_token', data.token);
        localStorage.setItem('pebeto_user', JSON.stringify(data.user));
        messageDiv.innerHTML = 'Login successful! Redirecting...';
        messageDiv.className = 'message success';
        setTimeout(() => {
          if (data.user.role === 'creator') window.location.href = '/creator-dashboard.html';
          else if (data.user.role === 'business') window.location.href = '/business-dashboard.html';
          else if (data.user.role === 'admin') window.location.href = '/admin-dashboard.html';
          else window.location.href = '/community.html';
        }, 1000);
      } else {
        messageDiv.innerHTML = data.message || 'Login failed';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Login error:', error);
      messageDiv.innerHTML = 'Network error: ' + error.message;
      messageDiv.className = 'message error';
    }
  }

  async function signup() {
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const messageDiv = document.getElementById('signup-message');
    
    if (!selectedRole) {
      messageDiv.innerHTML = 'Please select Creator or Business first';
      messageDiv.className = 'message error';
      return;
    }
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    messageDiv.innerHTML = 'Creating account...';
    messageDiv.className = 'message';
    
    try {
      console.log('Attempting signup to:', `${API_BASE}/api/auth/register`);
      const response = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: selectedRole })
      });
      const data = await response.json();
      console.log('Signup response:', data);
      
      if (data.success) {
        messageDiv.innerHTML = 'Account created successfully! Please login.';
        messageDiv.className = 'message success';
        document.getElementById('signup-email').value = '';
        document.getElementById('signup-password').value = '';
        setTimeout(() => switchTab('login'), 1500);
      } else {
        messageDiv.innerHTML = data.message || 'Signup failed';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Signup error:', error);
      messageDiv.innerHTML = 'Network error: ' + error.message;
      messageDiv.className = 'message error';
    }
  }
</script>
</body>
</html>
