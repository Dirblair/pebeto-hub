<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pebeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,140,66,0.3);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .logo { text-align: center; font-size: 28px; font-weight: 800; color: #ff8c42; margin-bottom: 30px; cursor: pointer; }
    h1 { text-align: center; margin-bottom: 30px; color: #ff8c42; font-size: 24px; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,140,66,0.3);
      padding: 14px;
      border-radius: 40px;
      margin-bottom: 15px;
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #ff8c42;
    }
    button {
      width: 100%;
      background: #ff8c42;
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: #1a1208;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #e0662c; transform: translateY(-1px); }
    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      padding: 10px;
      border-radius: 20px;
    }
    .message.error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
    .message.success { color: #4caf50; background: rgba(76,175,80,0.1); }
    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #a08070;
    }
    .signup-link a {
      color: #ff8c42;
      text-decoration: none;
    }
    .signup-link a:hover { text-decoration: underline; }
    .forgot-password {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 15px;
    }
    .forgot-password a {
      color: #a08070;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo" onclick="window.location.href='/'">Pebeto</div>
  <h1>Welcome Back</h1>
  
  <input type="email" id="email" placeholder="Email address" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <div class="forgot-password"><a href="#">Forgot password?</a></div>
  
  <button onclick="login()">Login</button>
  <div id="message" class="message"></div>
  <div class="signup-link">Don't have an account? <a href="/signup.html">Sign Up</a></div>
</div>

<script>
  const API_BASE = 'https://pebeto-creators-hub.onrender.com';

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    
    if (!email || !password) {
      messageDiv.innerHTML = 'Please enter email and password';
      messageDiv.className = 'message error';
      return;
    }
    
    messageDiv.innerHTML = 'Logging in...';
    messageDiv.className = 'message';
    
    try {
      const response = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      
      if (data.success && data.token) {
        localStorage.setItem('pebeto_token', data.token);
        localStorage.setItem('pebeto_user', JSON.stringify(data.user));
        messageDiv.innerHTML = 'Login successful! Redirecting...';
        messageDiv.className = 'message success';
        
        setTimeout(() => {
          if (data.user.role === 'creator') {
            window.location.href = '/creator-dashboard.html';
          } else if (data.user.role === 'business') {
            window.location.href = '/business-dashboard.html';
          } else if (data.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/community.html';
          }
        }, 1000);
      } else {
        messageDiv.innerHTML = data.message || 'Login failed. Check your email and password.';
        messageDiv.className = 'message error';
      }
    } catch (error) {
      console.error('Login error:', error);
      messageDiv.innerHTML = 'Network error. Please try again.';
      messageDiv.className = 'message error';
    }
  }
</script>
</body>
</html>
