<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pebeto Community — Watch, Connect, Create</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4facfe',
            secondary: '#00f2fe',
            accent: '#ff0050',
          },
        },
      },
    };
  </script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    
    .feed-container {
      height: 100vh; width: 100vw; overflow-y: scroll;
      scroll-snap-type: y mandatory; scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    .post-card {
      height: 100vh; width: 100%; scroll-snap-align: start;
      position: relative; background: #000;
    }
    .post-media { width: 100%; height: 100%; object-fit: contain; background: #000; }

    .right-sidebar {
      position: absolute; right: 12px; bottom: 100px;
      display: flex; flex-direction: column; align-items: center;
      gap: 24px; z-index: 50;
    }
    .action-item { 
      display: flex; flex-direction: column; align-items: center; 
      cursor: pointer; color: white; transition: transform 0.1s ease;
    }
    .action-item:active { transform: scale(0.95); }
    .action-item i { font-size: 2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .action-count { font-size: 0.7rem; font-weight: 600; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .creator-avatar { 
      width: 48px; height: 48px; border-radius: 50%; 
      border: 2px solid #fff; background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.2rem;
    }
    .follow-btn { 
      position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); 
      width: 22px; height: 22px; background: #ff0050; border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
      font-size: 12px; font-weight: bold; color: white;
      cursor: pointer; transition: transform 0.1s ease;
    }
    .follow-btn:active { transform: translateX(-50%) scale(0.9); }

    .caption-overlay {
      position: absolute; bottom: 100px; left: 16px;
      color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      max-width: 70%; z-index: 50;
    }
    .caption-username { font-weight: bold; font-size: 0.9rem; }
    .caption-text { font-size: 0.85rem; margin-top: 4px; opacity: 0.9; }

    .bottom-navbar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
      background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid #222;
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; 
      cursor: pointer; color: #8a8b91; transition: color 0.1s ease;
    }
    .nav-item.active { color: #fff; }
    .nav-item i { font-size: 1.5rem; }
    .nav-label { font-size: 0.65rem; margin-top: 2px; }
    .create-btn-container { 
      width: 50px; height: 50px; 
      background: linear-gradient(135deg, #4facfe, #00f2fe); 
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      margin-top: -20px; cursor: pointer;
      transition: transform 0.1s ease;
    }
    .create-btn-container:active { transform: scale(0.95); }
    .create-btn-inner { 
      width: 44px; height: 44px; background: #000; border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
      color: white; font-weight: bold; font-size: 1.5rem;
    }
  </style>
</head>

<body>
  <!-- Main Feed -->
  <div class="feed-container" id="feed"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-navbar">
    <div class="nav-item active" data-nav="home">
      <i class="ri-home-fill"></i>
      <span class="nav-label">Home</span>
    </div>
    <div class="create-btn-container" onclick="openComposer()">
      <div class="create-btn-inner">+</div>
    </div>
    <div class="nav-item" data-nav="profile" onclick="goToHub()">
      <i class="ri-user-line"></i>
      <span class="nav-label">Profile</span>
    </div>
  </nav>

  <!-- Composer Modal -->
  <div id="composer-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:200; padding:20px;">
    <div style="max-width:400px; margin:50px auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color:white; font-size:1.5rem;">Create Post</h2>
        <button onclick="closeComposer()" style="background:transparent; border:none; color:white; font-size:1.5rem;">✕</button>
      </div>
      <textarea id="post-caption" placeholder="What's happening?" style="width:100%; height:100px; background:#222; color:white; padding:10px; border-radius:10px; border:none; resize:none;"></textarea>
      <input id="post-file" type="file" accept="image/*,video/*" style="width:100%; margin-top:10px; background:#222; color:white; padding:10px; border-radius:10px; border:none;">
      <div id="upload-progress" class="hidden mt-2">
        <div class="h-1 bg-slate-700 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-primary transition-all" style="width:0%"></div>
        </div>
        <p id="progress-text" class="text-xs text-slate-400 mt-1">Uploading...</p>
      </div>
      <div style="margin-top:20px; display:flex; gap:10px;">
        <button onclick="closeComposer()" style="flex:1; padding:12px; background:#333; color:white; border-radius:10px; border:none;">Cancel</button>
        <button onclick="submitPost()" id="submit-post-btn" style="flex:1; padding:12px; background:linear-gradient(135deg, #4facfe, #00f2fe); color:white; border-radius:10px; border:none; font-weight:bold;">Post</button>
      </div>
    </div>
  </div>

  <!-- Comments Modal -->
  <div id="comment-modal" style="display:none; position:fixed; bottom:0; left:0; width:100%; height:60%; background:#1a1a1a; z-index:300; border-radius:20px 20px 0 0; padding:20px; color:white;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="margin:0;">Comments</h3>
      <button onclick="closeComments()" style="background:transparent; border:none; color:white; font-size:1.2rem;">✕</button>
    </div>
    <div id="comment-list" style="height:65%; overflow-y:scroll;"></div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <input type="text" id="comment-input" placeholder="Add a comment..." style="flex:1; padding:12px; border-radius:25px; border:none; background:#333; color:white;">
      <button onclick="addComment()" style="background:linear-gradient(135deg, #4facfe, #00f2fe); border:none; padding:10px 20px; border-radius:25px; color:white; font-weight:bold;">Post</button>
    </div>
  </div>

  <script src="/js/pebeto-api.js"></script>
  <script>
    const { requireRole, apiFetch, formatUsd, formatDate, clearSession, getUser, getToken } = window.PebetoApi || {};
    
    let socket = null;
    let currentUser = null;
    let currentPostId = null;
    let observer = null;
    let feedPosts = [];

    // Initialize authentication
    (async function initAuth() {
      try {
        // Check if user is logged in via API
        const user = getUser ? getUser() : null;
        if (!user) {
          // No session, redirect to signup
          window.location.href = '/signup.html';
          return;
        }
        currentUser = user;
        
        // Initialize socket connection
        initSocket();
        
        // Load posts
        await loadPosts();
        
        // Setup intersection observer for video autoplay
        setupObserver();
        
      } catch (error) {
        console.error('Auth error:', error);
        window.location.href = '/signup.html';
      }
    })();

    function initSocket() {
      if (typeof io === 'undefined') {
        console.warn('Socket.io not available');
        return;
      }
      
      const token = getToken ? getToken() : null;
      socket = io({
        auth: { token: token },
        transports: ['websocket', 'polling']
      });
      
      socket.on('connect', () => {
        console.log('Socket connected');
        socket.emit('join:community');
      });
      
      socket.on('post:new', (post) => {
        // Add new post to the top of feed
        const postElement = renderPostElement(post);
        const feed = document.getElementById('feed');
        if (feed) {
          feed.insertBefore(postElement, feed.firstChild);
          if (observer) observer.observe(postElement);
        }
        feedPosts.unshift(post);
      });
      
      socket.on('post:like', (data) => {
        updateLikeCount(data.postId, data.likeCount, data.isLikedByCurrentUser);
      });
      
      socket.on('post:comment', (data) => {
        if (currentPostId === data.postId) {
          renderComments(data.comments);
        }
        updateCommentCount(data.postId, data.commentCount);
      });
      
      socket.on('connect_error', (err) => {
        console.error('Socket connection error:', err);
      });
    }

    async function loadPosts() {
      try {
        const feed = document.getElementById('feed');
        if (feed) {
          feed.innerHTML = '<div class="flex items-center justify-center h-full"><div class="text-slate-400">Loading videos...</div></div>';
        }
        
        const data = await apiFetch('/api/community/posts');
        feedPosts = data.posts || [];
        
        if (feed) feed.innerHTML = '';
        
        if (feedPosts.length === 0) {
          if (feed) {
            feed.innerHTML = `
              <div class="flex flex-col items-center justify-center h-full text-center p-8">
                <i class="ri-video-add-line text-6xl text-slate-600 mb-4"></i>
                <p class="text-slate-400">No posts yet</p>
                <p class="text-slate-500 text-sm mt-2">Be the first to share something!</p>
                <button onclick="openComposer()" class="mt-4 px-6 py-2 bg-primary rounded-full text-white">Create Post</button>
              </div>
            `;
          }
          return;
        }
        
        feedPosts.forEach(post => {
          const postElement = renderPostElement(post);
          if (feed) feed.appendChild(postElement);
          if (observer) observer.observe(postElement);
        });
      } catch (error) {
        console.error('Load posts error:', error);
        const feed = document.getElementById('feed');
        if (feed) {
          feed.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-center p-8">
              <i class="ri-error-warning-line text-6xl text-rose-500 mb-4"></i>
              <p class="text-slate-400">Failed to load posts</p>
              <button onclick="loadPosts()" class="mt-4 px-6 py-2 bg-primary rounded-full text-white">Retry</button>
            </div>
          `;
        }
      }
    }

    function renderPostElement(post) {
      const article = document.createElement('article');
      article.className = 'post-card';
      article.dataset.postId = post._id;
      
      const mediaTag = post.mediaType === 'video' 
        ? `<video class="post-media" src="${post.mediaUrl}" loop muted playsinline poster="${post.thumbnailUrl || ''}"></video>`
        : `<img class="post-media" src="${post.mediaUrl}" alt="${escapeHtml(post.caption || 'Post image')}" />`;
      
      const isLiked = post.isLikedByCurrentUser || false;
      const likeIconColor = isLiked ? '#ff0050' : 'white';
      const likeIconFill = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
      
      const isFollowing = post.author?.isFollowedByCurrentUser || false;
      const followBtnText = isFollowing ? '✓' : '+';
      
      const authorName = post.author?.stageName || post.author?.uniqueCode || 'Creator';
      const authorInitial = authorName.charAt(0).toUpperCase();
      
      article.innerHTML = `
        ${mediaTag}
        <div class="caption-overlay">
          <div class="caption-username">@${escapeHtml(post.author?.uniqueCode || 'user')}</div>
          <div class="caption-text">${escapeHtml(post.caption || '')}</div>
        </div>
        <div class="right-sidebar">
          <div class="action-item" onclick="viewProfile('${post.author?._id}')">
            <div class="creator-avatar">${authorInitial}</div>
            <button class="follow-btn" onclick="event.stopPropagation(); toggleFollow('${post.author?._id}', this)">${followBtnText}</button>
          </div>
          <div class="action-item" onclick="toggleLike('${post._id}', this)">
            <i class="${likeIconFill}" style="color:${likeIconColor}"></i>
            <span class="action-count">${formatNumber(post.likeCount || 0)}</span>
          </div>
          <div class="action-item" onclick="openComments('${post._id}')">
            <i class="ri-chat-3-fill"></i>
            <span class="action-count">${formatNumber(post.commentCount || 0)}</span>
          </div>
          ${currentUser?._id === post.author?._id ? `
          <div class="action-item" onclick="deletePost('${post._id}', this)">
            <i class="ri-delete-bin-line"></i>
          </div>
          ` : ''}
        </div>
      `;
      
      // Setup video autoplay on load
      const video = article.querySelector('video');
      if (video) {
        video.addEventListener('canplay', () => {
          if (isElementInViewport(article)) {
            video.play().catch(e => console.log('Autoplay prevented:', e));
          }
        });
      }
      
      return article;
    }

    function isElementInViewport(el) {
      const rect = el.getBoundingClientRect();
      return rect.top >= 0 && rect.top <= window.innerHeight;
    }

    function setupObserver() {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (!video) return;
          
          if (entry.isIntersecting) {
            video.play().catch(e => console.log('Play failed:', e));
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.5 });
      
      document.querySelectorAll('.post-card').forEach(card => observer.observe(card));
    }

    async function toggleLike(postId, element) {
      try {
        const icon = element.querySelector('i');
        const countSpan = element.querySelector('.action-count');
        
        const data = await apiFetch('/api/community/posts/' + postId + '/like', {
          method: 'POST',
          body: JSON.stringify({})
        });
        
        const isLiked = data.liked;
        icon.className = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
        icon.style.color = isLiked ? '#ff0050' : 'white';
        countSpan.textContent = formatNumber(data.likeCount);
      } catch (error) {
        console.error('Like error:', error);
      }
    }

    function updateLikeCount(postId, likeCount, isLiked) {
      const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
      if (!postCard) return;
      
      const actionItem = postCard.querySelector('.action-item:has(.ri-heart-fill), .action-item:has(.ri-heart-line)');
      if (actionItem) {
        const icon = actionItem.querySelector('i');
        const countSpan = actionItem.querySelector('.action-count');
        
        if (icon) {
          icon.className = isLiked ? 'ri-heart-fill' : 'ri-heart-line';
          icon.style.color = isLiked ? '#ff0050' : 'white';
        }
        if (countSpan) countSpan.textContent = formatNumber(likeCount);
      }
    }

    function updateCommentCount(postId, commentCount) {
      const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
      if (!postCard) return;
      
      const commentItem = postCard.querySelector('.action-item:has(.ri-chat-3-fill)');
      if (commentItem) {
        const countSpan = commentItem.querySelector('.action-count');
        if (countSpan) countSpan.textContent = formatNumber(commentCount);
      }
    }

    async function toggleFollow(userId, button) {
      try {
        const data = await apiFetch('/api/users/' + userId + '/follow', {
          method: 'POST',
          body: JSON.stringify({})
        });
        
        button.textContent = data.isFollowing ? '✓' : '+';
      } catch (error) {
        console.error('Follow error:', error);
      }
    }

    async function openComments(postId) {
      currentPostId = postId;
      const modal = document.getElementById('comment-modal');
      const commentList = document.getElementById('comment-list');
      
      if (commentList) commentList.innerHTML = '<div class="text-slate-500 text-center py-4">Loading comments...</div>';
      if (modal) modal.style.display = 'block';
      
      try {
        const data = await apiFetch('/api/community/posts/' + postId + '/comments');
        renderComments(data.comments || []);
      } catch (error) {
        console.error('Load comments error:', error);
        if (commentList) commentList.innerHTML = '<div class="text-rose-400 text-center py-4">Failed to load comments</div>';
      }
    }

    function renderComments(comments) {
      const commentList = document.getElementById('comment-list');
      if (!commentList) return;
      
      if (!comments.length) {
        commentList.innerHTML = '<div class="text-slate-500 text-center py-4">No comments yet. Be the first!</div>';
        return;
      }
      
      commentList.innerHTML = comments.map(comment => `
        <div class="flex gap-2 py-2 border-b border-slate-800">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-xs font-bold">
            ${(comment.author?.stageName?.[0] || comment.author?.uniqueCode?.[0] || 'U').toUpperCase()}
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold">@${escapeHtml(comment.author?.uniqueCode || 'user')}</span>
              <span class="text-xs text-slate-500">${formatDate ? formatDate(comment.createdAt) : new Date(comment.createdAt).toLocaleDateString()}</span>
            </div>
            <p class="text-sm mt-1">${escapeHtml(comment.text)}</p>
          </div>
        </div>
      `).join('');
    }

    async function addComment() {
      const input = document.getElementById('comment-input');
      const text = input?.value.trim();
      
      if (!text || !currentPostId) return;
      
      try {
        await apiFetch('/api/community/posts/' + currentPostId + '/comments', {
          method: 'POST',
          body: JSON.stringify({ text })
        });
        
        input.value = '';
        
        // Refresh comments
        const data = await apiFetch('/api/community/posts/' + currentPostId + '/comments');
        renderComments(data.comments || []);
        
      } catch (error) {
        console.error('Add comment error:', error);
        alert('Failed to add comment');
      }
    }

    function closeComments() {
      const modal = document.getElementById('comment-modal');
      if (modal) modal.style.display = 'none';
      currentPostId = null;
    }

    async function deletePost(postId, element) {
      if (!confirm('Delete this post?')) return;
      
      try {
        await apiFetch('/api/community/posts/' + postId, {
          method: 'DELETE'
        });
        
        const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
        if (postCard) {
          if (observer) observer.unobserve(postCard);
          postCard.remove();
        }
        
        feedPosts = feedPosts.filter(p => p._id !== postId);
      } catch (error) {
        console.error('Delete error:', error);
        alert('Failed to delete post');
      }
    }

    async function submitPost() {
      const caption = document.getElementById('post-caption')?.value.trim();
      const fileInput = document.getElementById('post-file');
      
      if (!caption) {
        alert('Please add a caption');
        return;
      }
      
      if (!fileInput?.files.length) {
        alert('Please select an image or video');
        return;
      }
      
      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('media', file);
      formData.append('caption', caption);
      
      const submitBtn = document.getElementById('submit-post-btn');
      const progressDiv = document.getElementById('upload-progress');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Uploading...';
      }
      if (progressDiv) progressDiv.classList.remove('hidden');
      
      try {
        const data = await apiFetch('/api/community/posts', {
          method: 'POST',
          body: formData,
          isFormData: true,
          onProgress: (percent) => {
            if (progressBar) progressBar.style.width = percent + '%';
            if (progressText) progressText.textContent = `Uploading: ${percent}%`;
          }
        });
        
        // Add new post to feed
        const postElement = renderPostElement(data.post);
        const feed = document.getElementById('feed');
        if (feed) {
          // Remove empty state if present
          if (feed.children.length === 1 && feed.children[0].querySelector('.ri-video-add-line')) {
            feed.innerHTML = '';
          }
          feed.insertBefore(postElement, feed.firstChild);
          if (observer) observer.observe(postElement);
        }
        feedPosts.unshift(data.post);
        
        closeComposer();
        
        // Clear form
        if (fileInput) fileInput.value = '';
        if (document.getElementById('post-caption')) document.getElementById('post-caption').value = '';
        
      } catch (error) {
        console.error('Upload error:', error);
        alert('Failed to upload: ' + (error.message || 'Unknown error'));
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post';
        }
        if (progressDiv) progressDiv.classList.add('hidden');
        if (progressBar) progressBar.style.width = '0%';
      }
    }

    function openComposer() {
      const modal = document.getElementById('composer-modal');
      if (modal) modal.style.display = 'block';
    }

    function closeComposer() {
      const modal = document.getElementById('composer-modal');
      if (modal) modal.style.display = 'none';
      
      // Clear form
      const fileInput = document.getElementById('post-file');
      const captionInput = document.getElementById('post-caption');
      if (fileInput) fileInput.value = '';
      if (captionInput) captionInput.value = '';
    }

    function viewProfile(userId) {
      if (userId === currentUser?._id) {
        goToHub();
      } else {
        window.location.href = `/profile.html?userId=${userId}`;
      }
    }

    function goToHub() {
      const userRole = currentUser?.role;
      if (userRole === 'business') window.location.href = '/business.html';
      else if (userRole === 'creator') window.location.href = '/creator-hub.html';
      else window.location.href = '/signup.html';
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Re-setup observer when feed changes (for dynamically loaded videos)
    const feedContainer = document.getElementById('feed');
    if (feedContainer) {
      const mutationObserver = new MutationObserver(() => {
        document.querySelectorAll('.post-card:not([data-observed])').forEach(card => {
          if (observer) observer.observe(card);
          card.dataset.observed = 'true';
        });
      });
      mutationObserver.observe(feedContainer, { childList: true });
    }
  </script>
</body>
</html>
