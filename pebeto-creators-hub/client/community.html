<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pebeto Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        
        .feed-container {
            height: 100vh; width: 100vw; overflow-y: scroll;
            scroll-snap-type: y mandatory; scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .post-card {
            height: 100vh; width: 100%; scroll-snap-align: start;
            position: relative; background: #000;
        }
        .post-media { width: 100%; height: 100%; object-fit: cover; }

        .right-sidebar {
            position: absolute; right: 12px; bottom: 80px;
            display: flex; flex-direction: column; align-items: center;
            gap: 24px; z-index: 50;
        }
        .action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: white; }
        .action-item i { font-size: 2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .action-count { font-size: 0.75rem; font-weight: 600; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .creator-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; background: #333; }
        .follow-btn { 
            position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); 
            width: 20px; height: 20px; background: #ff0050; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold;
        }

        .bottom-navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background-color: rgba(0, 0, 0, 0.9); border-top: 1px solid #222;
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #8a8b91; }
        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 1.4rem; }
        .nav-label { font-size: 0.65rem; margin-top: 2px; }
        .create-btn-container { width: 45px; height: 30px; background: linear-gradient(to right, #00f2fe, #4facfe); border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .create-btn-inner { width: 37px; height: 100%; background-color: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>

    <body>
    <div class="feed-container" id="feed">
        </div>

    <nav class="bottom-navbar">
        <div class="nav-item active"><i class="ri-home-fill"></i><span class="nav-label">Home</span></div>
        <div class="create-btn-container" onclick="openComposer()">
            <div class="create-btn-inner">+</div>
        </div>
        <div class="nav-item" onclick="goToHub()"><i class="ri-user-line"></i><span class="nav-label">Profile</span></div>
    </nav>
<!-- Hidden Composer Modal -->
<div id="composer-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:200; padding:20px;">
        <div style="max-width:400px; margin:50px auto;">
            <h2 style="color:white; font-size:1.5rem; margin-bottom:20px;">Create Post</h2>
            <textarea id="post-caption" placeholder="What's happening?" style="width:100%; height:100px; background:#222; color:white; padding:10px; border-radius:10px;"></textarea>
            <input id="post-file" type="file" accept="image/*,video/*" style="width:100%; margin-top:10px; background:#222; color:white; padding:10px; border-radius:10px;">
            
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button onclick="closeComposer()" style="flex:1; padding:10px; background:#444; color:white; border-radius:10px;">Cancel</button>
                <button onclick="submitPost()" style="flex:1; padding:10px; background:#4facfe; color:white; border-radius:10px;">Post</button>
            </div>
        </div> 
    </div>

    <div id="comment-modal" style="display:none; position:fixed; bottom:0; width:100%; height:50%; background:white; z-index:300; border-radius:20px 20px 0 0; padding:20px;">
      <button onclick="document.getElementById('comment-modal').style.display='none'" style="float:right;">X</button>  
        <h3>Comments</h3>
        <div id="comment-list" style="height:70%; overflow-y:scroll;"></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="comment-input" placeholder="Add a comment..." style="flex:1; padding:10px;">
            <button onclick="addComment()">Post</button>
        </div>
    </div>
    
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) video.play();
                else { video.pause(); video.currentTime = 0; }
            });
        }, { threshold: 0.7 });
        document.querySelectorAll('.post-card').forEach(card => observer.observe(card));

        function goToHub() {
            const userRole = localStorage.getItem('userRole');
            if (userRole === 'business') window.location.href = '/hub/business-hub.html';
            else if (userRole === 'creator') window.location.href = '/hub/creator-hub.html';
            else window.location.href = '/signup.html';
        }
        function openComposer() {
            document.getElementById('composer-modal').style.display = 'block';
        }

        function closeComposer() {
            document.getElementById('composer-modal').style.display = 'none';
        }

        // --- NEW: This function builds the post card ---
        function renderPost(videoUrl, caption) { // Added 'caption' parameter
    const feed = document.getElementById('feed');
    const article = document.createElement('article');
    article.className = 'post-card';
    article.innerHTML = `
        <video class="post-media" src="${videoUrl}" loop muted playsinline autoplay></video>
        <div class="caption-overlay" style="position:absolute; bottom:60px; left:10px; color:white; font-weight:bold;">
            ${caption}
        </div>
        <div class="right-sidebar">
            <div class="action-item"><img src="avatar.jpg" class="creator-avatar"><button class="follow-btn">+</button></div>
            <div class="action-item" onclick="toggleLike(this)">
                <i class="ri-heart-fill"></i>
                <span class="action-count">0</span>
            </div>
            <div class="action-item" onclick="openComments()">
                <i class="ri-chat-3-fill"></i>
            </div>
        </div>
    `;
    feed.appendChild(article);
    observer.observe(article);
}

        // --- UPDATED: This function now uses renderPost ---
        function submitPost() {
    const caption = document.getElementById('post-caption').value; // Get the text
    const fileInput = document.getElementById('post-file');
    
    if(fileInput.files.length === 0 || !caption) {
        alert('Please add a caption and a file.');
        return;
    }
    
    // Show a quick "Uploading..." alert
    const btn = event.target;
    btn.textContent = "Posting...";
    
    setTimeout(() => {
        const videoUrl = URL.createObjectURL(fileInput.files[0]);
        renderPost(videoUrl, caption); // Pass it to the renderer
        closeComposer();
        btn.textContent = "Post"; // Reset button
    }, 1000); // 1-second fake upload delay
}

        function toggleLike(element) {
            const icon = element.querySelector('i');
            const countSpan = element.querySelector('.action-count');
            
            if (icon.style.color === 'red') {
                icon.style.color = 'white';
                countSpan.textContent = "1200";
            } else {
                icon.style.color = 'red';
                countSpan.textContent = "1201";
            }
        }
        function openComments() {
    document.getElementById('comment-modal').style.display = 'block';
}

function addComment() {
    const input = document.getElementById('comment-input');
    const list = document.getElementById('comment-list');
    if(input.value) {
        const p = document.createElement('p');
        p.textContent = "User: " + input.value;
        list.appendChild(p);
        input.value = '';
    }
}
    </script>
</body>
</html>
