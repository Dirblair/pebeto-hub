<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creator Studio | Pebeto</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Welcome to your Studio</h1>
        
        <div class="stats-grid">
            <div class="card"><h3>Total Earnings</h3><p>KES 12,500</p></div>
            <div class="card"><h3>Active Bids</h3><p>3</p></div>
            <div class="card"><h3>Fan Tips</h3><p>24</p></div>
        </div>

        <div class="card">
            <h2>Manage Your Content</h2>
            <p>Upload videos, check your campaign status, and view your private analytics here.</p>
        </div>
    </div>
</body>
</html>
