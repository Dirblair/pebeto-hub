<script src="/js/pebeto-api.js"></script>
<script>
  const { requireRole, apiFetch, formatUsd, formatDate, displayLabel, dashboardUrl, clearSession, getUser } =
    window.PebetoApi || {};

  // Fallbacks in case API methods are missing
  const safeDisplayLabel = (u) => {
    if (displayLabel) return displayLabel(u);
    return u.profile?.displayName || u.profile?.companyName || u.uniqueCode || u.email || 'User';
  };
  const safeDashboardUrl = (u) => {
    if (dashboardUrl) return dashboardUrl(u, true);
    return u.role === 'creator' ? `/creator-dashboard.html?code=${u.uniqueCode}` : `/brand-dashboard.html?id=${u._id}`;
  };

  const session = requireRole ? requireRole(['admin'], '/signup.html?login=1') : (() => { throw new Error('API not loaded'); })();
  if (!session) throw new Error('unauthorized');

  let metricsCache = null;
  let regCache = null;
  let chartReg = null;
  let chartFees = null;
  let payoutMethod = 'mpesa';
  let searchTimer = null;
  let isSubmitting = false;

  function showAlert(msg, type) {
    const el = document.getElementById('global-alert');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden', 'border-rose-500/50', 'bg-rose-500/10', 'text-rose-200', 'border-emerald-500/50', 'bg-emerald-500/10', 'text-emerald-200');
    if (type === 'success') el.classList.add('border-emerald-500/50', 'bg-emerald-500/10', 'text-emerald-200');
    else el.classList.add('border-rose-500/50', 'bg-rose-500/10', 'text-rose-200');
    setTimeout(() => el.classList.add('hidden'), 5000);
  }

  function openModal(title, html) {
    const titleEl = document.getElementById('modal-title');
    const bodyEl = document.getElementById('modal-body');
    if (!titleEl || !bodyEl) return;
    titleEl.textContent = title;
    bodyEl.innerHTML = html;
    const modal = document.getElementById('modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.setAttribute('aria-hidden', 'true');
  }

  function initHeader() {
    const user = getUser ? getUser() : null;
    const emailEl = document.getElementById('admin-email');
    const avatarEl = document.getElementById('admin-avatar');
    if (emailEl) emailEl.textContent = user?.email || '';
    const name = user?.profile?.displayName || user?.email || 'Admin';
    const initials = name
      .split(/\s+/)
      .map((w) => w[0])
      .join('')
      .slice(0, 2)
      .toUpperCase();
    if (avatarEl) avatarEl.textContent = initials;
    if (user?.profile?.avatarUrl && avatarEl) {
      const img = document.createElement('img');
      img.src = user.profile.avatarUrl;
      img.alt = 'Admin';
      img.className = 'h-full w-full rounded-2xl object-cover';
      avatarEl.textContent = '';
      avatarEl.appendChild(img);
    }
  }

  async function loadMetrics() {
    const data = await apiFetch('/api/admin/metrics');
    metricsCache = data;
    const profitEl = document.getElementById('metric-profit');
    const escrowEl = document.getElementById('metric-escrow');
    const withdrawnEl = document.getElementById('metric-withdrawn');
    if (profitEl) profitEl.textContent = formatUsd(data.profitWallet);
    if (escrowEl) escrowEl.textContent = formatUsd(data.totalEscrow);
    if (withdrawnEl) withdrawnEl.textContent = formatUsd(data.totalAdminWithdrawals);
    return data;
  }

  async function loadRegistrations() {
    regCache = await apiFetch('/api/admin/registrations');
    const totalEl = document.getElementById('reg-total');
    if (totalEl) totalEl.textContent = String(regCache.total);
    updateRegFilter('all');
    return regCache;
  }

  function updateRegFilter(filter) {
    if (!regCache) return;
    let value = regCache.total;
    let label = 'All users';
    if (filter === 'creator') {
      value = regCache.creators;
      label = 'Creators';
    } else if (filter === 'business') {
      value = regCache.businesses;
      label = 'Brands / advertisers';
    }
    const filteredEl = document.getElementById('reg-filtered');
    if (filteredEl) filteredEl.textContent = label + ': ' + value;
    document.querySelectorAll('.reg-filter').forEach((btn) => {
      const active = btn.dataset.regFilter === filter;
      btn.classList.toggle('bg-admin-gold/20', active);
      btn.classList.toggle('text-amber-200', active);
      btn.classList.toggle('ring-1', active);
      btn.classList.toggle('ring-admin-gold/50', active);
      btn.classList.toggle('bg-slate-700/80', !active);
      btn.classList.toggle('text-slate-300', !active);
    });
  }

  function renderSearchResults(results) {
    const ul = document.getElementById('search-results');
    if (!ul) return;
    if (!results.length) {
      ul.innerHTML = '<li class="text-sm text-slate-500">No matches.</li>';
      return;
    }
    ul.innerHTML = results
      .map((u) => {
        const label = safeDisplayLabel(u);
        const meta =
          u.role === 'creator'
            ? (u.uniqueCode || '—') + (u.profile?.niche ? ' · ' + u.profile.niche : '')
            : u.profile?.companyName || u.email;
        const href = safeDashboardUrl(u);
        return (
          '<li class="flex items-center justify-between gap-2 rounded-xl border border-slate-700 bg-slate-900/60 px-3 py-2">' +
          '<div><p class="font-medium text-slate-200">' +
          escapeHtml(label) +
          '</p><p class="text-xs text-slate-500">' +
          escapeHtml(u.role) +
          ' · ' +
          escapeHtml(meta) +
          '</p></div>' +
          '<a href="' +
          href +
          '" class="shrink-0 rounded-lg bg-admin-gold/20 px-3 py-1.5 text-xs font-semibold text-amber-200 hover:bg-admin-gold/35">View only</a>' +
          '</li>'
        );
      })
      .join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  async function runSearch(q) {
    if (!q.trim()) {
      const resultsEl = document.getElementById('search-results');
      if (resultsEl) resultsEl.innerHTML = '';
      return;
    }
    const data = await apiFetch('/api/admin/search?q=' + encodeURIComponent(q.trim()));
    renderSearchResults(data.results || []);
  }

  function feeBreakdownHtml(fb) {
    if (!fb || !fb.percentages) return '<p class="text-slate-500">No fee data yet.</p>';
    const p = fb.percentages || {};
    return (
      '<div class="mb-4 grid grid-cols-3 gap-2 text-center">' +
      '<div class="rounded-lg bg-amber-950/50 p-3"><p class="text-xs text-slate-400">Deposits (10%)</p><p class="font-bold text-amber-400">' +
      formatUsd(fb.deposit || 0) +
      '</p><p class="text-xs text-slate-500">' +
      (p.deposit || 10) +
      '%</p></div>' +
      '<div class="rounded-lg bg-slate-800 p-3"><p class="text-xs text-slate-400">Tips (5%)</p><p class="font-bold text-white">' +
      formatUsd(fb.tip || 0) +
      '</p><p class="text-xs text-slate-500">' +
      (p.tip || 5) +
      '%</p></div>' +
      '<div class="rounded-lg bg-slate-800 p-3"><p class="text-xs text-slate-400">Withdrawals (3%)</p><p class="font-bold text-admin-gold">' +
      formatUsd(fb.withdrawal || 0) +
      '</p><p class="text-xs text-slate-500">' +
      (p.withdrawal || 3) +
      '%</p></div>' +
      '</div>'
    );
  }

  async function showEscrowHistory() {
    openModal('Escrow funding history', '<p class="text-slate-500">Loading…</p>');
    const data = await apiFetch('/api/admin/escrow-history');
    const rows = (data.history || [])
      .map((tx) => {
        const u = tx.fromUserId || {};
        const who = u.profile?.companyName || u.uniqueCode || u.email || 'Unknown';
        return (
          '<tr class="border-b border-slate-800">' +
          '<td class="py-2 pr-2">' + escapeHtml(who) + '</td>' +
          '<td class="py-2 pr-2">' + formatUsd(tx.netAmount) + '</td>' +
          '<td class="py-2 text-slate-500">' + formatDate(tx.createdAt) + '</td>' +
          '</tr>'
        );
      })
      .join('');
    document.getElementById('modal-body').innerHTML =
      '<table class="w-full text-left text-sm"><thead><tr class="text-slate-500"><th class="pb-2">Depositor</th><th>Amount</th><th>When</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="py-4 text-slate-500">No deposits yet.</td></tr>') +
      '</tbody></table>';
  }

  async function showWithdrawalHistory() {
    openModal('Profit wallet withdrawals', '<p class="text-slate-500">Loading…</p>');
    const [hist, metrics] = await Promise.all([
      apiFetch('/api/admin/profit-withdrawal-history'),
      metricsCache ? Promise.resolve(metricsCache) : loadMetrics(),
    ]);
    let html = feeBreakdownHtml(metrics.feeBreakdown);
    const rows = (hist.history || [])
      .map(
        (tx) =>
          '<tr class="border-b border-slate-800"><td class="py-2">' +
          formatUsd(tx.grossAmount) +
          '</td><td class="py-2 text-slate-500">' +
          formatDate(tx.createdAt) +
          '</td><td class="py-2 text-slate-500">' +
          escapeHtml(tx.metadata?.payoutMethod || '—') +
          '</td></tr>'
      )
      .join('');
    html +=
      '<table class="w-full text-left"><thead><tr class="text-slate-500"><th>Amount</th><th>When</th><th>Method</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="py-4 text-slate-500">No withdrawals yet.</td></tr>') +
      '</tbody></table>';
    document.getElementById('modal-body').innerHTML = html;
  }

  function initCharts() {
    if (!regCache || !metricsCache) return;
    const regCtx = document.getElementById('chart-registrations');
    const feeCtx = document.getElementById('chart-fees');
    if (!regCtx || !feeCtx) return;
    if (chartReg) chartReg.destroy();
    if (chartFees) chartFees.destroy();

    chartReg = new Chart(regCtx, {
      type: 'bar',
      data: {
        labels: ['Creators', 'Brands'],
        datasets: [{
          label: 'Users',
          data: [regCache.creators, regCache.businesses],
          backgroundColor: ['#7c3aed', '#6366f1'],
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
        },
      },
    });

    const fb = metricsCache.feeBreakdown || {};
    chartFees = new Chart(feeCtx, {
      type: 'doughnut',
      data: {
        labels: ['Deposits 10%', 'Tips 5%', 'Withdrawals 3%'],
        datasets: [{
          data: [fb.deposit || 0, fb.tip || 0, fb.withdrawal || 0],
          backgroundColor: ['#d97706', '#475569', '#f59e0b'],
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { labels: { color: '#cbd5e1' } } },
      },
    });
  }

  function setPayoutTab(method) {
    payoutMethod = method;
    document.querySelectorAll('.payout-tab').forEach((btn) => {
      const on = btn.dataset.payout === method;
      btn.classList.toggle('bg-admin-gold/25', on);
      btn.classList.toggle('text-amber-100', on);
      btn.classList.toggle('ring-1', on);
      btn.classList.toggle('ring-admin-gold', on);
      btn.classList.toggle('bg-slate-700', !on);
      btn.classList.toggle('text-slate-300', !on);
    });
    document.querySelectorAll('.payout-fields').forEach((el) => el.classList.add('hidden'));
    const target = document.getElementById('payout-' + method);
    if (target) target.classList.remove('hidden');
  }

  function payoutDetails() {
    if (payoutMethod === 'mpesa') {
      return { phoneNumber: document.getElementById('mpesa-phone')?.value.trim() || '' };
    }
    if (payoutMethod === 'paypal') {
      return { paypalEmail: document.getElementById('paypal-email')?.value.trim() || '' };
    }
    return {
      bankName: document.getElementById('swift-bank')?.value.trim() || '',
      accountHolderName: document.getElementById('swift-holder')?.value.trim() || '',
      accountNumber: document.getElementById('swift-account')?.value.trim() || '',
      swiftCode: document.getElementById('swift-code')?.value.trim() || '',
    };
  }

  async function previewWithdraw(amountUsd) {
    const previewEl = document.getElementById('withdraw-preview');
    if (!previewEl) return;
    if (!amountUsd || amountUsd <= 0) {
      previewEl.textContent = '';
      return;
    }
    try {
      const data = await apiFetch('/api/wallet/withdraw/preview', {
        method: 'POST',
        body: JSON.stringify({ amountUsd }),
      });
      const p = data.preview;
      previewEl.textContent = 'You receive ' + formatUsd(p.netToUserUsd) + (p.feeUsd > 0 ? ' (fee ' + formatUsd(p.feeUsd) + ')' : ' · admin fee waived');
    } catch (e) {
      previewEl.textContent = e.message;
    }
  }

  // Event listeners with null checks
  const profitCard = document.getElementById('card-profit');
  if (profitCard) profitCard.addEventListener('click', () => {
    document.getElementById('withdraw-section')?.scrollIntoView({ behavior: 'smooth' });
  });

  const escrowCard = document.getElementById('card-escrow');
  if (escrowCard) escrowCard.addEventListener('click', showEscrowHistory);

  const withdrawnCard = document.getElementById('card-withdrawn');
  if (withdrawnCard) withdrawnCard.addEventListener('click', showWithdrawalHistory);

  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(e.target.value), 350);
    });
  }

  document.querySelectorAll('.reg-filter').forEach((btn) => {
    btn.addEventListener('click', () => updateRegFilter(btn.dataset.regFilter));
  });

  const toggleBtn = document.getElementById('toggle-demographics');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const panel = document.getElementById('demographics-panel');
      if (!panel) return;
      const open = panel.classList.toggle('hidden');
      const chevron = document.getElementById('demographics-chevron');
      if (chevron) chevron.textContent = open ? '▼' : '▲';
      toggleBtn.setAttribute('aria-expanded', String(!open));
      if (!open) initCharts();
    });
    toggleBtn.setAttribute('aria-expanded', 'false');
  }

  document.querySelectorAll('.payout-tab').forEach((btn) => {
    btn.addEventListener('click', () => setPayoutTab(btn.dataset.payout));
  });

  const withdrawAmount = document.getElementById('withdraw-amount');
  if (withdrawAmount) {
    withdrawAmount.addEventListener('input', (e) => {
      previewWithdraw(parseFloat(e.target.value));
    });
  }

  const withdrawForm = document.getElementById('withdraw-form');
  if (withdrawForm) {
    withdrawForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return;
      const amountUsd = parseFloat(document.getElementById('withdraw-amount')?.value || '0');
      const btn = document.getElementById('withdraw-submit');
      isSubmitting = true;
      if (btn) btn.disabled = true;
      try {
        await apiFetch('/api/wallet/withdraw', {
          method: 'POST',
          body: JSON.stringify({
            amountUsd,
            payoutMethod,
            payoutDetails: payoutDetails(),
          }),
        });
        showAlert('Withdrawal completed.', 'success');
        if (withdrawForm) withdrawForm.reset();
        const previewEl = document.getElementById('withdraw-preview');
        if (previewEl) previewEl.textContent = '';
        await loadMetrics();
      } catch (err) {
        showAlert(err.message);
      } finally {
        isSubmitting = false;
        if (btn) btn.disabled = false;
      }
    });
  }

  const modalClose = document.getElementById('modal-close');
  if (modalClose) modalClose.addEventListener('click', closeModal);

  const modal = document.getElementById('modal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
  }

  const logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      if (clearSession) clearSession();
      window.location.href = '/signup.html';
    });
  }

  (async function init() {
    initHeader();
    try {
      await Promise.all([loadMetrics(), loadRegistrations()]);
    } catch (err) {
      if (err.status === 401 || err.status === 403) {
        if (clearSession) clearSession();
        window.location.href = '/signup.html?login=1';
        return;
      }
      showAlert(err.message || 'Failed to load dashboard');
    }
  })();
</script>
