<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pebeto — Join the Creator Economy</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c0a 0%, #1f1408 50%, #0f0c0a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Split Layout */
    .auth-wrapper {
      max-width: 1200px;
      width: 100%;
      display: flex;
      background: rgba(20, 15, 12, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 140, 66, 0.2);
    }

    /* Left Side - Hero Section */
    .hero-section {
      flex: 1;
      background: linear-gradient(135deg, rgba(255, 140, 66, 0.15), rgba(224, 102, 44, 0.08));
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .hero-icon i {
      font-size: 32px;
      color: white;
    }

    .hero-section h2 {
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .hero-section p {
      font-size: 16px;
      color: #c0a090;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .features-list {
      list-style: none;
    }

    .features-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #d0b0a0;
      font-size: 14px;
    }

    .features-list li i {
      width: 24px;
      color: #ffaa77;
      font-size: 18px;
    }

    /* Right Side - Form Section */
    .form-section {
      flex: 1;
      padding: 48px 48px;
    }

    .form-section h3 {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .form-section > p {
      color: #c0a090;
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* Role Selector */
    .role-selector {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 60px;
      margin-bottom: 32px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      color: #c0a090;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .role-btn.active {
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      color: white;
    }

    /* Form Inputs */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #ffccaa;
      margin-bottom: 6px;
    }

    .input-group label i {
      margin-right: 6px;
      font-size: 11px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 140, 66, 0.25);
      border-radius: 16px;
      font-size: 14px;
      color: white;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #ff8c42;
      background: rgba(255, 140, 66, 0.08);
    }

    .input-group input::placeholder {
      color: #6a5040;
    }

    /* Password with toggle */
    .password-input {
      position: relative;
    }

    .password-input input {
      padding-right: 48px;
    }

    .toggle-pwd {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ffaa77;
      cursor: pointer;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      margin-top: 12px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 140, 66, 0.35);
    }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ffaaaa;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #aaffaa;
    }

    /* Panels */
    .signup-panel {
      display: none;
    }

    .signup-panel.active {
      display: block;
    }

    /* Divider */
    .divider {
      text-align: center;
      margin: 24px 0;
      color: #6a5040;
      font-size: 12px;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 45%;
      height: 1px;
      background: rgba(255, 140, 66, 0.2);
    }

    .divider::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      width: 45%;
      height: 1px;
      background: rgba(255, 140, 66, 0.2);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #ffaa77;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .auth-wrapper {
        flex-direction: column;
        max-width: 500px;
      }
      
      .hero-section {
        padding: 32px 32px;
        text-align: center;
      }
      
      .hero-icon {
        margin: 0 auto 24px;
      }
      
      .features-list {
        text-align: left;
        max-width: 280px;
        margin: 0 auto;
      }
      
      .form-section {
        padding: 32px 32px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    
    <!-- Left Side - Hero -->
    <div class="hero-section">
      <div class="hero-icon">
        <i class="fas fa-hand-peace"></i>
      </div>
      <h2>Start your creator journey</h2>
      <p>Join thousands of creators and brands already growing together on Pebeto.</p>
      
      <ul class="features-list">
        <li><i class="fas fa-check-circle"></i> Connect with brands</li>
        <li><i class="fas fa-wallet"></i> Secure escrow payments</li>
        <li><i class="fas fa-chart-line"></i> Grow your influence</li>
        <li><i class="fas fa-globe"></i> Global payment options</li>
      </ul>
    </div>
    
    <!-- Right Side - Form -->
    <div class="form-section">
      <h3>Create an account</h3>
      <p>Choose how you want to use Pebeto</p>
      
      <!-- Role Selector -->
      <div class="role-selector">
        <button class="role-btn active" data-role="creator">🎨 I'm a Creator</button>
        <button class="role-btn" data-role="business">🏢 I'm a Brand</button>
      </div>
      
      <!-- Alert -->
      <div id="alert" class="alert" style="display: none;"></div>
      
      <!-- Creator Form -->
      <div id="creator-form-container" class="signup-panel active">
        <form id="creator-signup">
          <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email address</label>
            <input type="email" id="creator-email" placeholder="you@example.com" required />
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-tag"></i> Niche / Category</label>
            <input type="text" id="creator-niche" placeholder="Music, Comedy, Fashion, Tech..." required />
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="password-input">
              <input type="password" id="creator-password" placeholder="Create a password" required />
              <button type="button" class="toggle-pwd" data-target="creator-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-check-circle"></i> Confirm password</label>
            <div class="password-input">
              <input type="password" id="creator-confirm" placeholder="Confirm your password" required />
              <button type="button" class="toggle-pwd" data-target="creator-confirm">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="submit-btn" id="creator-submit">
            <i class="fas fa-rocket"></i> Join as Creator
          </button>
        </form>
      </div>
      
      <!-- Brand Form -->
      <div id="brand-form-container" class="signup-panel">
        <form id="brand-signup">
          <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email address</label>
            <input type="email" id="brand-email" placeholder="you@company.com" required />
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-building"></i> Company / Brand name</label>
            <input type="text" id="brand-company" placeholder="Your business name" required />
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-globe"></i> Website (optional)</label>
            <input type="url" id="brand-website" placeholder="https://yourcompany.com" />
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="password-input">
              <input type="password" id="brand-password" placeholder="Create a password" required />
              <button type="button" class="toggle-pwd" data-target="brand-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="input-group">
            <label><i class="fas fa-check-circle"></i> Confirm password</label>
            <div class="password-input">
              <input type="password" id="brand-confirm" placeholder="Confirm your password" required />
              <button type="button" class="toggle-pwd" data-target="brand-confirm">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="submit-btn" id="brand-submit">
            <i class="fas fa-building"></i> Join as Brand
          </button>
        </form>
      </div>
      
      <div class="divider"></div>
      
      <div class="login-link">
        <a href="/login.html">Already have an account? Sign in →</a>
      </div>
    </div>
    
  </div>
  
  <script>
    // Role switching
    const roleBtns = document.querySelectorAll('.role-btn');
    const creatorPanel = document.getElementById('creator-form-container');
    const brandPanel = document.getElementById('brand-form-container');
    const alertDiv = document.getElementById('alert');
    
    roleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.dataset.role;
        roleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (role === 'creator') {
          creatorPanel.classList.add('active');
          brandPanel.classList.remove('active');
        } else {
          brandPanel.classList.add('active');
          creatorPanel.classList.remove('active');
        }
        alertDiv.style.display = 'none';
      });
    });
    
    // Toggle password visibility
    document.querySelectorAll('.toggle-pwd').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });
    
    function showAlert(msg, type) {
      alertDiv.style.display = 'flex';
      alertDiv.className = `alert alert-${type}`;
      alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${msg}`;
      setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
    }
    
    function saveSession(token, user) {
      localStorage.setItem('pebeto_token', token);
      localStorage.setItem('pebeto_user', JSON.stringify(user));
      if (window.PebetoApi?.saveSession) window.PebetoApi.saveSession(token, user);
    }
    
    // Creator Signup
    document.getElementById('creator-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('creator-email').value.trim();
      const niche = document.getElementById('creator-niche').value.trim();
      const password = document.getElementById('creator-password').value;
      const confirm = document.getElementById('creator-confirm').value;
      
      if (!email) return showAlert('Email required', 'error');
      if (!niche) return showAlert('Niche required', 'error');
      if (password.length < 8) return showAlert('Password must be 8+ characters', 'error');
      if (password !== confirm) return showAlert('Passwords do not match', 'error');
      
      const btn = document.getElementById('creator-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating...';
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email, password, role: 'creator',
            profile: { stageName: email.split('@')[0], niche, displayName: email.split('@')[0] }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');
        
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const loginData = await loginRes.json();
        
        if (loginRes.ok) {
          saveSession(loginData.token, loginData.user);
          showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/creator-hub.html', 1500);
        } else {
          showAlert('Account created! Please sign in.', 'success');
          setTimeout(() => window.location.href = '/login.html', 1500);
        }
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rocket"></i> Join as Creator';
      }
    });
    
    // Brand Signup
    document.getElementById('brand-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('brand-email').value.trim();
      const company = document.getElementById('brand-company').value.trim();
      const website = document.getElementById('brand-website').value.trim();
      const password = document.getElementById('brand-password').value;
      const confirm = document.getElementById('brand-confirm').value;
      
      if (!email) return showAlert('Email required', 'error');
      if (!company) return showAlert('Company name required', 'error');
      if (password.length < 8) return showAlert('Password must be 8+ characters', 'error');
      if (password !== confirm) return showAlert('Passwords do not match', 'error');
      
      const btn = document.getElementById('brand-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating...';
      
      try {
        const profile = { companyName: company, displayName: company };
        if (website) profile.website = website;
        
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role: 'business', profile })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');
        
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const loginData = await loginRes.json();
        
        if (loginRes.ok) {
          saveSession(loginData.token, loginData.user);
          showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/business.html', 1500);
        } else {
          showAlert('Account created! Please sign in.', 'success');
          setTimeout(() => window.location.href = '/login.html', 1500);
        }
      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-building"></i> Join as Brand';
      }
    });
  </script>
</body>
</html>
