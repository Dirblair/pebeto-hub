<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pebeto — Join as Creator or Brand</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a1a0e 50%, #1f1408 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Main Container - Centered */
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: rgba(25, 20, 18, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 40px 36px;
      border: 1px solid rgba(255, 140, 66, 0.25);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 6px 18px rgba(255, 140, 66, 0.35);
    }
    
    .logo-icon i {
      font-size: 28px;
      color: white;
    }
    
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.3px;
    }
    
    .logo p {
      font-size: 13px;
      color: #ffaa77;
      margin-top: 5px;
    }

    /* Role Tabs */
    .role-tabs {
      display: flex;
      gap: 14px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      border-radius: 60px;
      margin-bottom: 32px;
    }
    
    .role-tab {
      flex: 1;
      padding: 12px 10px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #c0a090;
      font-family: 'Inter', sans-serif;
    }
    
    .role-tab.active {
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.3);
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 22px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #ffccaa;
      margin-bottom: 8px;
    }
    
    label i {
      margin-right: 6px;
      color: #ffaa77;
      width: 18px;
    }
    
    .input-with-icon {
      position: relative;
    }
    
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #ffaa77;
      font-size: 15px;
    }
    
    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 140, 66, 0.3);
      border-radius: 14px;
      font-size: 15px;
      color: white;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #ff8c42;
      background: rgba(255, 140, 66, 0.08);
      box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.15);
    }
    
    input::placeholder {
      color: #7a6050;
    }
    
    /* Password wrapper for toggle visibility */
    .password-wrapper {
      position: relative;
    }
    
    .password-wrapper input {
      padding-right: 48px;
    }
    
    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ffaa77;
      cursor: pointer;
      font-size: 16px;
    }
    
    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff8c42, #e0662c);
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 12px;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 14px rgba(255, 140, 66, 0.35);
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 140, 66, 0.45);
    }
    
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Error/Success Messages */
    .alert {
      padding: 14px;
      border-radius: 14px;
      font-size: 13px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ffaaaa;
    }
    
    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #aaffaa;
    }
    
    .alert i {
      font-size: 16px;
    }
    
    /* Footer */
    .footer-text {
      text-align: center;
      margin-top: 28px;
      color: #a08070;
      font-size: 12px;
    }
    
    .footer-text a {
      color: #ffaa77;
      text-decoration: none;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
    /* Hide panels */
    .panel {
      display: none;
    }
    
    .panel.active-panel {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Divider */
    hr {
      border: none;
      height: 1px;
      background: rgba(255, 140, 66, 0.2);
      margin: 20px 0;
    }
    
    /* Already have account link */
    .login-link {
      text-align: center;
      margin-top: 18px;
    }
    
    .login-link a {
      color: #ffaa77;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    
    /* Responsive */
    @media (max-width: 500px) {
      .card {
        padding: 30px 22px;
      }
      
      .role-tabs {
        gap: 10px;
      }
      
      .role-tab {
        padding: 10px 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      
      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-hand-peace"></i>
        </div>
        <h1>Pebeto</h1>
        <p>Creator's Hub</p>
      </div>
      
      <!-- Role Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="creator">🎨 Creator</button>
        <button class="role-tab" data-role="business">🏢 Brand</button>
      </div>
      
      <!-- Alert Message -->
      <div id="alert" class="alert" style="display: none;"></div>
      
      <!-- Creator Signup Panel -->
      <div id="creator-panel" class="panel active-panel">
        <form id="creator-form">
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="creator-email" placeholder="hello@example.com" required />
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-star"></i> Niche / Category</label>
            <div class="input-with-icon">
              <i class="fas fa-tag"></i>
              <input type="text" id="creator-niche" placeholder="e.g., Music, Comedy, Fashion, Tech, Art" required />
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="password-wrapper">
              <i class="fas fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 1;"></i>
              <input type="password" id="creator-password" placeholder="At least 8 characters" style="padding-left: 48px;" required />
              <button type="button" class="toggle-password" data-target="creator-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-check-circle"></i> Confirm Password</label>
            <div class="password-wrapper">
              <i class="fas fa-check" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 1;"></i>
              <input type="password" id="creator-confirm-password" placeholder="Confirm your password" style="padding-left: 48px;" required />
              <button type="button" class="toggle-password" data-target="creator-confirm-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="submit-btn" id="creator-submit">
            <i class="fas fa-rocket"></i> Join as Creator
          </button>
        </form>
      </div>
      
      <!-- Brand Signup Panel -->
      <div id="brand-panel" class="panel">
        <form id="brand-form">
          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="brand-email" placeholder="hello@example.com" required />
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-building"></i> Company / Business Name</label>
            <div class="input-with-icon">
              <i class="fas fa-briefcase"></i>
              <input type="text" id="brand-company" placeholder="Your business name" required />
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-globe"></i> Website URL (optional)</label>
            <div class="input-with-icon">
              <i class="fas fa-link"></i>
              <input type="url" id="brand-website" placeholder="https://yourcompany.com" />
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="password-wrapper">
              <i class="fas fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 1;"></i>
              <input type="password" id="brand-password" placeholder="At least 8 characters" style="padding-left: 48px;" required />
              <button type="button" class="toggle-password" data-target="brand-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label><i class="fas fa-check-circle"></i> Confirm Password</label>
            <div class="password-wrapper">
              <i class="fas fa-check" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 1;"></i>
              <input type="password" id="brand-confirm-password" placeholder="Confirm your password" style="padding-left: 48px;" required />
              <button type="button" class="toggle-password" data-target="brand-confirm-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="submit-btn" id="brand-submit">
            <i class="fas fa-building"></i> Join as Brand
          </button>
        </form>
      </div>
      
      <!-- Already have account link -->
      <div class="login-link">
        <a href="/login.html">Already have an account? Sign in →</a>
      </div>
      
      <div class="footer-text">
        By joining, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </div>
      
    </div>
  </div>
  
  <script>
    // Tab Switching
    const creatorPanel = document.getElementById('creator-panel');
    const brandPanel = document.getElementById('brand-panel');
    const roleTabs = document.querySelectorAll('.role-tab');
    const alertDiv = document.getElementById('alert');
    
    let currentRole = 'creator';
    
    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const role = tab.dataset.role;
        currentRole = role;
        
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        if (role === 'creator') {
          creatorPanel.classList.add('active-panel');
          brandPanel.classList.remove('active-panel');
        } else {
          brandPanel.classList.add('active-panel');
          creatorPanel.classList.remove('active-panel');
        }
        
        hideAlert();
      });
    });
    
    // Password visibility toggle
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.dataset.target;
        const input = document.getElementById(targetId);
        const icon = button.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });
    
    function showAlert(message, type = 'error') {
      alertDiv.style.display = 'flex';
      alertDiv.className = `alert alert-${type}`;
      alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}`;
      setTimeout(() => {
        alertDiv.style.display = 'none';
      }, 5000);
    }
    
    function hideAlert() {
      alertDiv.style.display = 'none';
    }
    
    // Helper to save session
    function saveSession(token, user) {
      localStorage.setItem('pebeto_token', token);
      localStorage.setItem('pebeto_user', JSON.stringify(user));
      if (window.PebetoApi && window.PebetoApi.saveSession) {
        window.PebetoApi.saveSession(token, user);
      }
    }
    
    // Redirect after login
    function redirectToDashboard(role) {
      if (role === 'admin') window.location.href = '/admin.html';
      else if (role === 'business') window.location.href = '/business.html';
      else window.location.href = '/creator-hub.html';
    }
    
    // CREATOR SIGNUP
    document.getElementById('creator-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const email = document.getElementById('creator-email').value.trim();
      const niche = document.getElementById('creator-niche').value.trim();
      const password = document.getElementById('creator-password').value;
      const confirmPassword = document.getElementById('creator-confirm-password').value;
      
      if (!email) {
        showAlert('Email address is required');
        return;
      }
      if (!niche) {
        showAlert('Please enter your niche/category');
        return;
      }
      if (password.length < 8) {
        showAlert('Password must be at least 8 characters');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Passwords do not match');
        return;
      }
      
      const btn = document.getElementById('creator-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating account...';
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            role: 'creator',
            profile: {
              stageName: email.split('@')[0],
              niche: niche,
              displayName: email.split('@')[0]
            },
            preferredCurrency: 'USD'
          })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.message || data.error || 'Registration failed');
        }
        
        showAlert('Account created successfully! Redirecting to your dashboard...', 'success');
        
        // Auto-login after registration
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const loginData = await loginRes.json();
        
        if (loginRes.ok) {
          saveSession(loginData.token, loginData.user);
          setTimeout(() => redirectToDashboard('creator'), 1500);
        } else {
          setTimeout(() => window.location.href = '/login.html', 1500);
        }
        
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rocket"></i> Join as Creator';
      }
    });
    
    // BRAND SIGNUP
    document.getElementById('brand-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      
      const email = document.getElementById('brand-email').value.trim();
      const companyName = document.getElementById('brand-company').value.trim();
      const website = document.getElementById('brand-website').value.trim();
      const password = document.getElementById('brand-password').value;
      const confirmPassword = document.getElementById('brand-confirm-password').value;
      
      if (!email) {
        showAlert('Email address is required');
        return;
      }
      if (!companyName) {
        showAlert('Company/Business name is required');
        return;
      }
      if (password.length < 8) {
        showAlert('Password must be at least 8 characters');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Passwords do not match');
        return;
      }
      
      const btn = document.getElementById('brand-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating account...';
      
      try {
        const profile = {
          companyName: companyName,
          displayName: companyName
        };
        if (website) profile.website = website;
        
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            role: 'business',
            profile,
            preferredCurrency: 'USD'
          })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.message || data.error || 'Registration failed');
        }
        
        showAlert('Account created successfully! Redirecting to your dashboard...', 'success');
        
        // Auto-login after registration
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const loginData = await loginRes.json();
        
        if (loginRes.ok) {
          saveSession(loginData.token, loginData.user);
          setTimeout(() => redirectToDashboard('business'), 1500);
        } else {
          setTimeout(() => window.location.href = '/login.html', 1500);
        }
        
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-building"></i> Join as Brand';
      }
    });
  </script>
</body>
</html>
