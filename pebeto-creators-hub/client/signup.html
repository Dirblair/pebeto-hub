<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join — Pebeto Creator's Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pebeto: {
              ink: '#0f172a',
              violet: '#7c3aed',
              sky: '#0ea5e9',
              navy: '#1e3a5f',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-pebeto-ink to-indigo-950 font-sans text-slate-100 antialiased">
  <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-pebeto-violet to-pebeto-sky text-sm font-bold text-white shadow-lg shadow-violet-500/30">P</span>
        <div>
          <p class="text-lg font-semibold tracking-tight">Pebeto Creator's Hub</p>
          <p class="text-xs text-slate-400">Creators &amp; brands, one secure platform</p>
        </div>
      </a>
    </header>

    <main class="flex flex-1 flex-col items-center justify-center">
      <div class="w-full max-w-lg">
        <div class="mb-6 flex rounded-2xl border border-white/10 bg-white/5 p-1 backdrop-blur">
          <button type="button" id="tab-register" data-panel="panel-register" class="tab-btn flex-1 rounded-xl px-4 py-2.5 text-sm font-semibold transition bg-white/15 text-white shadow">Create account</button>
          <button type="button" id="tab-login" data-panel="panel-login" class="tab-btn flex-1 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-400 transition hover:text-white">Sign in</button>
        </div>

        <div id="alert" class="mb-4 hidden rounded-xl border px-4 py-3 text-sm" role="alert"></div>

        <section id="panel-register" class="panel rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/40 backdrop-blur sm:p-8">
          <h1 class="text-2xl font-bold tracking-tight">Get started</h1>
          <p class="mt-1 text-sm text-slate-400">Choose how you want to use the hub, then complete your profile.</p>

          <div class="mt-6 grid grid-cols-2 gap-3">
            <button type="button" data-role="creator" class="role-card rounded-2xl border-2 border-pebeto-violet bg-pebeto-violet/20 p-4 text-left transition hover:border-pebeto-sky">
              <span class="text-2xl" aria-hidden="true">🎬</span>
              <p class="mt-2 font-semibold">Content creator</p>
            </button>
            <button type="button" data-role="business" class="role-card rounded-2xl border-2 border-white/10 bg-white/5 p-4 text-left transition hover:border-pebeto-sky">
              <span class="text-2xl" aria-hidden="true">🏢</span>
              <p class="mt-2 font-semibold">Brand / advertiser</p>
            </button>
          </div>

          <!-- Hidden to keep script functional -->
          <div id="role-instructions" class="hidden"></div>

          <form id="register-form" class="mt-6 space-y-4" novalidate>
            <input type="hidden" name="role" id="role-input" value="creator" />

            <div id="creator-fields" class="space-y-4">
              <div>
                <label for="stageName" class="mb-1.5 block text-sm font-medium">Stage name <span class="text-rose-400">*</span></label>
                <input id="stageName" type="text" placeholder="e.g. DJ Nova" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
              <div>
                <label for="niche" class="mb-1.5 block text-sm font-medium">Niche <span class="text-rose-400">*</span></label>
                <input id="niche" type="text" placeholder="e.g. Comedian, Vlogger" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
            </div>

            <div id="business-fields" class="hidden space-y-4">
              <div>
                <label for="companyName" class="mb-1.5 block text-sm font-medium">Company / brand name <span class="text-rose-400">*</span></label>
                <input id="companyName" type="text" placeholder="Your business name" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
              <div>
                <label for="website" class="mb-1.5 block text-sm font-medium">Website <span class="text-rose-400">*</span></label>
                <input id="website" type="url" placeholder="https://" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
            </div>

            <div>
              <label for="email" class="mb-1.5 block text-sm font-medium">Email <span class="text-rose-400">*</span></label>
              <input id="email" type="email" required class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="password" class="mb-1.5 block text-sm font-medium">Password <span class="text-rose-400">*</span></label>
                <input id="password" type="password" required minlength="8" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
              <div>
                <label for="passwordConfirm" class="mb-1.5 block text-sm font-medium">Confirm <span class="text-rose-400">*</span></label>
                <input id="passwordConfirm" type="password" required class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm focus:border-pebeto-sky focus:outline-none" />
              </div>
            </div>

            <button type="submit" id="register-submit" class="w-full rounded-xl bg-gradient-to-r from-pebeto-violet to-pebeto-sky py-3 text-sm font-semibold text-white shadow-lg transition hover:opacity-95">
              Create account
            </button>
          </form>
        </section>
        
        <!-- Login section left as is -->
        <section id="panel-login" class="panel hidden rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl backdrop-blur sm:p-8">
           <!-- Login form content -->
        </section>
      </div>
    </main>
  </div>

  <script>
    // [PRESERVED SCRIPT LOGIC]
    const roleInstructions = { /* ... your original object ... */ };
    let selectedRole = 'creator';
    // ... (rest of your original functions) ...

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      // Updated validation logic for your requirements
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (password !== passwordConfirm) return showAlert('Passwords do not match.');
      
      const profile = {};
      if (selectedRole === 'creator') {
        const stageName = document.getElementById('stageName').value.trim();
        const niche = document.getElementById('niche').value.trim();
        if (!stageName || !niche) return showAlert('Stage name and Niche are required.');
        profile.stageName = stageName;
        profile.niche = niche;
        profile.displayName = stageName;
      } else {
        const companyName = document.getElementById('companyName').value.trim();
        const website = document.getElementById('website').value.trim();
        if (!companyName || !website) return showAlert('Company name and Website are required.');
        profile.companyName = companyName;
        profile.website = website;
        profile.displayName = companyName;
      }
      
      // ... (rest of the fetch logic) ...
    });
  </script>
</body>
</html>
